<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#efe6d8"/>
  <title>義大社工科｜設備</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* ══════════ 前台設備：窗邊葉影＋設備掛板＋登記簿（與設備後台 de-device 同一套）══════════ */
    :root {
      --ink: #2f2a24; --ink-2: #5b5348; --muted: #8f8579; --hair: #e3d9ca;
      --sage: #6f8a68; --terra: #b0603f;
      --engrave: #4a2d14;
      --sx: 14px; --sy: 24px; --ovc: 255,255,255; --ova: 0; --lamp: 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: #e6ddd0; }
    body {
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: var(--ink);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 14px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 寫實光影（牆面、窗光、葉影）── */
    #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }   /* 用最大視窗高度，手機網址列伸縮時不跳動（修改） */
    .grain {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: multiply;
    }
    .ambient-top {   /* 卡片：只稍微變暗，保持好讀 */
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: rgb(var(--ovc)); opacity: calc(var(--ova) * 0.38);
        mix-blend-mode: multiply;
    }
    /* 夜晚：背板稍微不透明一點，小字加深，維持好讀 */
    html.night .container { background-color: rgba(250,246,238,0.32); }
    html.night { --muted: #6f665b; }

    /* 寫實光影畫布＋牆面顆粒 */
    #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }   /* 用最大視窗高度，手機網址列伸縮時不跳動（修改） */
    .grain {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: multiply;
    }
    /* 夜間桌燈：卡片附近一圈暖光，晚上也看得清楚 */
    .lamp {
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,186,110,0.45), rgba(255,186,110,0) 70%);
        mix-blend-mode: soft-light; opacity: var(--lamp);
    }
    html.night .panel { background-color: rgba(250,246,238,0.32); }
    html.night { --muted: #6f665b; }

    /* ── 半透明紙卡 ── */
    .panel {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      border-radius: 6px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        linear-gradient(170deg, rgba(253,251,247,0.40) 0%, rgba(251,248,242,0.34) 45%, rgba(244,238,228,0.30) 100%);
      -webkit-backdrop-filter: blur(2.5px) saturate(1.1);
      backdrop-filter: blur(2.5px) saturate(1.1);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 0 0 1px rgba(120,100,70,0.08),
        2px 3px 4px rgba(70,50,30,0.10),
        calc(var(--sx) * 0.9) calc(var(--sy) * 1) 30px rgba(70,50,30,0.22),
        calc(var(--sx) * 2.2) calc(var(--sy) * 2.4) 70px rgba(70,50,30,0.20);
      animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* 頁首 */
    header { padding: 22px 22px 14px; text-align: center; position: relative; }
    .site-title {
      font-family: 'Noto Serif TC', serif; font-size: 1.8rem; font-weight: 700;
      letter-spacing: 0.14em; padding-left: 0.14em; color: var(--ink);
    }
    .site-sub {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 0.82rem; letter-spacing: 0.3em; color: var(--muted); margin-top: 6px;
    }
    .site-sub::before, .site-sub::after { content: ''; width: 30px; height: 1px; background: var(--hair); }
    #timeDisplay {
      display: block; margin-top: 40px; margin-bottom: 10px;   /* 放在返回鍵下方，避免重疊 */
      font-size: 0.92rem; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
    }
    .header-info { display: flex; align-items: center; justify-content: center; margin-top: 6px; }
    #userName { font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.12rem; font-weight: 700; color: #4f6b48; }
    /* 返回：小原木牌 */
    .btn-return {
      position: absolute; top: 16px; left: 16px;
      display: inline-flex; align-items: center; gap: 6px;
      height: 38px; padding: 0 14px 0 12px;
      border: none; border-radius: 4px; cursor: pointer;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='60'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.015 0.45' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
        linear-gradient(175deg, #e2c49c 0%, #cfa978 60%, #b98f5d 100%);
      background-size: 200px 38px, auto;
      box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), inset -2px -2px 0 rgba(80,50,20,0.18), 3px 5px 7px rgba(70,50,30,0.25);
      color: var(--engrave); font-family: 'Noto Serif TC', serif; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.18em;
      text-shadow: 0 1px 0 rgba(255,240,215,0.55), 0 -1px 0 rgba(70,40,15,0.2);
    }
    .btn-return:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), 1px 2px 3px rgba(70,50,30,0.25); }

    /* ══════════ 前台設備：與設備後台（de-device）同一套 ══════════ */
    .section { padding: 4px 16px 16px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .sec-title { font-family: 'Noto Serif TC', serif; font-size: 1.22rem; font-weight: 700; letter-spacing: 0.16em; }
    .req { color: #a8432c; }

    /* 說明：手寫小紙條，膠帶貼著 */
    .intro-card {
      position: relative; margin: 6px 6px 0; padding: 16px 16px 14px;
      background: linear-gradient(175deg, #fffef8, #f6f0e2);
      box-shadow: 0 0 0 1px rgba(120,100,70,0.08), 2px 3px 4px rgba(70,50,30,0.08), 6px 10px 16px rgba(70,50,30,0.12);
      transform: rotate(-0.8deg);
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.05rem; line-height: 1.7; color: #3a4252; text-align: center;
    }
    .intro-card::before {   /* 紙膠帶 */
      content: ''; position: absolute; top: -9px; left: 50%; width: 92px; height: 20px; margin-left: -46px;
      background: rgba(214,196,150,0.72); transform: rotate(-3deg);
      box-shadow: 0 1px 2px rgba(70,50,30,0.12);
    }

    /* 提前預借：黃色便利貼按鍵 */
    .reserve-card { padding: 0; }
    .btn-reserve {
      display: block; width: 100%; border: none; cursor: pointer; padding: 14px 12px 15px;
      background: linear-gradient(175deg, #fbe7a1, #f3d675);
      color: #5c4710; font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.18rem; font-weight: 700; letter-spacing: 0.06em;
      box-shadow: 2px 3px 5px rgba(70,50,30,0.18), 6px 10px 16px rgba(70,50,30,0.12);
      transform: rotate(-0.6deg);
      transition: transform .2s, background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-reserve:active { transform: rotate(-0.6deg) translateY(2px); }
    .reserve-card.active .btn-reserve { background: linear-gradient(175deg, #f7c9a8, #eaa982); color: #5c2a10; transform: rotate(0.8deg); }
    .reserve-date-wrap { display: none; margin-top: 14px; flex-direction: column; gap: 6px; min-width: 0; }
    .reserve-card.active .reserve-date-wrap { display: flex; }
    .purpose-label { display: block; font-size: 0.88rem; letter-spacing: 0.14em; color: #7d8aa0; font-weight: 700; }
    /* 日期框：外框自己畫，原生日期欄位透明疊在上面 */
    .date-box {
      position: relative; width: 100%; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4px; overflow: hidden;
      border-bottom: 1.5px solid rgba(60,70,90,0.45);
      transition: border-color .2s, background .2s;
    }
    .date-box-text { font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.32rem; font-weight: 700; color: #1e2733; white-space: nowrap; }
    .date-box-ic {
      width: 22px; height: 22px; flex-shrink: 0;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22' fill='none' stroke='%236c7686' stroke-width='1.6'><rect x='3' y='5' width='16' height='14' rx='2'/><path d='M3 9h16M7 3v4M15 3v4'/></svg>") no-repeat center;
    }
    .date-box:focus-within { border-bottom-color: #c9951a; background: rgba(243,214,117,0.12); }
    .date-box.error { border-bottom-color: #a8432c; background: rgba(168,67,44,0.06); }
    .reserve-date {
      position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
      border: 0; margin: 0; padding: 0; min-width: 0;
      -webkit-appearance: none; appearance: none; font-size: 16px; cursor: pointer;
    }
    .reserve-date::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .reserve-hint { font-size: 0.92rem; color: #7a4530; line-height: 1.55; font-family: 'LXGW WenKai TC', sans-serif; }

    /* 搜尋：底線輸入框 */
    .search-wrap { position: relative; }
    .search-icon-pos {
      position: absolute; left: 2px; top: 50%; width: 22px; height: 22px; margin-top: -11px; pointer-events: none;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22' fill='none' stroke='%236c7686' stroke-width='1.8' stroke-linecap='round'><circle cx='9.5' cy='9.5' r='6'/><path d='M14 14l5 5'/></svg>") no-repeat center;
    }
    .search-box {
      width: 100%; padding: 8px 4px 8px 32px; border: none; border-bottom: 1.5px solid rgba(60,70,90,0.45); border-radius: 0;
      background: transparent; outline: none; -webkit-appearance: none; appearance: none;
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.32rem; font-weight: 700; color: #1e2733;
    }
    .search-box:focus { border-bottom-color: #6f8a68; background: rgba(111,138,104,0.06); }
    .search-box::placeholder { color: #a9aeb6; font-weight: 500; }

    /* ── 設備掛板：洞洞板＋鑰匙牌 ── */
    #selected-count {
      display: none; padding: 2px 10px;
      border: 2px solid #c0392b; border-radius: 3px; color: #c0392b;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 0.92rem; letter-spacing: 0.1em;
      transform: rotate(-4deg); opacity: .85; mix-blend-mode: multiply;
    }
    .devices-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px;
      position: relative; border-radius: 4px; padding: 10px 12px 18px;
      background:
        radial-gradient(circle, rgba(70,45,20,0.55) 0 2.2px, transparent 2.8px) 0 0 / 22px 22px,
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.02 0.3' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
        linear-gradient(175deg, #d8b98e, #c4a072);
      box-shadow: inset 0 1px 0 rgba(255,240,215,0.5), inset 0 0 0 1px rgba(90,60,30,0.25), 6px 10px 18px rgba(70,50,30,0.22);
    }
    /* 每個設備＝一塊橫向上漆木牌，用黃銅圈掛在板上 */
    .device-card {
      --c1: #c78464; --c2: #a35d3f;
      position: relative; margin-top: 24px; min-height: 72px; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 18px 12px 12px; border-radius: 8px; cursor: pointer; text-align: center;
      color: #fff8ec;
      background:
        radial-gradient(circle at 50% 10px, #4a3a2a 0 2.6px, #d9b56a 3px 4.6px, #8a6a30 5px 5.6px, transparent 6px),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.45' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),
        radial-gradient(ellipse at 25% 20%, rgba(255,255,255,0.25), rgba(255,255,255,0) 60%),
        linear-gradient(175deg, var(--c1), var(--c2));
      background-size: auto, 200px 100%, auto, auto;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35), inset -2px -3px 0 rgba(40,25,10,0.16),
        calc(var(--sx) * 0.3) calc(var(--sy) * 0.25 + 3px) 6px rgba(60,40,22,0.32);
      transform-origin: 50% -14px;
      transition: rotate .45s cubic-bezier(.3,1.6,.5,1), translate .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .device-card:nth-child(4n+2) { --c1: #7892ad; --c2: #536f8b; }
    .device-card:nth-child(4n+3) { --c1: #cfab62; --c2: #a8833a; }
    .device-card:nth-child(4n+4) { --c1: #88a77a; --c2: #617f55; }
    .device-card::before {   /* 黃銅鑰匙圈 */
      content: ''; position: absolute; top: -17px; left: 50%; width: 20px; height: 22px; margin-left: -10px; border-radius: 50%;
      border: 2.5px solid #c49a4c; box-shadow: inset 0 0 0 1px rgba(255,235,180,0.6), 0 0 0 1px rgba(90,60,20,0.35);
    }
    .device-card:hover { rotate: 2.5deg; }
    .device-card:active { rotate: -1.5deg; }
    .device-icon { display: none; }
    .device-name.one-line { white-space: nowrap; letter-spacing: 0.02em; }   /* 有括號：同一行顯示（修改） */
    .device-card { padding-left: 8px; padding-right: 8px; }
    .device-name {
      display: block; max-width: 100%;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1.12rem; letter-spacing: 0.05em; line-height: 1.3;
      word-break: keep-all; overflow-wrap: normal;
      text-shadow: 0 -1px 0 rgba(40,25,10,0.35), 0 1px 0 rgba(255,255,255,0.15);   /* 雕刻字 */
    }
    /* 選取：木牌被拿起來，綁上紅色借用籤 */
    .device-card.selected {
      translate: 0 -4px; rotate: -3deg;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35), inset -2px -3px 0 rgba(40,25,10,0.16),
        0 0 0 3px rgba(255,244,214,0.95), 0 0 0 5px rgba(192,57,43,0.75),
        calc(var(--sx) * 0.6) calc(var(--sy) * 0.5 + 8px) 14px rgba(60,40,22,0.38);
    }
    .device-card.selected:hover { rotate: -3deg; }
    .device-card.selected::after {
      content: '借'; position: absolute; top: -10px; right: -8px;
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #fffaf0; border: 2px solid #c0392b; color: #c0392b;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 0.95rem;
      box-shadow: 1px 2px 3px rgba(60,30,15,0.3); rotate: 12deg; text-shadow: none;
    }
    .devices-empty {
      grid-column: 1 / -1; text-align: center; padding: 30px 0 18px;
      color: #4a2d14; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.14em;
      text-shadow: 0 1px 0 rgba(255,240,215,0.55);
    }

    /* 用途：紙上的底線選單 */
    .purpose-sheet {
      padding: 16px 16px 18px; border-radius: 2px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        linear-gradient(175deg, #fffdf6, #f6efdf);
      box-shadow: 0 0 0 1px rgba(120,100,70,0.10), 2px 3px 4px rgba(70,50,30,0.08), 6px 10px 18px rgba(70,50,30,0.12);
    }
    .purpose-sheet .purpose-label { margin-bottom: 4px; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: '▾'; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: #6c7686; pointer-events: none; font-size: 1.1rem; }
    .purpose-select {
      width: 100%; padding: 8px 24px 8px 2px; border: none; border-bottom: 1.5px solid rgba(60,70,90,0.45); border-radius: 0;
      background: transparent; outline: none; -webkit-appearance: none; appearance: none; cursor: pointer;
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.22rem; font-weight: 700; color: #1e2733;
      text-overflow: ellipsis;
    }
    .purpose-select:focus { border-bottom-color: #6f8a68; background: rgba(111,138,104,0.06); }
    .purpose-select.error { border-bottom-color: #a8432c; background: rgba(168,67,44,0.06); }

    /* 下方小木板按鍵 */
    .btn-row { display: flex; gap: 12px; padding: 4px 16px 18px; }
    .btn {
      flex: 1 1 0; height: 52px; padding: 0 16px; border: none; border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif TC', serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.14em;
      color: #fff8ec; text-shadow: 0 -1px 0 rgba(40,25,10,0.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset -2px -3px 0 rgba(40,25,10,0.18), 3px 5px 8px rgba(70,50,30,0.22);
      background-size: 240px 100%, auto;
    }
    .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 1px 2px 4px rgba(70,50,30,0.22); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-row .btn-submit { flex-grow: 1.6; }
    .btn-submit { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='2'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #88a77a, #617f55); }
    .btn-reset { color: #4a2d14; text-shadow: 0 1px 0 rgba(255,240,215,0.55);
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #e2c49c, #c9a171); }

    /* ── 預借排程：登記簿，每個項目各佔一行 ── */
    .btn-refresh {
      width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0;
      background: radial-gradient(circle at 35% 30%, #f6e3ad, #c2964a 60%, #8a6a30);
      color: #4a2d14; font-size: 1.15rem; font-weight: 700; line-height: 36px; padding: 0;
      box-shadow: inset 0 1px 0 rgba(255,250,230,0.7), 1px 3px 4px rgba(60,40,20,0.3);
      transition: transform .3s;
    }
    .btn-refresh:hover { transform: rotate(90deg); }
    .btn-refresh.spin { animation: spin 0.8s linear infinite; }
    .schedule-body {
      position: relative; overflow: hidden; padding: 4px 0 6px; border-radius: 3px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        linear-gradient(175deg, #fffdf6, #f8f2e4);
      box-shadow: 0 0 0 1px rgba(120,100,70,0.10), 2px 3px 4px rgba(70,50,30,0.08), 8px 12px 22px rgba(70,50,30,0.14);
    }
    .schedule-body::before {   /* 左邊紅色邊界線 */
      content: ''; position: absolute; top: 0; bottom: 0; left: 20px; width: 1.5px; background: rgba(200,70,60,0.45);
    }
    .schedule-table, .schedule-table tbody, .schedule-table tr, .schedule-table td { display: block; }
    .schedule-table { width: 100%; border-collapse: collapse; }
    .schedule-table thead { display: none; }
    .schedule-table tr {
      padding: 10px 14px 10px 32px; border-bottom: 1px solid rgba(110,150,190,0.35);
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; color: #24303f;
    }
    .schedule-table tr:last-child { border-bottom: none; }
    .schedule-table td { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; line-height: 1.45; overflow-wrap: anywhere; }
    .schedule-table td::before {
      flex: 0 0 40px; font-family: 'Noto Sans TC', sans-serif; font-style: normal;
      font-size: 0.8rem; letter-spacing: 0.12em; color: #8a93a3; font-weight: 400;
    }
    .schedule-table td.s-date::before    { content: '預借'; }
    .schedule-table td.s-name::before    { content: '姓名'; }
    .schedule-table td.s-dev::before     { content: '設備'; }
    .schedule-table td.s-purpose::before { content: '用途'; }
    .schedule-table td.s-date { font-family: 'Noto Serif TC', serif; font-size: 1.18rem; font-weight: 700; color: #7a5200; }
    .schedule-table td.s-name { font-size: 1.28rem; font-weight: 700; color: #1e2733; letter-spacing: 0.04em; }
    .schedule-table td.s-dev  { font-size: 1.12rem; font-weight: 700; color: #2c4a6e; }
    .schedule-table td.s-purpose { font-size: 1rem; color: #5b6472; }
    .schedule-table tr.mine { background: rgba(120,160,200,0.13); }
    .schedule-table tr.mine td.s-name::after {
      content: '您'; margin-left: 2px; padding: 0 6px; border: 1.5px solid #2f5d9a; border-radius: 3px;
      color: #2f5d9a; font-family: 'Noto Serif TC', serif; font-size: 0.8rem; transform: rotate(-4deg); opacity: .85;
    }
    .today-tag {
      display: inline-block; margin-left: 6px; padding: 2px 9px 3px;
      background: linear-gradient(175deg, #fbe7a1, #f3d675); color: #5c4710;
      font-family: 'LXGW WenKai TC', sans-serif; font-size: 0.86rem; font-weight: 700;
      box-shadow: 2px 3px 4px rgba(70,50,30,0.18); transform: rotate(3deg);
    }
    .schedule-empty { text-align: center; padding: 24px 18px 22px 30px; font-family: 'LXGW WenKai TC', sans-serif; color: #7d8aa0; font-size: 1.05rem; line-height: 1.6; }

    /* ── 訊息紙條 ── */
    .toast {
      position: fixed; top: 20px; left: 50%; z-index: 1000;
      transform: translateX(-50%) translateY(-20px) rotate(-1deg);
      max-width: 380px; width: 90%; padding: 14px 20px; text-align: center; pointer-events: none;
      background: linear-gradient(175deg, #fffef8, #f6f0e2);

      opacity: 0; transition: all .3s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) rotate(-1deg); }
    .toast.success { color: #3f5f38; border-left: 4px solid #6f8a68; }
    .toast.error   { color: #7a3a26; border-left: 4px solid #a8432c; }

    /* ── 送出中 ── */
    .loading-overlay, .remind-overlay {
      position: fixed; inset: 0; z-index: 2000; padding: 20px;
      background: rgba(40,30,20,0.42); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all .25s;
    }
    .remind-overlay { z-index: 2100; }
    .loading-overlay.show, .remind-overlay.show { opacity: 1; visibility: visible; }
    .loading-box, .remind-box {
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        linear-gradient(175deg, #fffdf6, #f6efdf);
      border-radius: 3px; box-shadow: 0 0 0 1px rgba(120,100,70,0.12), 6px 12px 30px rgba(30,20,10,0.35);
    }
    .loading-box { padding: 26px 34px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgba(111,138,104,0.25); border-top-color: #6f8a68; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.05rem; color: var(--ink-2); }

    /* ── 未歸還提醒：紙本通知單 ── */
    .remind-box { position: relative; width: 100%; max-width: 420px; padding: 26px 20px 18px; text-align: center; transform: rotate(-0.5deg); }
    .remind-icon {
      display: inline-block; margin-bottom: 10px; padding: 2px 12px;
      border: 2.5px solid #c0392b; border-radius: 4px; color: #c0392b;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.2em;
      transform: rotate(-6deg); opacity: .85; mix-blend-mode: multiply;
    }
    .remind-title { font-family: 'Noto Serif TC', serif; font-size: 1.3rem; font-weight: 700; letter-spacing: 0.1em; color: #2f2a24; margin-bottom: 14px; }
    .remind-list {
      list-style: none; max-height: 45vh; overflow-y: auto; text-align: left;
      display: flex; flex-direction: column; margin-bottom: 18px;
      border-top: 2px solid rgba(90,120,160,0.45);
    }
    .remind-list li {
      padding: 10px 4px; border-bottom: 1px solid rgba(110,150,190,0.35);
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.1rem; line-height: 1.6; color: #24303f;
    }
    .remind-list b { color: #8a4a30; }
    .remind-btns { display: flex; gap: 10px; }

    .devices-wrap .sec-head { margin-bottom: 4px; }
    html.night .purpose-label { color: #4f5868; }
    html.night .search-box::placeholder { color: #6f7580; }
    html.night .search-icon-pos { opacity: .9; }
    @media (max-width: 380px) {
      .site-title { font-size: 1.6rem; }
      .device-name { font-size: 1.02rem; }
      .search-box, .date-box-text { font-size: 1.2rem; }
      .purpose-select { font-size: 1.08rem; }
      .btn { font-size: 1rem; letter-spacing: 0.08em; }
    }
  </style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ambient-top" aria-hidden="true"></div>
<div class="lamp" aria-hidden="true"></div>

<div class="panel">
  <!-- ─── Header ─── -->
  <header>
    <button class="btn-return" id="backBtn">← 返回</button>
    <span id="timeDisplay">--:--:--</span>
    <h1 class="site-title">設備借用</h1>
    <div class="site-sub">義大社工科</div>
    <div class="header-info"><span id="userName">載入中…</span></div>
  </header>

  <!-- ─── 說明 ─── -->
  <div class="section">
    <div class="intro-card">請點選要借用的設備，可以複選；<br>完成後按「送出預約」即可記錄。</div>
  </div>

  <!-- ─── 提前預借 ─── -->
  <div class="section">
    <div class="reserve-card" id="reserveCard">
      <button class="btn-reserve" id="reserveBtn" type="button">
        <span id="reserveBtnText">提前預借設備</span>
      </button>
      <div class="reserve-date-wrap" id="reserveDateWrap">
        <label class="purpose-label" for="reserveDate">選擇預借日期 <span class="req">*</span></label>
        <div class="date-box" id="reserveDateBox">
          <span class="date-box-text" id="reserveDateText">請選擇日期</span>
          <span class="date-box-ic" aria-hidden="true"></span>
          <input type="date" class="reserve-date" id="reserveDate"/>
        </div>
        <div class="reserve-hint">選好日期後，再點選下方的設備並送出，即為該日期提前預借</div>
      </div>
    </div>
  </div>

  <!-- ─── 設備掛板 ─── -->
  <div class="section devices-wrap">
    <div class="sec-head">
      <span class="sec-title">設備掛板</span>
      <span id="selected-count"></span>
    </div>
    <div class="search-card" style="margin-bottom:14px">
      <div class="search-wrap">
        <span class="search-icon-pos" aria-hidden="true"></span>
        <input type="text" class="search-box" id="searchBox" placeholder="搜尋設備名稱…"/>
      </div>
    </div>
    <div class="devices-grid" id="devicesGrid">
      <div class="devices-empty">載入設備中…</div>
    </div>
  </div>

  <!-- ─── 用途 ─── -->
  <div class="section">
    <div class="purpose-sheet">
      <label class="purpose-label" for="purposeSelect">用途 <span class="req">*</span></label>
      <div class="select-wrap">
        <select class="purpose-select" id="purposeSelect">
          <option value="">請選擇用途</option>
          <option value="開會(科會、個案研討、讀書會、各項會議)">開會（科會、個案研討、讀書會、各項會議）</option>
          <option value="科內活動">科內活動</option>
          <option value="大廳活動">大廳活動</option>
          <option value="其他活動(晨會、病房活動、共識營、各項研討會)">其他活動（晨會、病房活動、共識營、各項研討會）</option>
          <option value="個人需求">個人需求</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ─── 按鈕 ─── -->
  <div class="btn-row">
    <button class="btn btn-reset"  id="resetBtn">重置選擇</button>
    <button class="btn btn-submit" id="submitBtn">送出預約</button>
  </div>

  <!-- ─── 預借設備時間排程 ─── -->
  <div class="section" style="padding-bottom:22px">
    <div class="schedule-card">
      <div class="sec-head">
        <span class="sec-title">預借排程</span>
        <button class="btn-refresh" id="scheduleRefresh" type="button" title="重新整理">↻</button>
      </div>
      <div class="schedule-body" id="scheduleBody">
        <div class="schedule-empty">載入中…</div>
      </div>
    </div>
  </div>
</div>

<!-- ─── 送出中 ─── -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text">送出中…</div>
  </div>
</div>

<!-- ─── 未歸還提醒 ─── -->
<div class="remind-overlay" id="remindOverlay">
  <div class="remind-box">
    <div class="remind-icon">提醒</div>
    <div class="remind-title">以下設備尚未歸還</div>
    <ul class="remind-list" id="remindList"></ul>
    <div class="remind-btns">
      <button class="btn btn-reset"  id="remindCancel">取消</button>
      <button class="btn btn-submit" id="remindOk">繼續送出</button>
    </div>
  </div>
</div>

<!-- ─── 訊息 ─── -->
<div class="toast" id="toast"></div>

<script>
        // ══ 光線隨時間變化（新增）══
  //  早上太陽在左邊（東）低低的、偏金黃；中午在正上方、白亮；
  //  下午移到右邊；傍晚右側低角度橘紅；入夜後房間變暗、改成月光＋桌燈。
  //  測試用：網址後面加 ?hour=18.5 可以直接看某個時間的樣子
  (function () {
      //  時間   太陽X  太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影
      //  時間   太陽X 太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影  窗光  窗X(vw) 窗Y(vh) 傾斜  旋轉
      const K = [
          [0,     72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],   // 深夜：月光
          [4.6,   72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],
          [5.6,    0, 66,  255,160,130,  .80,   48, 12, 214,160,200,  .45,  .35, .80, .55, 52,  6,  -42,  6],   // 破曉：粉紫
          [7,      2, 42,  255,206,130,  .95,   40, 18, 255,226,190,  .18,  0,   1.5, .75, 46,  4,  -34,  4],   // 早晨：金黃
          [10,    24, 12,  255,226,170,  .85,   22, 30, 255,248,236,  .04,  0,   1.6, .65, 34, 14,  -18,  2],
          [12.5,  50,  0,  255,246,226,  .70,    0, 38, 255,255,255,  0,    0,   1.4, .55, 22, 34,    0,  0],   // 正午：白亮、影子短
          [15,    78, 12,  255,220,150,  .85,  -22, 30, 255,244,226,  .06,  0,   1.6, .65,  8, 14,   18, -2],
          [17,    98, 40,  255,160, 80,  1,    -42, 18, 255,190,140,  .30,  0,   1.7, .80, -4,  4,   34, -4],   // 傍晚：橘
          [18.2, 100, 66,  255,110, 90,  .85,  -50, 12, 170,110,150,  .52,  .40, 1.1, .55, -8,  6,   42, -6],   // 黃昏：紅紫
          [19.4,  72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],   // 入夜
          [24,    72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],
      ];
      const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
      function apply() {
          const now = new Date();
          const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
          let i = 0; while (i < K.length - 2 && h >= K[i + 1][0]) i++;
          const a = K[i], b = K[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
          const v = a.map((x, j) => x + (b[j] - x) * t);
          const r = document.documentElement.style;
          r.setProperty('--sunx', v[1] + '%');
          r.setProperty('--suny', v[2] + '%');
          r.setProperty('--sunc', `${v[3] | 0},${v[4] | 0},${v[5] | 0}`);
          r.setProperty('--suna', v[6].toFixed(3));
          r.setProperty('--sx', v[7].toFixed(1) + 'px');
          r.setProperty('--sy', v[8].toFixed(1) + 'px');
          r.setProperty('--ovc', `${v[9] | 0},${v[10] | 0},${v[11] | 0}`);
          r.setProperty('--ova', v[12].toFixed(3));
          r.setProperty('--lamp', v[13].toFixed(3));
          r.setProperty('--leafk', v[14].toFixed(3));
          r.setProperty('--win', v[15].toFixed(3));
          r.setProperty('--wx', v[16].toFixed(1) + 'vw');
          r.setProperty('--wy', v[17].toFixed(1) + 'vh');
          r.setProperty('--wsk', v[18].toFixed(1) + 'deg');
          r.setProperty('--wrot', v[19].toFixed(1) + 'deg');
          document.documentElement.classList.toggle('night', v[12] > 0.45);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = v[12] > 0.6 ? '#4b5270' : (v[12] > 0.3 ? '#c9a9a8' : '#efe6d8');
      }
      apply();
      setInterval(apply, 60 * 1000);   // 每分鐘更新一次
  })();

        // ══════════════════════════════════════════
  //  寫實光影（Canvas）
  //  牆面在陰影中是偏冷的灰；陽光穿過窗戶，在牆上投出一塊暖色光斑，
  //  窗框形成十字陰影，窗外的樹葉在光斑裡留下深淺不一的影子並隨風擺動。
  //  早上太陽低、光斑又長又斜、偏右；中午太陽高、光斑小而低；
  //  下午移到左邊；傍晚轉橘紅；夜晚只剩微弱的冷色月光。
  // ══════════════════════════════════════════
  (function () {
      const cv = document.getElementById('scene');
      const ctx = cv.getContext('2d');
      const SCALE = 0.5;                       // 半解析度繪製：陰影本來就柔，也比較省電
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
      let W = 0, H = 0;

      // 亂數（固定種子，每次畫出來的樹一樣）
      let seed = 11;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const R = (a, b) => a + rnd() * (b - a);

      // ── 時間表 ──
      //  時:  陰影牆色RGB      光的加亮RGB     光斑 x   y    寬   高   斜    葉影深淺 風力
      const T = [
          [0,    36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],   // 夜：月光
          [4.6,  36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],
          [5.6, 146,136,146,  105, 58, 46,   .50, .00, .56, .50,  .28,  .70, .7],  // 破曉
          [7,   188,180,170,  100, 72, 34,   .44, .00, .52, .60,  .22,  .85, .8],  // 早晨
          [10,  204,197,187,   72, 60, 40,   .33, .10, .44, .62,  .10,  .90, 1 ],
          [12.5,212,206,196,   52, 48, 38,   .22, .44, .50, .50,  .00,  .80, 1 ],  // 正午：光斑低而小
          [15,  204,196,185,   74, 60, 36,   .18, .10, .44, .62, -.10,  .90, 1 ],
          [17,  178,163,148,  108, 64, 22,   .04, .00, .52, .62, -.22,  .90, .9],  // 傍晚
          [18.2,126,106,112,   96, 40, 24,  -.06, .02, .56, .50, -.28,  .75, .7],  // 黃昏
          [19.4, 36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],  // 入夜
          [24,   36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],
      ];
      function sample() {
          const now = new Date();
          const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
          let i = 0; while (i < T.length - 2 && h >= T[i + 1][0]) i++;
          const a = T[i], b = T[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
          return a.map((x, j) => x + (b[j] - x) * t);
      }

      // ── 畫一根帶葉子的樹枝（黑色剪影）到離屏畫布，再用「縮小再放大」做出柔邊 ──
      function leaf(c, L, Wd) {
          c.beginPath();
          c.moveTo(0, 0);
          c.bezierCurveTo(L * 0.28, -Wd * 1.05, L * 0.72, -Wd * 0.85, L, R(-1, 1));
          c.bezierCurveTo(L * 0.70, Wd * 0.95, L * 0.30, Wd * 0.9, 0, 0);
          c.fill();
          c.lineWidth = 1.1; c.beginPath(); c.moveTo(-L * 0.12, 0); c.lineTo(0, 0); c.stroke();
      }
      function branchSprite(size, blurK, sd) {
          seed = sd;
          const s = document.createElement('canvas'); s.width = s.height = size;
          const c = s.getContext('2d');
          c.fillStyle = '#000'; c.strokeStyle = '#000'; c.lineCap = 'round';
          function grow(x, y, ang, len, thick, depth) {
              const steps = Math.max(6, len / 14 | 0);
              let cx = x, cy = y, a = ang;
              for (let i = 0; i < steps; i++) {
                  a += R(-0.10, 0.10);
                  const nx = cx + Math.cos(a) * len / steps, ny = cy + Math.sin(a) * len / steps;
                  c.lineWidth = Math.max(0.8, thick * (1 - i / steps));
                  c.beginPath(); c.moveTo(cx, cy); c.lineTo(nx, ny); c.stroke();
                  cx = nx; cy = ny;
                  // 葉子：左右交錯、大小不一、角度隨機
                  if (i > 0 && rnd() < 0.85) {
                      const side = i % 2 ? 1 : -1;
                      c.save(); c.translate(cx, cy);
                      c.rotate(a + side * R(0.6, 1.2));
                      const L = R(22, 42) * (depth ? 0.85 : 1), Wd = L * R(0.26, 0.4);
                      c.scale(1, R(0.55, 1));            // 有些葉子斜著，影子變扁
                      leaf(c, L, Wd); c.restore();
                  }
                  // 小枝
                  if (depth < 2 && i > 1 && rnd() < 0.28) {
                      grow(cx, cy, a + (rnd() < 0.5 ? -1 : 1) * R(0.5, 1.0), len * R(0.3, 0.5), thick * 0.55, depth + 1);
                  }
              }
              // 枝端一簇葉
              for (let k = 0; k < 4; k++) {
                  c.save(); c.translate(cx, cy); c.rotate(a + R(-0.9, 0.9));
                  const L = R(20, 36); leaf(c, L, L * R(0.28, 0.38)); c.restore();
              }
          }
          grow(size * 0.98, size * 0.04, R(2.3, 2.6), size * 0.95, 6, 0);
          // 柔邊（模擬半影）：縮小再放大
          const k = Math.max(1, blurK);
          const t1 = document.createElement('canvas');
          t1.width = Math.max(1, size / k | 0); t1.height = t1.width;
          const c1 = t1.getContext('2d'); c1.imageSmoothingQuality = 'high';
          c1.drawImage(s, 0, 0, t1.width, t1.height);
          const out = document.createElement('canvas'); out.width = out.height = size;
          const co = out.getContext('2d'); co.imageSmoothingQuality = 'high';
          co.drawImage(t1, 0, 0, size, size);
          return out;
      }

      // 三種距離的樹枝：遠的模糊、近的清楚
      let sprites = [];
      function buildSprites() {
          const base = Math.round(Math.max(W, H) * 0.9);
          sprites = [
              { img: branchSprite(base,       7, 21), fx: .55, fy: -.18, rot: .25, s: 1.10, a: .55, amp: .020, f: .55, ph: 0   },
              { img: branchSprite(base,       6, 37), fx: .10, fy:  .05, rot: -.1, s: 0.95, a: .55, amp: .018, f: .48, ph: 1.7 },
              { img: branchSprite(base * .8,  3.5, 53), fx: .40, fy: -.05, rot: .05, s: 1.00, a: .78, amp: .030, f: .80, ph: 3.1 },
              { img: branchSprite(base * .8,  3, 71), fx: -.05, fy: .25, rot: -.35, s: 0.90, a: .75, amp: .028, f: .72, ph: 4.4 },
              { img: branchSprite(base * .6,  1.8, 97), fx: .62, fy: .10, rot: .45, s: 0.90, a: .88, amp: .045, f: 1.1, ph: 2.2 },
          ];
      }

      // 光斑位置：手機直式畫面比較窄，光斑放大一些才看得到
      function geo() {
          const portrait = H > W * 1.2;
          const kw = portrait ? 1.9 : 1, kh = portrait ? 1.05 : 1;
          const w = P[9] * W * kw, h = P[10] * H * kh;
          const x = portrait ? (P[7] - 0.22) * W * 1.35 : P[7] * W;
          const y = P[8] * H * (portrait ? 0.8 : 1);
          return [x, y, w, h, P[11] * W * kw];
      }

      // 光斑（含窗框十字），每分鐘依時間重畫一次
      const patch = document.createElement('canvas');
      let P = null;
      function buildPatch() {
          P = sample();
          patch.width = W; patch.height = H;
          const c = patch.getContext('2d');
          c.clearRect(0, 0, W, H);
          const [x, y, w, h, sk] = geo();
          // 先畫在小畫布再放大 → 光斑邊緣自然柔和
          const k = 6, sm = document.createElement('canvas');
          sm.width = Math.ceil(W / k); sm.height = Math.ceil(H / k);
          const s = sm.getContext('2d');
          s.scale(1 / k, 1 / k);
          s.fillStyle = `rgb(${P[4] | 0},${P[5] | 0},${P[6] | 0})`;
          s.beginPath();
          s.moveTo(x, y); s.lineTo(x + w, y); s.lineTo(x + w + sk, y + h); s.lineTo(x + sk, y + h); s.closePath();
          s.fill();
          // 窗框：一直一橫的陰影
          s.globalCompositeOperation = 'destination-out';
          const mw = Math.max(6, w * 0.035);
          s.beginPath();
          s.moveTo(x + w * .5 - mw / 2, y); s.lineTo(x + w * .5 + mw / 2, y);
          s.lineTo(x + w * .5 + mw / 2 + sk, y + h); s.lineTo(x + w * .5 - mw / 2 + sk, y + h); s.closePath(); s.fill();
          const yy = y + h * .46, sx = sk * .46;
          s.fillRect(x + sx - 4, yy - mw / 2, w + 8, mw);
          c.imageSmoothingQuality = 'high';
          c.drawImage(sm, 0, 0, W, H);
      }

      const light = document.createElement('canvas');
      function draw(t) {
          if (!P) return;
          const lc = light.getContext('2d');
          lc.globalCompositeOperation = 'source-over';
          lc.clearRect(0, 0, W, H);
          lc.drawImage(patch, 0, 0);
          // 樹葉擋光：從光斑中「挖掉」葉影
          lc.globalCompositeOperation = 'destination-out';
          const [x, y, w, h, sk] = geo();
          const wind = P[13];
          // 陣風：幾個慢速波疊起來，偶爾大一點
          const gust = Math.max(0, Math.sin(t * 0.21) + Math.sin(t * 0.083 + 1.3) - 0.6) * 0.6;
          sprites.forEach(sp => {
              const sway = (Math.sin(t * sp.f + sp.ph) + 0.45 * Math.sin(t * sp.f * 2.3 + sp.ph * 1.7)) * sp.amp * wind
                         + gust * sp.amp * 1.6 * wind;
              const size = sp.img.width * sp.s;
              lc.save();
              lc.globalAlpha = sp.a * P[12];
              lc.translate(x + w * sp.fx + sk * 0.3, y + h * sp.fy);
              lc.transform(1, 0, P[11] * 0.6, 1, 0, 0);     // 影子跟著光線一起斜
              lc.rotate(sp.rot + sway);
              lc.translate(Math.sin(t * sp.f * 0.7 + sp.ph) * 3 * wind, 0);
              lc.drawImage(sp.img, -size * 0.5, -size * 0.1, size, size);
              lc.restore();
          });
          // 牆面＝陰影色，再「加上」光
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = `rgb(${P[1] | 0},${P[2] | 0},${P[3] | 0})`;
          ctx.fillRect(0, 0, W, H);
          // 室內的反射光：靠下方稍暗（地板方向）
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, 'rgba(255,255,255,0.04)'); g.addColorStop(1, 'rgba(40,25,10,0.10)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = 'lighter';
          ctx.drawImage(light, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
      }

      function resize() {
          W = Math.max(1, Math.round(innerWidth * SCALE));
          H = Math.max(1, Math.round(Math.max(innerHeight, document.documentElement.clientHeight) * 1.15 * SCALE));
          cv.width = W; cv.height = H; light.width = W; light.height = H;
          buildSprites(); buildPatch(); draw(performance.now() / 1000);
      }
      resize();
      // 只有寬度改變（例如手機轉向）才重畫；捲動時網址列伸縮只改高度，不理會（修改）
      let lastW = innerWidth, rt;
      addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(resize, 200); });
      setInterval(() => { buildPatch(); if (reduce) draw(0); }, 60 * 1000);

      if (!reduce) {
          let last = 0;
          (function loop(ts) {
              requestAnimationFrame(loop);
              if (document.hidden || ts - last < 33) return;   // 約每秒 30 張
              last = ts;
              draw(ts / 1000);
          })(0);
      }
  })();


  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyACtMKVngQdstQIvWwhxhG5AdvCZElmCdKvW8kQLWguHxLCWESDlVPjm13Ae_lEgDd/exec';

  /* ── 載入使用者 ── */
  async function loadUserData() {
    try {
      const account = localStorage.getItem('account');
      if (!account) { alert('請先登入'); window.location.href = 'index.html'; return; }

      const res  = await fetch(`${SCRIPT_URL}?account=${encodeURIComponent(account)}`);
      const data = await res.json();
      currentUserName = data.name || '訪客';
    } catch {
      currentUserName = '訪客';

    document.getElementById('userName').textContent = '您好，' + currentUserName;
  }

  /* ── 動態載入設備 ── */
  async function loadDeviceDB() {
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=getDeviceDB`, { cache: 'no-store' });
      const json = await res.json();
      if (json.status === 'ok' && json.data.length > 0) {
        renderDeviceCards(json.data);
      } else {
        document.getElementById('devicesGrid').innerHTML =
          '<div class="devices-empty">目前尚無設備，請至後台新增</div>';
      }
    } catch {

        '<div class="devices-empty">載入失敗，請稍後再試</div>';
    }

  function renderDeviceCards(items) {
    const grid = document.getElementById('devicesGrid');
    grid.innerHTML = '';
    selectedDevices.clear();
    updateSelectedCount();


    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'device-card';
      card.dataset.device = item.name;
      card.style.animationDelay = (i * 0.06) + 's';
      card.style.animation = 'rowIn 0.3s ease both';
      card.innerHTML = `
        <span class="device-icon">${deviceIcon(item.name)}</span>
        <span class="device-name">${nameWithBreaks(item.name)}</span>
      `;
      card.addEventListener('click', function () {
        const dev = this.dataset.device;
        if (this.classList.contains('selected')) {
          this.classList.remove('selected');
          selectedDevices.delete(dev);
        } else {
          this.classList.add('selected');
          selectedDevices.add(dev);
        }
        updateSelectedCount();
      });
      grid.appendChild(card);
    });
    requestAnimationFrame(fitDeviceNames);   // 畫完後檢查名稱寬度（新增）
  }

  /* ── 依設備名稱挑選圖示（新增）：關鍵字由上往下比對，先比對到的優先 ── */
  const ICON_RULES = [
    [/攝影機|錄影機|攝像|webcam|視訊鏡頭/i,           '📹'],
    [/相機|單眼|camera/i,                              '📷'],

    [/hdmi|vga|轉接|傳輸線|連接線|線材/i,              '🔗'],

    [/燈|light/i,                                      '💡'],
  ];
  function deviceIcon(name) {
    const s = String(name || '');
    for (const [re, ic] of ICON_RULES) if (re.test(s)) return ic;
    return '📦';   // 比對不到時的預設圖示
  }
  // 只在「自然斷點」允許換行：空白、括號前、－、／、、 之後（新增）
  function nameWithBreaks(name) {
    return escHtml(name)
      .replace(/([\s、\/／\-－_])/g, '$1<wbr>')
      .replace(/([（(])/g, '<wbr>$1');
  }
  // 名稱放不下時自動縮小字級，而不是把字切一半（新增）
  function fitDeviceNames() {
    document.querySelectorAll('.device-name').forEach(el => {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize);
      el.style.wordBreak = '';
      el.style.textWrap = '';
      // 有括號的名稱（修改）：整個名稱維持同一行，放不下就把字縮小，不換行
      const oneLine = /[（(]/.test(el.textContent);
      el.classList.toggle('one-line', oneLine);
      if (oneLine) {
        el.querySelectorAll('wbr').forEach(w => w.remove());   // 拿掉斷行點，整個名稱同一行
        while (el.scrollWidth > el.clientWidth + 1 && size > 9) {
          size -= 0.5;
          el.style.fontSize = size + 'px';
        }
        return;
      }
      while (el.scrollWidth > el.clientWidth + 1 && size > 12) {
        size -= 0.5;
        el.style.fontSize = size + 'px';
      }
      // 名稱特別長、縮到最小還放不下 → 平均分成兩行（不會只切掉一兩個字）
      if (el.scrollWidth > el.clientWidth + 1) {
        el.style.fontSize = '13px';
        el.style.wordBreak = 'normal';
        el.style.textWrap = 'balance';
      }
    });
  }
  window.addEventListener('resize', () => { clearTimeout(window._fitT); window._fitT = setTimeout(fitDeviceNames, 150); });

  /* ── 送出 ── */
  document.getElementById('submitBtn').addEventListener('click', async function () {
    if (selectedDevices.size === 0) { showToast('請至少選擇一個設備', 'error'); return; }

    // （新增）用途必選
    const purposeEl = document.getElementById('purposeSelect');
    if (!purposeEl.value) {
      purposeEl.classList.add('error');
      purposeEl.focus();
      showToast('請選擇用途', 'error');

    // （新增）提前預借模式：日期必選，且要是明天以後
    let reserveDate = '';
    if (reserveMode) {
      const dateEl = document.getElementById('reserveDate');
      reserveDate = dateEl.value;

        setDateError(true);

    const devices = Array.from(selectedDevices);

      showLoading(false);
    }

    if (conflicts && conflicts.length > 0) {
      const ok = await showRemind(conflicts);
      if (!ok) return;            // 按取消 → 不送出
    }

    await submitBooking(devices, reserveDate);

    // GAS 未更新時，送出後再提示（避免被成功訊息蓋掉）
    if (conflicts === null) {
      setTimeout(() => showToast('未歸還檢查失敗：GAS 尚未更新為新版本', 'error'), 3200);
    }
  });

  /* 查詢選取設備中，其他人尚未歸還的記錄（新增） */
  async function findUnreturned(devices) {
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=getActiveBorrows`, { cache: 'no-store' });
      const json = await res.json();
      if (json.status !== 'ok' || !Array.isArray(json.data)) {
        return null;   // GAS 尚未更新
      }
      const picked = devices.map(d => String(d).trim());   // 統一成文字比對
      const list = [];
      json.data.forEach(rec => {
        (rec.devices || []).forEach(dev => {
          dev = String(dev).trim();
          if (picked.includes(dev)) list.push({ date: rec.date, name: rec.name, device: dev });
        });
      });
      return list;
    } catch {
      return [];   // 查詢失敗時不擋送出
    }
  }

  /* 顯示提醒框，回傳 true=繼續送出 / false=取消（新增） */
  function showRemind(conflicts) {
    return new Promise(resolve => {
      const ul = document.getElementById('remindList');
      ul.innerHTML = '';
      conflicts.forEach(c => {
        const li = document.createElement('li');
        if (c.name === currentUserName) {
          // 自己借的：改用「您」的說法
          li.innerHTML = '您於 <b></b> 借用的 <b></b> 尚未歸還，記得歸還';
          const b = li.querySelectorAll('b');
          b[0].textContent = c.date;
          b[1].textContent = c.device;
        } else {
          li.innerHTML = '請提醒 <b></b> 於 <b></b> 借用的 <b></b> 記得歸還';
          const b = li.querySelectorAll('b');
          b[0].textContent = c.name;
          b[1].textContent = c.date;
          b[2].textContent = c.device;
        }
        ul.appendChild(li);
      });
      const overlay = document.getElementById('remindOverlay');
      overlay.classList.add('show');
      const done = (val) => {
        overlay.classList.remove('show');
        document.getElementById('remindOk').onclick = null;
        document.getElementById('remindCancel').onclick = null;
        resolve(val);
      };
      document.getElementById('remindOk').onclick     = () => done(true);
      document.getElementById('remindCancel').onclick = () => done(false);
    });
  }

  /* 寫入借用記錄（原送出邏輯） */
  async function submitBooking(devices, reserveDate) {
    const timestamp = new Date().toLocaleString('zh-TW');

    showLoading(true);
    try {
      const deviceList = devices.join('、');
      const purpose    = document.getElementById('purposeSelect').value;   // （新增）
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action:'device', timestamp, userName: currentUserName,
          devices: deviceList, purpose,
          reserveDate: reserveDate || ''                                     // （新增）提前預借日期
        })
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error || '寫入失敗');

      showToast(reserveDate
        ? `已提前預借 ${deviceList}（${reserveDate}）！`
        : `已成功預約 ${deviceList}！`, 'success');

      // 重置
      selectedDevices.clear();
      document.querySelectorAll('.device-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('searchBox').value = '';
      document.getElementById('purposeSelect').value = '';   // （新增）
      setReserveMode(false);                                  // （新增）
      updateSelectedCount();
      if (reserveDate) loadSchedule();                        // （新增）預借後更新排程
    } catch {
      showToast('提交失敗，請稍後再試', 'error');
    } finally {
      showLoading(false);
    }
  }

  /* ══════════ 預借設備時間排程（新增） ══════════ */
  async function loadSchedule() {
    const body = document.getElementById('scheduleBody');
    const btn  = document.getElementById('scheduleRefresh');
    btn.classList.add('spin');
    const showMsg = (text) => {
      body.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'schedule-empty';
      div.textContent = text;
      body.appendChild(div);
    };
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=getReservations`, { cache: 'no-store' });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch { showMsg('後端回傳的不是資料（可能是 Apps Script 權限設定不是「所有人」）'); return; }

      // （修改）依實際原因顯示
      if (json.error === 'Account not found') {
        showMsg('這個網址跑的是舊版程式，沒有排程功能。請在 Apps Script「管理部署作業 → 編輯 → 新版本 → 部署」。');
        return;
      }
      if (json.status !== 'ok' || !Array.isArray(json.data)) {
        showMsg('讀取失敗：' + (json.message || json.error || '未知錯誤'));
        return;
      }
      if (json.noReserveCol) {
        showMsg('「設備」工作表第 1 列找不到「提前預借時間」標題，請確認欄位名稱一字不差');
        return;
      }
      if (!json.data.length && json.pastCount) {
        showMsg(`目前沒有今天以後的預借（另有 ${json.pastCount} 筆已過期的預借不顯示）`);
        return;
      }
      renderSchedule(json.data, json.today);
    } catch (err) {
      showMsg('連線失敗：' + err.message);
    } finally {
      btn.classList.remove('spin');
    }
  }

  function renderSchedule(rows, today) {
    const body = document.getElementById('scheduleBody');
    body.innerHTML = '';
    if (!rows.length) {
      body.innerHTML = '<div class="schedule-empty">目前沒有提前預借的設備</div>';
      return;
    }

    const table = document.createElement('table');
    table.className = 'schedule-table';
    table.innerHTML = '<thead><tr><th>提前預借時間</th><th>姓名</th><th>設備</th><th>用途</th></tr></thead>';
    const tbody = document.createElement('tbody');

    rows.forEach(r => {
      const tr = document.createElement('tr');
      if (r.name === currentUserName) tr.classList.add('mine');

      const tdDate = document.createElement('td');
      tdDate.className = 's-date';
      tdDate.textContent = r.reserveDate;
      if (r.reserveDate === today) {
        const tag = document.createElement('span');
        tag.className = 'today-tag';
        tag.textContent = '今天';
        tdDate.appendChild(tag);
      }

      const tdName = document.createElement('td');
      tdName.className = 's-name';
      tdName.textContent = r.name;

      const tdDev = document.createElement('td');
      tdDev.className = 's-dev';
      tdDev.textContent = r.devices;

      const tdPur = document.createElement('td');
      tdPur.className = 's-purpose';
      tdPur.textContent = r.purpose || '—';

      tr.append(tdDate, tdName, tdDev, tdPur);
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    body.appendChild(table);
  }

  document.getElementById('scheduleRefresh').addEventListener('click', loadSchedule);

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg, type) {
    clearTimeout(toastTimer);
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  /* ── Loading ── */
  function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('show', show);
  }

  /* ── 初始化 ── */
  window.addEventListener('DOMContentLoaded', () => {
    loadUserData().then(loadSchedule);   // （修改）先取得姓名，排程才能標出自己的預借
    loadDeviceDB();
  });

  /* rowIn 動畫 */
  const style = document.createElement('style');
  style.textContent = `@keyframes rowIn { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }`;
  document.head.appendChild(style);

</script>
</body>
</html>
