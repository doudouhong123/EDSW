<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="theme-color" content="#efe6d8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>義大社工科｜文具資料庫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* ══════════ 文具資料庫：窗邊葉影＋卡片目錄（與後台、會員、設備頁同一套）══════════ */
    :root {
      --ink: #2f2a24; --ink-2: #5b5348; --muted: #8f8579; --hair: #e3d9ca;
      --sage: #6f8a68; --terra: #b0603f;
      --engrave: #4a2d14;
      --sx: 14px; --sy: 24px; --ovc: 255,255,255; --ova: 0; --lamp: 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: #e6ddd0; }
    body {
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: var(--ink);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 14px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 寫實光影（牆面、窗光、葉影）── */
    #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }   /* 用最大視窗高度，手機網址列伸縮時不跳動（修改） */
    .grain {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: multiply;
    }
    .ambient-top {   /* 卡片：只稍微變暗，保持好讀 */
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: rgb(var(--ovc)); opacity: calc(var(--ova) * 0.38);
        mix-blend-mode: multiply;
    }
    /* 夜晚：背板稍微不透明一點，小字加深，維持好讀 */
    html.night .container { background-color: rgba(250,246,238,0.32); }
    html.night { --muted: #6f665b; }

    /* 寫實光影畫布＋牆面顆粒 */
    #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }   /* 用最大視窗高度，手機網址列伸縮時不跳動（修改） */
    .grain {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: multiply;
    }
    /* 夜間桌燈：卡片附近一圈暖光，晚上也看得清楚 */
    .lamp {
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,186,110,0.45), rgba(255,186,110,0) 70%);
        mix-blend-mode: soft-light; opacity: var(--lamp);
    }
    html.night .panel { background-color: rgba(250,246,238,0.32); }
    html.night { --muted: #6f665b; }

    /* ── 半透明紙卡 ── */
    .panel {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      border-radius: 6px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        linear-gradient(170deg, rgba(253,251,247,0.40) 0%, rgba(251,248,242,0.34) 45%, rgba(244,238,228,0.30) 100%);
      -webkit-backdrop-filter: blur(2.5px) saturate(1.1);
      backdrop-filter: blur(2.5px) saturate(1.1);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 0 0 1px rgba(120,100,70,0.08),
        2px 3px 4px rgba(70,50,30,0.10),
        calc(var(--sx) * 0.9) calc(var(--sy) * 1) 30px rgba(70,50,30,0.22),
        calc(var(--sx) * 2.2) calc(var(--sy) * 2.4) 70px rgba(70,50,30,0.20);
      animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* 頁首 */
    header { padding: 22px 22px 14px; text-align: center; position: relative; }
    .site-title {
      font-family: 'Noto Serif TC', serif; font-size: 1.55rem; font-weight: 700;
      letter-spacing: 0.14em; padding-left: 0.14em; color: var(--ink);
    }
    .site-sub {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 0.72rem; letter-spacing: 0.3em; color: var(--muted); margin-top: 6px;
    }
    .site-sub::before, .site-sub::after { content: ''; width: 30px; height: 1px; background: var(--hair); }
    #clock {
      font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums; margin-bottom: 10px;
    }
    /* 返回：小原木牌 */
    .btn-return {
      position: absolute; top: 16px; left: 16px;
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 14px 0 12px;
      border: none; border-radius: 4px; cursor: pointer;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='60'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.015 0.45' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
        linear-gradient(175deg, #e2c49c 0%, #cfa978 60%, #b98f5d 100%);
      background-size: 200px 34px, auto;
      box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), inset -2px -2px 0 rgba(80,50,20,0.18), 3px 5px 7px rgba(70,50,30,0.25);
      color: var(--engrave); font-family: 'Noto Serif TC', serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.18em;
      text-shadow: 0 1px 0 rgba(255,240,215,0.55), 0 -1px 0 rgba(70,40,15,0.2);
    }
    .btn-return:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), 1px 2px 3px rgba(70,50,30,0.25); }

    /* 狀態列：一行小字 */
    #status-bar {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
      font-size: 0.74rem; color: var(--muted);
      padding: 0 18px 4px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #c9bfb1; flex-shrink: 0; }
    .dot.ok   { background: var(--sage); }
    .dot.err  { background: #a8432c; }
    .dot.busy { background: #c39b4c; animation: breathe 1.2s infinite; }
    @keyframes breathe { 50% { opacity: .35; } }
    #status-text { color: var(--ink-2); }
    #last-sync { color: var(--muted); }
    #count-badge {
      padding: 1px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.55); border: 1px solid #d3c7b6;
      color: var(--ink-2); font-weight: 700;
    }
    #pending-badge {
      padding: 2px 10px; border-radius: 999px; border: none; cursor: pointer;
      background: #b04a32; color: #fff8ef; font-family: inherit; font-size: 0.74rem; font-weight: 700;
      box-shadow: 1px 2px 4px rgba(60,30,15,0.3); transform: rotate(-3deg);
    }
    #pending-diag { display: none; margin: 6px 18px 0; padding: 8px 12px; border-left: 3px solid #a8432c;
      background: rgba(247,236,228,0.85); color: #7a3a26; font-size: 0.8rem; border-radius: 2px; }

    /* ══════════ 文具資料庫：卡片目錄＋翻面盤點＋領用單存根 ══════════ */
    .section { margin: 14px 16px 0; padding-top: 12px; border-top: 1px solid var(--hair); }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .sec-title { font-family: 'Noto Serif TC', serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.16em; }
    .sec-note  { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; }
    .pill { padding: 1px 10px; border-radius: 999px; background: rgba(255,255,255,0.55); border: 1px solid #d3c7b6; color: var(--ink-2); font-size: 0.72rem; font-weight: 700; }

    /* 小木板按鍵 */
    .wbtn {
      flex: 0 0 auto; height: 36px; padding: 0 16px; border: none; border-radius: 4px; cursor: pointer;
      font-family: 'Noto Serif TC', serif; font-size: 0.84rem; font-weight: 700; letter-spacing: 0.14em;
      color: #fff8ec; text-shadow: 0 -1px 0 rgba(40,25,10,0.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset -2px -3px 0 rgba(40,25,10,0.18), 3px 5px 8px rgba(70,50,30,0.22);
      background-size: 240px 100%, auto;
    }
    .wbtn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 1px 2px 4px rgba(70,50,30,0.22); }
    .wbtn:disabled { opacity: .55; cursor: not-allowed; }
    .wbtn.sage  { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='2'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #88a77a, #617f55); }
    .wbtn.terra { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #c78464, #a35d3f); }
    .wbtn.oak   { color: #4a2d14; text-shadow: 0 1px 0 rgba(255,240,215,0.55);
                  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #e2c49c, #c9a171); }
    .wbtn.ink   { background: linear-gradient(175deg, #4d6e8f, #34506d); }
    .action-bar { display: flex; justify-content: center; gap: 12px; margin: 4px 16px 0; }

    /* ── 搜尋：標籤機打出來的凸字膠帶 ── */
    .tape {
      position: relative; margin: 2px auto 0; max-width: 380px;
      background: linear-gradient(180deg, #2d3338, #1d2226);
      border-radius: 3px; padding: 4px 34px 4px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 3px 5px 8px rgba(40,30,20,0.25);
      transform: rotate(-1deg);
    }
    .tape::before, .tape::after {   /* 膠帶兩端剪出的缺角 */
      content: ''; position: absolute; top: 0; bottom: 0; width: 8px;
      background: inherit; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 60% 50%);
    }
    .tape::before { left: -7px; } .tape::after { right: -7px; transform: scaleX(-1); }
    .search-input {
      width: 100%; border: none; outline: none; background: transparent;
      color: #f2f2ee; font-family: 'Courier New', 'Noto Sans TC', monospace; font-weight: 700; font-size: 1rem;
      letter-spacing: 0.14em; padding: 6px 0;
      text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 -1px 0 rgba(255,255,255,0.25);   /* 凸字 */
    }
    .search-input::placeholder { color: rgba(242,242,238,0.45); letter-spacing: 0.1em; }
    .search-clear { position: absolute; right: 8px; top: 50%; margin-top: -11px; width: 22px; height: 22px; border-radius: 50%;
      border: none; background: rgba(255,255,255,0.15); color: #f2f2ee; cursor: pointer; display: none; font-size: 0.72rem; }
    .search-clear.show { display: block; }

    /* ── 文具目錄：索引卡 ── */
    .catalog { }
    .icard {
      position: relative; height: 112px; border: none; cursor: pointer; text-align: left; padding: 0;
      font-family: inherit; color: #2a2f38;
      background:
        repeating-linear-gradient(180deg, transparent 0 21px, rgba(90,130,180,0.28) 21px 22px) 0 34px / 100% calc(100% - 34px) no-repeat,
        linear-gradient(180deg, transparent 0 30px, rgba(200,70,60,0.45) 30px 31.5px, transparent 31.5px) ,
        linear-gradient(175deg, #fffdf6, #f6efdf);
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(120,100,70,0.12), 2px 3px 4px rgba(70,50,30,0.08), 6px 10px 16px rgba(70,50,30,0.13);
      transform: rotate(var(--tilt, 0deg));
      transition: transform .25s ease, box-shadow .25s ease, opacity .25s;
      -webkit-tap-highlight-color: transparent;
      animation: cardIn .45s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: var(--in, 0s);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(8px) rotate(var(--tilt, 0deg)); } to { opacity: 1; } }
    .no-intro .icard { animation: none; }
    .icard:hover { transform: translateY(-3px) rotate(var(--tilt, 0deg)); box-shadow: 0 0 0 1px rgba(120,100,70,0.12), 4px 6px 8px rgba(70,50,30,0.1), 10px 16px 24px rgba(70,50,30,0.17); }
    .icard:active { transform: translateY(1px) rotate(var(--tilt, 0deg)); }
    .icard.selected { box-shadow: 0 0 0 2px #6f8a68, 6px 10px 16px rgba(70,50,30,0.15); }
    .icard .tab {   /* 上方彩色索引標籤 */
      position: absolute; top: -9px; left: var(--tx, 12px); height: 14px; width: 46px; border-radius: 3px 3px 0 0;
      background: var(--tc); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .icard .no { position: absolute; top: 8px; left: 10px; font-size: 0.66rem; letter-spacing: 0.1em; color: #a8574a; font-weight: 700; font-family: 'Noto Serif TC', serif; }
    .icard .nm {
      position: absolute; left: 10px; right: 10px; top: 36px;
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.12rem; font-weight: 700; line-height: 1.32;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .icard .stock { position: absolute; left: 10px; right: 10px; bottom: 7px; font-size: 0.72rem; color: #6c7686; display: flex; justify-content: space-between; align-items: baseline; }
    .icard .stock b { font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.05rem; color: #2c4a6e; margin-left: 3px; }
    .icard .flip-hint { color: #9aa2ae; }
    mark { background: rgba(244,211,94,0.6); color: inherit; border-radius: 2px; padding: 0 1px; }
    .catalog .empty-line, .slips .empty-line { grid-column: 1 / -1; text-align: center; padding: 24px 0; color: #7d8aa0; font-family: 'LXGW WenKai TC', sans-serif; letter-spacing: 0.08em; }

    /* ── 分頁：每頁 10 筆，左右滑動換頁（新增）── */
    .pager {
      display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      margin: 0 -8px;
    }
    .pager::-webkit-scrollbar { display: none; }
    .pager > .page { flex: 0 0 100%; scroll-snap-align: start; padding: 14px 8px 12px; box-sizing: border-box; min-width: 0; }
    .page.catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 12px; align-content: start; margin-top: 0; }
    .page.slips   { display: flex; flex-direction: column; gap: 10px; margin-top: 0; }
    .pager-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 2px; min-height: 26px; }
    .pager-nav .pg-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #d3c7b6; background: rgba(255,255,255,0.6); color: var(--ink-2); cursor: pointer; font-size: 0.85rem; }
    .pager-nav .pg-btn:disabled { opacity: .35; cursor: default; }
    .pager-nav .pg-dots { display: flex; gap: 5px; }
    .pager-nav .pg-dots i { width: 6px; height: 6px; border-radius: 3px; background: #d6cbbb; transition: all .3s; cursor: pointer; }
    .pager-nav .pg-dots i.on { width: 18px; background: #8a7a64; }
    .pager-nav .pg-text { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }

    /* ── 翻面盤點（3D 翻轉）── */
    .flip-overlay {
      position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center; padding: 18px;
      background: rgba(60,45,30,0.38); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      perspective: 1400px;
    }
    .flip-overlay.show { display: flex; animation: fadeIn .25s ease; }
    .flip-card {
      position: relative; width: 100%; max-width: 400px; height: 440px; max-height: calc(100dvh - 40px);
      transform-style: preserve-3d;
      transition: transform .75s cubic-bezier(.3,.7,.2,1);
      transform: rotateY(0deg) scale(.92);
    }
    .flip-card.open { transform: rotateY(180deg) scale(1); }
    .face {
      position: absolute; inset: 0; border-radius: 4px; overflow: hidden;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      background:
        repeating-linear-gradient(180deg, transparent 0 27px, rgba(90,130,180,0.25) 27px 28px) 0 64px / 100% calc(100% - 64px) no-repeat,
        linear-gradient(180deg, transparent 0 58px, rgba(200,70,60,0.45) 58px 60px, transparent 60px),
        linear-gradient(175deg, #fffdf6, #f5eedd);
      box-shadow: 0 0 0 1px rgba(120,100,70,0.12), 14px 24px 50px rgba(40,28,15,0.35);
    }
    .face.front { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
    .face.front .big { font-family: 'LXGW WenKai TC', sans-serif; font-size: 2rem; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
    .face.back { transform: rotateY(180deg); display: flex; flex-direction: column; padding: 16px 18px 18px; overflow-y: auto; }
    .back-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-height: 44px; }
    .back-head .ttl { font-size: 0.66rem; letter-spacing: 0.3em; color: #a8574a; font-weight: 700; }
    #inv-selected-name { font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.4rem; font-weight: 700; color: #1e2733; line-height: 1.25; overflow-wrap: anywhere; }
    .btn-flipback {
      flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #d3c7b6; cursor: pointer;
      background: rgba(255,255,255,0.75); color: var(--ink-2); font-size: 1.05rem;
      box-shadow: 2px 3px 5px rgba(70,50,30,0.15);
    }
    .slots-ttl { margin-top: 14px; font-size: 0.72rem; letter-spacing: 0.2em; color: #7d8aa0; font-weight: 700; }
    .inv-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .inv-slot {
      position: relative; min-height: 112px; border-radius: 3px; padding: 8px 6px 8px;
      border: 1.5px solid rgba(90,130,180,0.35); background: rgba(255,255,255,0.55);
      display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    }
    .inv-slot.current { border: 2px dashed #8a8f99; background: rgba(255,255,255,0.75); }   /* 下一次要寫的格子：鉛筆框 */
    .slot-label { font-size: 0.64rem; letter-spacing: 0.12em; color: #7d8aa0; font-weight: 700; }
    .inv-slot.current .slot-label::after { content: '下一格'; display: block; margin-top: 2px; color: #6f8a68; letter-spacing: 0.1em; font-size: 0.6rem; }
    .slot-qty.empty { color: #b0b6bf; font-size: 1.2rem; margin-top: 6px; }
    .slot-edit {
      border: none; background: none; cursor: pointer; padding: 0 4px;
      font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.7rem; font-weight: 700; color: #1e2733; line-height: 1.1;
      text-decoration: underline dotted rgba(90,130,180,0.6); text-underline-offset: 5px;
    }
    .slot-pen { font-size: 0.7rem; color: #8a93a3; margin-left: 2px; }
    .slot-time {   /* 日期章 */

      transform: rotate(-4deg); font-family: 'Noto Serif TC', serif;

    .slot-time.none { border: none; color: #b0b6bf; transform: none; font-weight: 500; }
    .slot-editor { display: flex; flex-direction: column; gap: 5px; width: 100%; }
    .slot-input { width: 100%; min-width: 0; padding: 5px; border-radius: 3px; border: 1px solid #6f8a68; text-align: center;
      font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.1rem; font-weight: 700; outline: none; box-shadow: 0 0 0 3px rgba(111,138,104,0.18); }
    .slot-edit-btns { display: flex; gap: 4px; }
    .slot-edit-btns button { flex: 1; padding: 4px 0; border: none; border-radius: 3px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
    .slot-save { background: #6f8a68; color: #fff; } .slot-cancel { background: #e6ddd0; color: #5b5348; }
    /* 蓋章動畫 */
    .new-stamp {
      position: absolute; top: 50%; left: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
      border: 2.5px solid #c0392b; color: #c0392b; display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em;
      pointer-events: none; mix-blend-mode: multiply;
      animation: stampDown .55s cubic-bezier(.3,1.6,.5,1) both, stampFade 2.4s ease 1s forwards;
    }
    @keyframes stampDown { from { transform: scale(1.9) rotate(-18deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: .85; } }
    @keyframes stampFade { to { opacity: 0; } }

    .inv-form { margin-top: 16px; padding-top: 12px; border-top: 1px dashed rgba(90,130,180,0.4); display: flex; flex-direction: column; gap: 8px; }
    .inv-row { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; }
    .inv-label { font-size: 0.72rem; letter-spacing: 0.14em; color: #7d8aa0; font-weight: 700; }
    .inv-time-display { font-size: 0.82rem; color: #3c4656; font-variant-numeric: tabular-nums; }
    .inv-qty-input {
      width: 100%; max-width: 170px; padding: 8px 12px; border-radius: 3px; border: 1px solid #d8ccbb; background: #fff; outline: none;
      font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.15rem; font-weight: 700; color: #1e2733;
    }
    .inv-qty-input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(111,138,104,0.18); }
    .inv-qty-hint { font-size: 0.72rem; color: #8a93a3; padding-left: 52px; }
    .inv-qty-hint.err { color: #a8432c; font-weight: 700; }
    .inv-msg { display: none; font-size: 0.8rem; padding: 6px 10px; border-radius: 2px; }
    .inv-msg.show { display: block; }
    .inv-msg.ok  { background: #edf2e9; color: #4f6b48; border-left: 3px solid var(--sage); }
    .inv-msg.err { background: #f7ece4; color: #7a3a26; border-left: 3px solid #a8432c; }
    .inv-actions { display: flex; justify-content: center; margin-top: 4px; }

    /* ── 依日期查詢：兩個日期章 ── */
    .date-filter-row { display: flex; align-items: center; gap: 8px; }
    .date-field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .date-label { font-size: 0.66rem; letter-spacing: 0.2em; color: #7d8aa0; font-weight: 700; text-align: center; }
    .date-sep { color: #8a93a3; font-weight: 700; padding-top: 16px; }
    .date-wrap { position: relative; width: 100%; }
    .date-show {
      height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px;
      border: 2px solid rgba(47,93,154,0.7); border-radius: 4px; background: rgba(255,255,255,0.6);
      color: #2f5d9a; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.06em;

    .date-show.empty { color: #9aa7bc; border-style: dashed; }

    .date-filter-actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .date-filter-hint { font-size: 0.78rem; color: #4f6b48; text-align: center; margin-top: 8px; min-height: 1.2em; font-family: 'LXGW WenKai TC', sans-serif; }

    /* ── 領用單存根 ── */
    .slips { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .slip {
      position: relative; padding: 14px 14px 10px 14px;
      background: linear-gradient(175deg, #fffef9, #f7f1e3);
      box-shadow: 0 0 0 1px rgba(120,100,70,0.10), 2px 3px 4px rgba(70,50,30,0.08), 6px 10px 16px rgba(70,50,30,0.12);
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; color: #24303f;
      transform: rotate(var(--tilt, 0deg));
      animation: cardIn .4s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: var(--in, 0s);
    }
    .no-intro .slip { animation: none; }
    .slip::before {   /* 上緣撕下來的齒孔 */
      content: ''; position: absolute; left: 0; right: 0; top: -4px; height: 8px;
      background: radial-gradient(circle at 5px 4px, rgba(230,221,208,1) 2.4px, transparent 3px) 0 0 / 10px 8px repeat-x;
    }
    .slip .sno { position: absolute; top: 10px; right: 12px; font-size: 0.66rem; color: #a8574a; font-weight: 700; font-family: 'Noto Serif TC', serif; letter-spacing: 0.1em; }
    .slip .row { display: grid; grid-template-columns: 40px 1fr; align-items: baseline; column-gap: 6px; min-height: 22px; }
    .slip .row > i { font-style: normal; font-size: 0.66rem; letter-spacing: 0.12em; color: #8a93a3; font-family: 'Noto Sans TC', sans-serif; }
    .slip .who  { font-size: 1.14rem; font-weight: 700; color: #1e2733; padding-right: 50px; }
    .slip .what { font-size: 1rem; font-weight: 700; color: #2c4a6e; overflow-wrap: anywhere; }
    .slip .qty  { font-size: 1.3rem; font-weight: 700; color: #a8432c; }
    .slip .when { font-size: 0.84rem; color: #3c4656; }
    .slip .memo { font-size: 0.84rem; color: #6b6b6b; overflow-wrap: anywhere; }

    /* 新增／刪除視窗：紙卡 */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(60,45,30,0.35); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      justify-content: center; align-items: flex-end;
    }
    .overlay.active { display: flex; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
      background: linear-gradient(170deg, #fdfbf7, #f4eee4);

      display: flex; flex-direction: column; gap: 14px;

      animation: slideUp .35s cubic-bezier(.3,1.2,.5,1) both;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .drag-handle { width: 40px; height: 4px; background: #d6cbbb; border-radius: 2px; margin: 0 auto -2px; }
    .modal-head { display: flex; align-items: center; gap: 12px; }
    .modal-icon { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff8ec;
      box-shadow: inset -3px -4px 8px rgba(40,25,10,0.18), 3px 4px 8px rgba(70,50,30,0.18); }
    .modal-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .modal-icon.add-i { background: #7a9a6c; } .modal-icon.del-i { background: #b0603f; }
    .modal h2 { font-family: 'Noto Serif TC', serif; font-size: 1.15rem; letter-spacing: 0.1em; }
    .modal .subtitle { font-size: 0.76rem; color: var(--muted); margin-top: 3px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.82rem; font-weight: 700; color: var(--ink-2); }
    .modal-input { width: 100%; padding: 11px 14px; border-radius: 4px; outline: none; background: #fff; border: 1px solid #d8ccbb; color: var(--ink); font-family: inherit; font-size: 0.95rem; }
    .modal-input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(111,138,104,0.18); }
    .modal-msg { display: none; font-size: 0.82rem; padding: 8px 12px; border-radius: 2px; }
    .modal-msg.show { display: block; }
    .modal-msg.ok  { background: #edf2e9; color: #4f6b48; border-left: 3px solid var(--sage); }
    .modal-msg.err { background: #f7ece4; color: #7a3a26; border-left: 3px solid #a8432c; }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-modal-submit, .btn-modal-cancel { width: 100%; padding: 13px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 0.98rem; font-weight: 700; letter-spacing: 0.12em; }
    .btn-modal-submit { border: none; color: #fff8ec; }
    .btn-modal-submit.green { background: var(--sage); box-shadow: 3px 5px 10px rgba(80,108,70,0.25); }
    .btn-modal-submit.red   { background: var(--terra); box-shadow: 3px 5px 10px rgba(140,70,40,0.25); }
    .btn-modal-cancel { background: transparent; border: 1px solid #d3c7b6; color: var(--ink-2); }

    @media (prefers-reduced-motion: reduce) { .flip-card { transition: none; } .icard, .slip { animation: none; } }
    @media (max-width: 380px) { .icard .nm { font-size: 1rem; } }
    /* 從後台進入時以「浮現」方式出現 */
    html.fade-in { background: #efe6d8; }
    html.fade-in body { animation: pageFloatIn 0.8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pageFloatIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @media (prefers-reduced-motion: reduce) { html.fade-in body { animation: none; } }
  </style>
  <script>
    try {
      if (sessionStorage.getItem('fadeIn')) {
        sessionStorage.removeItem('fadeIn');
        document.documentElement.classList.add('fade-in');
        addEventListener('animationend', function done(e) {
          if (e.animationName !== 'pageFloatIn') return;
          document.documentElement.classList.remove('fade-in');
          removeEventListener('animationend', done);
        });
      }
    } catch (e) {}
  </script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ambient-top" aria-hidden="true"></div>
<div class="lamp" aria-hidden="true"></div>

<div class="panel">
  <header>
    <button class="btn-return" onclick="window.location.href='deleloper.html'">← 返回</button>
    <div id="clock">載入中…</div>
    <h1 class="site-title">文具資料庫</h1>
    <div class="site-sub">義大社工科</div>
  </header>

  <div id="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">連線中…</span>
    <span id="last-sync"></span>
  </div>

  <div class="action-bar">
    <button class="wbtn sage" onclick="openModal('add')">＋ 新增文具</button>
    <button class="wbtn terra" onclick="openModal('del')">－ 刪除文具</button>
  </div>

  <!-- 領用單存根 -->
  <div class="section">
    <div class="sec-head">
      <span class="sec-title">領用單存根</span>
      <span class="pill" id="order-count" style="display:none"></span>
    </div>
    <div class="date-filter-row">
      <div class="date-field"><label class="date-label">開始日</label><input type="date" class="date-input" id="date-from"/></div>
      <span class="date-sep">～</span>
      <div class="date-field"><label class="date-label">結束日</label><input type="date" class="date-input" id="date-to"/></div>
    </div>
    <div class="date-filter-actions">
      <button class="wbtn sage" onclick="applyDateFilter()">查詢</button>
      <button class="wbtn oak" onclick="resetDateFilter()">清除</button>
    </div>
    <div class="date-filter-hint" id="date-filter-hint"></div>
    <div class="pager" id="order-records-body"><div class="page"><div class="empty-line">載入中，請稍候…</div></div></div>
    <div class="pager-nav" id="order-nav"></div>
  </div>

  <!-- 文具目錄 -->
  <div class="section" style="padding-bottom: 22px;">
    <div class="sec-head">
      <span class="sec-title">文具目錄</span>
      <span class="pill" id="list-count" style="display:none"></span>
    </div>
    <div class="tape">
      <input type="text" class="search-input" id="search-input" placeholder="輸入關鍵字找文具…" autocomplete="off"/>
      <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="清除搜尋">✕</button>
    </div>
    <div class="pager" id="item-list"><div class="page"><div class="empty-line">載入中，請稍候…</div></div></div>
    <div class="pager-nav" id="item-nav"></div>
    <div class="sec-note" style="text-align:center;margin-top:6px;">點一下卡片，翻到背面盤點・左右滑動換頁</div>
  </div>
</div>

<!-- 翻面盤點 -->
<div class="flip-overlay" id="flip-overlay">
  <div class="flip-card" id="flip-card">
    <div class="face front"><div class="big" id="flip-front-name">—</div></div>
    <div class="face back">
      <div class="back-head">
        <div>
          <div class="ttl">盤點卡</div>
          <div id="inv-selected-name">—</div>
        </div>
        <button class="btn-flipback" onclick="closeFlip()" title="翻回正面" aria-label="翻回正面">↺</button>
      </div>
      <div class="slots-ttl">盤點紀錄（數字可點選修改）</div>
      <div class="inv-slots" id="inv-slots"></div>
      <div class="inv-form">
        <div class="inv-row"><span class="inv-label">時間</span><span class="inv-time-display" id="inv-time-display">—</span></div>
        <div class="inv-row"><span class="inv-label">數量</span><input type="text" class="inv-qty-input" id="inv-qty" placeholder="輸入數量" maxlength="6" inputmode="numeric"/></div>
        <div class="inv-qty-hint" id="inv-qty-hint">僅限輸入正整數</div>
        <div class="inv-msg" id="inv-msg"></div>
        <div class="inv-actions"><button class="wbtn ink" id="btn-inventory" onclick="submitInventory()">蓋章盤點</button></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="add-overlay">
  <div class="modal">
    <div class="drag-handle"></div>
    <div class="modal-head">
      <div class="modal-icon add-i"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1.5"/><path d="M12 9v6M9 12h6"/></svg></div>
      <div><h2>新增文具</h2><p class="subtitle">寫上名稱，就會多一張卡片插進目錄</p></div>
    </div>
    <div class="field">
      <label>文具名稱 <span style="color:var(--terra)">*</span></label>
      <input type="text" class="modal-input" id="add-name" placeholder="例如：原子筆、便利貼、筆記本" maxlength="30" autocomplete="off"/>
    </div>
    <div class="modal-msg" id="add-msg"></div>
    <div class="modal-actions">
      <button class="btn-modal-submit green" onclick="submitAdd()">確認新增</button>
      <button class="btn-modal-cancel" onclick="closeModal('add-overlay')">取消返回</button>
    </div>
  </div>
</div>

<div class="overlay" id="del-overlay">
  <div class="modal">
    <div class="drag-handle"></div>
    <div class="modal-head">
      <div class="modal-icon del-i"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/><path d="M10 11v5M14 11v5"/></svg></div>
      <div><h2>刪除文具</h2><p class="subtitle">輸入文具名稱後送出，即可從資料庫刪除</p></div>
    </div>
    <div class="field">
      <label>文具名稱 <span style="color:var(--terra)">*</span></label>
      <input type="text" class="modal-input" id="del-name" placeholder="請輸入要刪除的文具名稱" maxlength="30" autocomplete="off"/>
    </div>
    <div class="modal-msg" id="del-msg"></div>
    <div class="modal-actions">
      <button class="btn-modal-submit red" onclick="submitDel()">確認刪除</button>
      <button class="btn-modal-cancel" onclick="closeModal('del-overlay')">取消返回</button>
    </div>
  </div>
</div>

<script>
        // ══ 光線隨時間變化（新增）══
  //  早上太陽在左邊（東）低低的、偏金黃；中午在正上方、白亮；
  //  下午移到右邊；傍晚右側低角度橘紅；入夜後房間變暗、改成月光＋桌燈。
  //  測試用：網址後面加 ?hour=18.5 可以直接看某個時間的樣子
  (function () {
      //  時間   太陽X  太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影
      //  時間   太陽X 太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影  窗光  窗X(vw) 窗Y(vh) 傾斜  旋轉
      const K = [
          [0,     72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],   // 深夜：月光
          [4.6,   72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],
          [5.6,    0, 66,  255,160,130,  .80,   48, 12, 214,160,200,  .45,  .35, .80, .55, 52,  6,  -42,  6],   // 破曉：粉紫
          [7,      2, 42,  255,206,130,  .95,   40, 18, 255,226,190,  .18,  0,   1.5, .75, 46,  4,  -34,  4],   // 早晨：金黃
          [10,    24, 12,  255,226,170,  .85,   22, 30, 255,248,236,  .04,  0,   1.6, .65, 34, 14,  -18,  2],
          [12.5,  50,  0,  255,246,226,  .70,    0, 38, 255,255,255,  0,    0,   1.4, .55, 22, 34,    0,  0],   // 正午：白亮、影子短
          [15,    78, 12,  255,220,150,  .85,  -22, 30, 255,244,226,  .06,  0,   1.6, .65,  8, 14,   18, -2],
          [17,    98, 40,  255,160, 80,  1,    -42, 18, 255,190,140,  .30,  0,   1.7, .80, -4,  4,   34, -4],   // 傍晚：橘
          [18.2, 100, 66,  255,110, 90,  .85,  -50, 12, 170,110,150,  .52,  .40, 1.1, .55, -8,  6,   42, -6],   // 黃昏：紅紫
          [19.4,  72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],   // 入夜
          [24,    72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],
      ];
      const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
      function apply() {
          const now = new Date();
          const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
          let i = 0; while (i < K.length - 2 && h >= K[i + 1][0]) i++;
          const a = K[i], b = K[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
          const v = a.map((x, j) => x + (b[j] - x) * t);
          const r = document.documentElement.style;
          r.setProperty('--sunx', v[1] + '%');
          r.setProperty('--suny', v[2] + '%');
          r.setProperty('--sunc', `${v[3] | 0},${v[4] | 0},${v[5] | 0}`);
          r.setProperty('--suna', v[6].toFixed(3));
          r.setProperty('--sx', v[7].toFixed(1) + 'px');
          r.setProperty('--sy', v[8].toFixed(1) + 'px');
          r.setProperty('--ovc', `${v[9] | 0},${v[10] | 0},${v[11] | 0}`);
          r.setProperty('--ova', v[12].toFixed(3));
          r.setProperty('--lamp', v[13].toFixed(3));
          r.setProperty('--leafk', v[14].toFixed(3));
          r.setProperty('--win', v[15].toFixed(3));
          r.setProperty('--wx', v[16].toFixed(1) + 'vw');

    editingSlot = 0;
    try { const res = await fetch(`${GAS_URL}?action=getInventory&name=${encodeURIComponent(name)}`, { cache: 'no-store' }); const json = await res.json(); currentRecord = json.data || { t1: '', q1: '', t2: '', q2: '', t3: '', q3: '' }; }
    catch { currentRecord = { t1: '', q1: '', t2: '', q2: '', t3: '', q3: '' }; }
    if (name !== selectedItem) return;
    rememberLatest(name);
    renderRecord();
  }
  function rememberLatest(name) {
    const r = currentRecord; let best = null;
    [1, 2, 3].forEach(n => { const t = r['t' + n]; if (!t) return; const d = new Date(String(t).replace(/\//g, '-')); if (!best || d > best.d) best = { d, q: r['q' + n] }; });
    if (best) { qtyCache[name] = best.q; refreshCardStock(name); }
  }

  function renderRecord(stampSlot) {
    const slots = document.getElementById('inv-slots'), r = currentRecord;
    const nextSlot = getNextSlot(r); slots.innerHTML = '';
    [1, 2, 3].forEach(n => {
      const t = r[`t${n}`], q = r[`q${n}`], hasData = !!t, isCurrent = (n === nextSlot);
      const div = document.createElement('div');
      div.className = 'inv-slot' + (hasData ? ' has-data' : '') + (isCurrent ? ' current' : '');
      div.innerHTML = `<div class="slot-label">記錄 ${n}</div>
        ${hasData ? `<button type="button" class="slot-edit" onclick="editSlot(${n})" title="點一下修改數量">${esc(q)}<span class="slot-pen">✎</span></button>` : '<div class="slot-qty empty">—</div>'}
        <div class="slot-time${hasData ? '' : ' none'}">${hasData ? formatTime(t) : '尚未記錄'}</div>
        ${stampSlot === n ? '<span class="new-stamp">已盤點</span>' : ''}`;
      slots.appendChild(div);
    });
  }

  /* 點盤點記錄裡的數量 → 直接修改；時間保留原本的 */
  let editingSlot = 0;
  function editSlot(n) {
    if (editingSlot) return;
    editingSlot = n;
    const slot = document.querySelectorAll('#inv-slots .inv-slot')[n - 1];
    const btn = slot.querySelector('.slot-edit');
    const box = document.createElement('div'); box.className = 'slot-editor';
    box.innerHTML = `<input type="text" class="slot-input" inputmode="numeric" maxlength="6" value="${esc(currentRecord['q' + n])}"/>
      <div class="slot-edit-btns"><button type="button" class="slot-save">✔</button><button type="button" class="slot-cancel">✕</button></div>`;
    btn.replaceWith(box);
    const inp = box.querySelector('.slot-input');
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 6); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveSlot(n, inp); if (e.key === 'Escape') { editingSlot = 0; renderRecord(); } });
    box.querySelector('.slot-save').onclick = () => saveSlot(n, inp);
    box.querySelector('.slot-cancel').onclick = () => { editingSlot = 0; renderRecord(); };
    inp.focus(); inp.select();
  }
  async function saveSlot(n, inp) {
    const qty = inp.value.trim();
    if (!qty || parseInt(qty) <= 0) { showInvMsg('⚠ 數量必須是大於 0 的整數', 'err'); inp.focus(); return; }
    if (qty === String(currentRecord['q' + n])) { editingSlot = 0; renderRecord(); return; }
    const raw = currentRecord['t' + n];
    const d = new Date(String(raw).replace(/\//g, '-'));
    const time = isNaN(d) ? String(raw) : d.toLocaleString('zh-TW', { hour12: false });
    inp.disabled = true; showInvMsg('修改中…', 'ok');
    try {
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'updateInventory', name: selectedItem, slot: n, time, qty }) });
      const json = await res.json();
      if (json.status === 'ok') { currentRecord['q' + n] = qty; editingSlot = 0; rememberLatest(selectedItem); renderRecord(); showInvMsg(`記錄 ${n} 已改為 ${qty}`, 'ok'); }
      else { inp.disabled = false; showInvMsg('⚠ ' + (json.message || '修改失敗'), 'err'); }
    } catch { inp.disabled = false; showInvMsg('⚠ 連線失敗', 'err'); }
  }

  function getNextSlot(r) {
    if (!r.t1) return 1; if (!r.t2) return 2; if (!r.t3) return 3;
    const times = [1, 2, 3].map(slot => ({ slot, t: new Date(String(r['t' + slot]).replace(/\//g, '-')) }));
    times.sort((a, b) => a.t - b.t); return times[0].slot;
  }
  function formatTime(raw) { if (!raw) return '—'; const d = new Date(String(raw).replace(/\//g, '-')); if (isNaN(d)) return String(raw).slice(0, 16); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}\n${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
  function formatDateShort(raw) { if (!raw) return '—'; const d = new Date(String(raw).replace(/\//g, '-')); if (isNaN(d)) return String(raw).slice(0, 16); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

  document.getElementById('inv-qty').addEventListener('input', function () {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    const hint = document.getElementById('inv-qty-hint'), v = parseInt(this.value);
    if (!this.value) { hint.className = 'inv-qty-hint'; hint.textContent = '僅限輸入正整數'; }
    else if (v <= 0) { hint.className = 'inv-qty-hint err'; hint.textContent = '⚠ 數量必須大於 0'; }
    else { hint.className = 'inv-qty-hint'; hint.textContent = '✓ 格式正確'; }
  });
  document.getElementById('inv-qty').addEventListener('keydown', e => { if (e.key === 'Enter') submitInventory(); });

  async function submitInventory() {
    const qty = document.getElementById('inv-qty').value.trim(), btn = document.getElementById('btn-inventory');
    if (!selectedItem) { showInvMsg('⚠ 請先點選文具', 'err'); return; }
    if (!qty || parseInt(qty) <= 0) { showInvMsg('⚠ 請輸入有效數量', 'err'); return; }
    btn.disabled = true; showInvMsg('盤點記錄中…', 'ok');
    const timestamp = new Date().toLocaleString('zh-TW', { hour12: false }), slot = getNextSlot(currentRecord);
    try {
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'updateInventory', name: selectedItem, slot, time: timestamp, qty }) });
      const json = await res.json();
      if (json.status === 'ok') {
        currentRecord[`t${slot}`] = timestamp; currentRecord[`q${slot}`] = qty;
        qtyCache[selectedItem] = qty; refreshCardStock(selectedItem);
        renderRecord(slot);                                  // 蓋章動畫
        document.getElementById('inv-qty').value = '';
        document.getElementById('inv-qty-hint').textContent = '僅限輸入正整數';
        showInvMsg(`已記錄到「記錄 ${slot}」`, 'ok');
      } else showInvMsg('⚠ ' + (json.message || '記錄失敗'), 'err');
    } catch { showInvMsg('⚠ 連線失敗', 'err'); } finally { btn.disabled = false; }
  }
  function showInvMsg(text, type) { const el = document.getElementById('inv-msg'); el.textContent = text; el.className = 'inv-msg show ' + type; }

  /* ══════════ 搜尋 ══════════ */
  let searchTimer = null;
  document.getElementById('search-input').addEventListener('input', function () { searchKw = this.value.trim(); document.getElementById('search-clear').classList.toggle('show', searchKw.length > 0); clearTimeout(searchTimer); searchTimer = setTimeout(() => applySearch(), 150); });
  function applySearch() { if (!searchKw) { renderList(allItems, ''); return; } const results = allItems.filter(item => fuzzyMatch(item, searchKw)).map(item => ({ item, score: relevanceScore(item, searchKw) })).sort((a, b) => b.score - a.score).map(r => r.item); renderList(results, searchKw); }
  function clearSearch() { document.getElementById('search-input').value = ''; document.getElementById('search-clear').classList.remove('show'); searchKw = ''; renderList(allItems, ''); }

  async function fetchItems() {
    setStatus('busy', '同步中…');
    try {
      const res = await fetch(`${GAS_URL}?action=getStationeryDB&query=`, { cache: 'no-store' }); const json = await res.json();
      if (json.status === 'ok') { allItems = json.data || []; applySearch(); setStatus('ok', '已同步'); document.getElementById('last-sync').textContent = '更新 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false }); }
      else setStatus('err', '讀取失敗');
    } catch { setStatus('err', '連線失敗'); }
  }
  fetchItems(); setInterval(fetchItems, POLL_MS);

  /* ══════════ 新增／刪除文具 ══════════ */
  function openModal(type) { document.getElementById(type + '-name').value = ''; document.getElementById(type + '-msg').className = 'modal-msg'; document.getElementById(type + '-overlay').classList.add('active'); setTimeout(() => document.getElementById(type + '-name').focus(), 350); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function showModalMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'modal-msg show ' + type; }
  async function submitAdd() { const name = document.getElementById('add-name').value.trim(); if (!name) { showModalMsg('add-msg', '⚠ 請輸入文具名稱', 'err'); return; } showModalMsg('add-msg', '新增中…', 'ok'); try { const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'addStationeryDB', name }) }); const json = await res.json(); if (json.status === 'ok') { showModalMsg('add-msg', '新增成功！', 'ok'); setTimeout(() => { closeModal('add-overlay'); fetchItems(); }, 900); } else showModalMsg('add-msg', '⚠ ' + (json.message || '新增失敗'), 'err'); } catch { showModalMsg('add-msg', '⚠ 連線失敗', 'err'); } }
  async function submitDel() { const name = document.getElementById('del-name').value.trim(); if (!name) { showModalMsg('del-msg', '⚠ 請輸入文具名稱', 'err'); return; } showModalMsg('del-msg', '刪除中…', 'ok'); try { const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'delStationeryDB', name }) }); const json = await res.json(); if (json.status === 'ok') { showModalMsg('del-msg', '刪除成功！', 'ok'); setTimeout(() => { closeModal('del-overlay'); fetchItems(); }, 900); } else showModalMsg('del-msg', '⚠ ' + (json.message || '找不到該文具'), 'err'); } catch { showModalMsg('del-msg', '⚠ 連線失敗', 'err'); } }
  document.querySelectorAll('.overlay').forEach(el => { el.addEventListener('click', e => { if (e.target === el) el.classList.remove('active'); }); });
  document.getElementById('add-name').addEventListener('keydown', e => { if (e.key === 'Enter') submitAdd(); });
  document.getElementById('del-name').addEventListener('keydown', e => { if (e.key === 'Enter') submitDel(); });

  /* ══════════ 日期章：顯示「2026 / 11 / 12」 ══════════ */
  function updateDateShow(inp) {
    const box = inp.parentNode.querySelector('.date-show');
    if (inp.value) { const [y, m, d] = inp.value.split('-'); box.textContent = `${y} / ${m} / ${d}`; box.classList.remove('empty'); }
    else { box.textContent = '年 / 月 / 日'; box.classList.add('empty'); }
  }
  document.querySelectorAll('.date-input').forEach(inp => {
    const wrap = document.createElement('div'); wrap.className = 'date-wrap';
    const show = document.createElement('div'); show.className = 'date-show';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(show); wrap.appendChild(inp);
    inp.addEventListener('change', () => updateDateShow(inp));
    inp.addEventListener('input', () => updateDateShow(inp));
    inp.addEventListener('click', () => { try { inp.showPicker && inp.showPicker(); } catch (e) {} });
    updateDateShow(inp);
  });

  function applyDateFilter(fromUser = true) {   // 自動同步時 fromUser=false，不跳回第 1 頁
    const fromVal = document.getElementById('date-from').value, toVal = document.getElementById('date-to').value;
    const hint = document.getElementById('date-filter-hint');
    if (!fromVal && !toVal) { hint.textContent = '⚠ 請至少選擇一個日期'; hint.style.color = '#a8432c'; return; }
    const from = fromVal ? new Date(fromVal + 'T00:00:00') : null, to = toVal ? new Date(toVal + 'T23:59:59') : null;
    const filtered = allOrderRecords.filter(r => { const d = new Date(String(r.time).replace(/\//g, '-')); if (isNaN(d)) return false; if (from && d < from) return false; if (to && d > to) return false; return true; });
    isFiltering = true;
    const label = [(fromVal || '最早'), '～', (toVal || '最新')].join(' ');
    hint.style.color = '';
    hint.textContent = filtered.length > 0 ? `${label}，共 ${filtered.length} 筆` : `${label} 沒有領用紀錄`;
    if (!fromUser) { renderOrderRecords(filtered); return; }
    lastSlipSig = ''; renderOrderRecords(filtered); goPage(document.getElementById('order-records-body'), 0, false); syncNav(document.getElementById('order-records-body'), document.getElementById('order-nav'), slipPages);
  }
  function resetDateFilter() {
    document.getElementById('date-from').value = ''; document.getElementById('date-to').value = '';
    document.querySelectorAll('.date-input').forEach(updateDateShow);
    document.getElementById('date-filter-hint').textContent = '';
    isFiltering = false; lastSlipSig = ''; renderOrderRecords(allOrderRecords); goPage(document.getElementById('order-records-body'), 0, false); syncNav(document.getElementById('order-records-body'), document.getElementById('order-nav'), slipPages);
  }

  /* ══════════ 領用單存根 ══════════ */
  async function fetchOrderRecords() {
    try {
      const res = await fetch(`${GAS_URL}?action=getOrderRecords`, { cache: 'no-store' }); const json = await res.json();
      if (json.status === 'ok') { allOrderRecords = json.data || []; if (!isFiltering) renderOrderRecords(allOrderRecords); else applyDateFilter(false); }
    } catch {}
  }
  let lastSlipSig = '', slipPages = 1;
  function renderOrderRecords(rows) {
    const body = document.getElementById('order-records-body'), count = document.getElementById('order-count'), nav = document.getElementById('order-nav');
    rows = rows || [];
    const sig = JSON.stringify(rows);
    if (sig === lastSlipSig) return;
    const firstPaint = !lastSlipSig; lastSlipSig = sig;
    const keepPage = pageIndex(body);
    body.classList.toggle('no-intro', !firstPaint);
    body.innerHTML = '';
    if (!rows.length) { body.innerHTML = `<div class="page"><div class="empty-line">目前尚無文具領用紀錄</div></div>`; count.style.display = 'none'; slipPages = 1; buildNav(body, nav, 1); return; }
    count.style.display = 'inline-block'; count.textContent = `共 ${rows.length} 筆`;
    // 最新的在第 1 頁最上面，越往右滑越舊
    const newestFirst = rows.map((r, i) => ({ r, n: i + 1 })).reverse();
    const pages = chunk(newestFirst, PER_PAGE); slipPages = pages.length;
    pages.forEach(pageRows => {
      const page = document.createElement('div'); page.className = 'page slips'; body.appendChild(page);
      pageRows.forEach(({ r, n }, k) => {
        const x = Math.sin(n * 9.1) * 10000, tilt = ((x - Math.floor(x)) * 1.2 - 0.6).toFixed(2);
        const div = document.createElement('div');
        div.className = 'slip';
        div.style.cssText = `--tilt:${tilt}deg;--in:${(k * 0.03).toFixed(2)}s`;
        div.innerHTML = `<span class="sno">No.${n}</span>
          <div class="row"><i>領用人</i><span class="who">${esc(r.name)}</span></div>
          <div class="row"><i>文具</i><span class="what">${esc(r.item)}</span></div>
          <div class="row"><i>數量</i><span class="qty">${esc(r.qty)}</span></div>
          <div class="row"><i>時間</i><span class="when">${formatDateShort(r.time)}</span></div>
          ${r.notes ? `<div class="row"><i>備註</i><span class="memo">${esc(r.notes)}</span></div>` : ''}`;
        page.appendChild(div);
      });
    });
    buildNav(body, nav, slipPages);
    goPage(body, Math.min(keepPage, slipPages - 1), false);
    syncNav(body, nav, slipPages);
  }
  watchPager(document.getElementById('order-records-body'), document.getElementById('order-nav'), () => slipPages);
  fetchOrderRecords(); setInterval(fetchOrderRecords, POLL_MS);
</script>
</body>
