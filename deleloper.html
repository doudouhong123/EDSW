<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#efe6d8">
    <title>後台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ══════════ 窗邊葉影（整體重新設計）══════════
           概念：午後陽光照進辦公室，牆上有樹葉的影子；
           面板像一張厚紙卡，功能球是霧面陶瓷，不用發光特效。
           光源統一在左上，所有影子都往右下落。 */
        :root {
            --wall:    #efe6d8;
            --paper:   #fbf8f2;
            --paper-2: #f4eee4;
            --ink:     #2f2a24;
            --ink-2:   #5b5348;
            --muted:   #8f8579;
            --hair:    #e3d9ca;
            --sage:    #6f8a68;
            --ball:    clamp(160px, 48vw, 196px);   /* 陶瓷球直徑 */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── 牆面：暖白灰泥＋細顆粒 ── */
        html {
            min-height: 100%;
            background-color: var(--wall);
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
                linear-gradient(160deg, #f3ebdf 0%, #ebe1d1 55%, #e2d6c3 100%);
            background-attachment: fixed;
        }
        body {
            font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; min-height: 100dvh;
            padding: 28px 16px;
            display: flex; justify-content: center; align-items: center;
            color: var(--ink);
            background: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 陽光與葉影：隨時間變化（新增）──
           --sunx/--suny 太陽位置、--sunc 光色、--suna 強度、--sx/--sy 影子方向、
           --ovc/--ova 天色（傍晚、夜晚變暗）、--lamp 夜間桌燈。由下方程式每分鐘更新。 */
        :root {
            --sunx: 18%; --suny: 12%; --sunc: 255,220,165; --suna: .55;
            --sx: 14px; --sy: 24px; --ovc: 255,255,255; --ova: 0; --lamp: 0; --leafk: 1;
            --win: .5; --wx: 40vw; --wy: 10vh; --wsk: -20deg; --wrot: 0deg;
        }
        .sunlight {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 95% 75% at var(--sunx) var(--suny), rgba(var(--sunc), var(--suna)), rgba(var(--sunc), 0) 75%),
                linear-gradient(0deg, rgba(120,95,65,0.10), rgba(120,95,65,0) 35%);
        }
        /* 窗格光斑：陽光穿過窗戶投在牆上的亮塊，位置與傾斜跟著太陽走（加強） */
        .window-light {
            position: fixed; z-index: 0; pointer-events: none;
            top: var(--wy); left: var(--wx);
            width: 58vw; max-width: 620px; height: 72vh;
            transform: skewX(var(--wsk)) rotate(var(--wrot));
            transform-origin: 50% 0;
            background:
                linear-gradient(90deg, transparent 0 calc(50% - 7px), rgba(0,0,0,1) calc(50% - 7px) calc(50% + 7px), transparent calc(50% + 7px)),
                linear-gradient(180deg, transparent 0 calc(48% - 7px), rgba(0,0,0,1) calc(48% - 7px) calc(48% + 7px), transparent calc(48% + 7px));
            -webkit-mask: linear-gradient(#000, #000);
            opacity: calc(var(--win) * 0.6);
            filter: blur(12px);
            mix-blend-mode: soft-light;
        }
        .window-light::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(var(--sunc), 1);
            -webkit-mask:
                linear-gradient(90deg, #000 0 calc(50% - 7px), transparent calc(50% - 7px) calc(50% + 7px), #000 calc(50% + 7px)),
                linear-gradient(180deg, #000 0 calc(48% - 7px), transparent calc(48% - 7px) calc(48% + 7px), #000 calc(48% + 7px));
            -webkit-mask-composite: source-in; mask-composite: intersect;
        }
        .window-light { background: none; }

        /* 天色：清晨、傍晚帶色，夜晚整個房間變暗 */
        .ambient {   /* 牆面：完整變暗 */
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: rgb(var(--ovc)); opacity: var(--ova);
            mix-blend-mode: multiply;
        }
        .ambient-top {   /* 卡片：只稍微變暗，保持好讀 */
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: rgb(var(--ovc)); opacity: calc(var(--ova) * 0.38);
            mix-blend-mode: multiply;
        }
        /* 夜晚：背板稍微不透明一點，小字加深，維持好讀 */
        html.night .container { background-color: rgba(250,246,238,0.32); }
        html.night { --muted: #6f665b; }

        /* 寫實光影畫布＋牆面顆粒 */
        #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        .grain {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            mix-blend-mode: multiply;
        }
        /* 夜間桌燈：卡片附近一圈暖光，晚上也看得清楚 */
        .lamp {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,186,110,0.45), rgba(255,186,110,0) 70%);
            mix-blend-mode: soft-light; opacity: var(--lamp);
        }
        .leaves { position: fixed; pointer-events: none; mix-blend-mode: multiply; will-change: transform;
                  translate: calc(var(--sx) * -1.6) calc(var(--sy) * 0.6 - 14px); }   /* 影子隨太陽方向偏移 */
        .leaves path { fill: #4a4532; }
        .leaves.l-back  { z-index: 0; top: -12vh; right: -18vw; width: min(130vw, 980px);
                          opacity: calc(.17 * var(--leafk)); filter: blur(10px); transform-origin: 95% 0%;
                          animation: swayA 12s ease-in-out infinite alternate; }
        .leaves.l-low   { z-index: 0; bottom: -14vh; left: -16vw; width: min(85vw, 620px);
                          opacity: calc(.17 * var(--leafk)); filter: blur(5px); transform-origin: 50% 50%;
                          transform: rotate(180deg);
                          animation: swayC 10s ease-in-out infinite alternate; }
        /* 最前面一層葉影也落在卡片上，像真的光影 */
        .leaves.l-front { z-index: 3; top: -8vh; right: -10vw; width: min(105vw, 780px);
                          opacity: calc(.15 * var(--leafk)); filter: blur(3.5px); transform-origin: 95% 0%;
                          animation: swayB 7.5s ease-in-out infinite alternate; }
        @keyframes swayA { from { transform: rotate(-1.2deg); } to { transform: rotate(1.6deg) translate(-10px,6px); } }
        @keyframes swayB { from { transform: rotate(1deg); }    to { transform: rotate(-2deg) translate(8px,-4px); } }
        @keyframes swayC { from { transform: rotate(180deg); }  to { transform: rotate(182deg) translate(6px,4px); } }

        /* ── 紙卡面板 ── */
        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            padding: 30px 26px 22px;
            border-radius: 6px;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
                linear-gradient(170deg, rgba(253,251,247,0.34) 0%, rgba(251,248,242,0.28) 45%, rgba(244,238,228,0.24) 100%);
            /* 背板半透明（修改）：像一片霧面描圖紙，透出後面的光影 */
            transition: background-color .6s;
            -webkit-backdrop-filter: blur(2.5px) saturate(1.1);
            backdrop-filter: blur(2.5px) saturate(1.1);
            box-shadow:
                0 1px 0 rgba(255,255,255,0.9) inset,
                0 0 0 1px rgba(120,100,70,0.08),
                2px 3px 4px rgba(70,50,30,0.10),
                calc(var(--sx) * 0.9) calc(var(--sy) * 1) 30px rgba(70,50,30,0.22),
                calc(var(--sx) * 2.2) calc(var(--sy) * 2.4) 70px rgba(70,50,30,0.20);   /* 影子跟著太陽走 */
            text-align: center;
            animation: rise 0.8s cubic-bezier(.2,.7,.2,1);
        }
        @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
        .rivet { display: none; }

        /* 頁首：日期、問候、細線 */
        #time {
            font-size: 0.82rem; font-weight: 500; letter-spacing: 0.08em;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            margin-bottom: 14px;
        }
        #welcome {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.75rem; font-weight: 700; letter-spacing: 0.12em;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .subtitle {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: 0.72rem; letter-spacing: 0.32em; color: var(--muted); font-weight: 500;
            margin-bottom: 4px;
        }
        .subtitle::before, .subtitle::after { content: ''; width: 34px; height: 1px; background: var(--hair); }

        /* ══════════ 功能選單：牆上的吊牌 ══════════
           一條木頭掛條＋黃銅掛勾，四塊上漆木牌用細繩掛著，隨風輕晃 */
        .stage.hooks {
            position: relative; height: 262px;
            margin: 24px -4px 0; padding-top: 0;
            display: flex; justify-content: space-evenly;
        }
        .rail {
            position: absolute; left: 0; right: 0; top: 2px; height: 18px; border-radius: 3px;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='40'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .16  0 0 0 0 .08  0 0 0 .28 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
                linear-gradient(180deg, #c9a37a 0%, #a97f55 55%, #8a6440 100%);
            background-size: 300px 18px, auto;
            box-shadow: inset 0 1px 0 rgba(255,235,205,0.55), inset 0 -2px 0 rgba(60,35,15,0.25), 4px 7px 9px rgba(70,50,30,0.25);
        }
        .slot {
            position: relative; z-index: 1;
            width: 22%; max-width: 92px; height: 100%;
            border: none; background: none; padding: 0;
            cursor: pointer; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .slot:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; border-radius: 6px; }
        /* 黃銅掛勾 */
        .peg {
            position: absolute; z-index: 3; top: 5px; left: 50%;
            width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f6e3ad, #c2964a 55%, #6e5020);
            box-shadow: 1px 2px 2px rgba(40,25,10,0.35);
        }
        /* 會晃動的部分：繩子＋木牌，以掛勾為支點 */
        .swing {
            position: absolute; top: 11px; left: 0; right: 0; height: 236px;
            transform-origin: 50% 0;
            animation: idle 5.5s ease-in-out infinite alternate;
            animation-delay: var(--delay);
            filter: drop-shadow(calc(var(--sx) * 0.45) calc(var(--sy) * 0.4 + 2px) 6px rgba(60,40,22,0.34));
            transition: transform .45s cubic-bezier(.3,.7,.2,1), opacity .4s ease;
        }
        @keyframes idle  { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
        @keyframes swing { 0% { transform: rotate(0); } 25% { transform: rotate(6deg); } 55% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } 100% { transform: rotate(0); } }
        .slot:hover .swing { animation: swing 1.4s ease-out; }
        /* 繩子：從掛勾斜拉到牌子的孔 */
        .cord {
            position: absolute; top: 0; left: 50%; width: 1.6px; height: 34px; margin-left: -0.8px;
            background: linear-gradient(180deg, #7a6248, #5e4934);
            border-radius: 1px;
        }
        /* 上漆木牌 */
        .plate {
            position: absolute; top: 28px; left: 0; right: 0; height: 196px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 40px; gap: 16px;
            clip-path: polygon(22% 0, 78% 0, 100% 11%, 100% 100%, 0 100%, 0 11%);
            border-radius: 0 0 6px 6px;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.5 0.012' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),
                radial-gradient(ellipse at 30% 15%, rgba(255,255,255,0.22), rgba(255,255,255,0) 60%),
                linear-gradient(170deg, var(--c1) 0%, var(--c2) 100%);
            background-size: 100% 100%, auto, auto;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
            color: #fff8ec;
        }
        /* 牌子邊緣的木頭厚度感 */
        .plate::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            clip-path: inherit;
            box-shadow: inset -3px -4px 0 rgba(40,25,10,0.16), inset 2px 2px 0 rgba(255,255,255,0.14);
        }
        /* 黃銅孔眼 */
        .hole {
            position: absolute; top: 9px; left: 50%; width: 12px; height: 12px; margin-left: -6px;
            border-radius: 50%;
            background: radial-gradient(circle, #4a3a2a 0 3px, #d9b56a 3.5px 5px, #8a6a30 5.5px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }
        .plate .ic svg {
            width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.7;
            stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 -1px 0 rgba(40,25,10,0.3));
        }
        .plate .lb {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.12rem; font-weight: 700; line-height: 1.55; letter-spacing: 0.18em; padding-left: 0.18em;
            /* 雕刻字：上暗下亮 */
            text-shadow: 0 -1px 0 rgba(40,25,10,0.35), 0 1px 0 rgba(255,255,255,0.18);
        }
        /* 取下牌子：往上提起後淡出 */
        .slot.opening .swing { animation: none; transform: translateY(-30px) rotate(-3deg); opacity: 0; }
        /* 待確認：貼在牌子右上角的紅色圓貼紙 */
        .stage.hooks .pend-badge {
            display: none; position: absolute; top: 40px; right: -8px; z-index: 2;
            min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
            background: #b04a32; color: #fff8ef;
            font-size: 0.72rem; font-weight: 700; line-height: 26px; white-space: nowrap;
            box-shadow: 1px 2px 3px rgba(60,30,15,0.3);
            transform: rotate(8deg);
        }
        .hook-hint { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.14em; margin-top: 2px; }
        .dots { display: none !important; }
        @media (max-width: 380px) { .plate .lb { font-size: 1rem; } }

        /* 指示點 */
        .dots { display: flex; justify-content: center; gap: 2px; margin-top: 0; }
        .dot { position: relative; width: 24px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; }
        .dot::before {
            content: ''; position: absolute; left: 50%; top: 50%;
            width: 6px; height: 6px; transform: translate(-50%, -50%);
            border-radius: 3px; background: #d6cbbb;
            transition: all 0.35s ease;
        }
        .dot.on::before { width: 20px; background: var(--dc); }
        .dot.alert::after {
            content: ''; position: absolute; top: 4px; right: 3px;
            width: 6px; height: 6px; border-radius: 50%; background: #a8432c;
        }

        /* 返回：掛在釘子上的小木牌（和上方吊牌同一套） */
        #return {
            position: relative;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 136px; height: 44px;
            margin: 50px auto 0;
            border: none; border-radius: 5px;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='60'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.015 0.45' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
                radial-gradient(ellipse at 30% 20%, rgba(255,250,235,0.35), rgba(255,250,235,0) 60%),
                linear-gradient(175deg, #e2c49c 0%, #cfa978 60%, #b98f5d 100%);
            background-size: 200px 44px, auto, auto;
            box-shadow:
                inset 0 1px 0 rgba(255,245,225,0.6),
                inset -2px -3px 0 rgba(80,50,20,0.18),
                5px 9px 10px rgba(70,50,30,0.25);
            color: #5a3d22;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem; font-weight: 700; letter-spacing: 0.3em; padding-left: 0.3em;
            text-shadow: 0 1px 0 rgba(255,240,215,0.55), 0 -1px 0 rgba(70,40,15,0.2);   /* 雕刻字 */
            cursor: pointer;
            transform-origin: 50% -28px;          /* 以上方釘子為支點 */
            animation: signIdle 6s ease-in-out infinite alternate;
            -webkit-tap-highlight-color: transparent;
        }
        /* 兩條細繩拉成 V 字，掛在一根黃銅釘上 */
        #return::before {
            content: ''; position: absolute; left: 50%; top: -34px;
            width: 110px; height: 36px; margin-left: -55px;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='36'><path d='M14 36 L55 6 L96 36' fill='none' stroke='%236a5340' stroke-width='1.6'/><circle cx='14' cy='35' r='2.4' fill='%23b9924f'/><circle cx='96' cy='35' r='2.4' fill='%23b9924f'/></svg>") no-repeat;
            pointer-events: none;
        }
        #return::after {
            content: ''; position: absolute; left: 50%; top: -34px;
            width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f6e3ad, #c2964a 55%, #6e5020);
            box-shadow: 1px 2px 2px rgba(40,25,10,0.35);
        }
        #return .arr { letter-spacing: 0; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; }
        @keyframes signIdle  { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
        @keyframes signSwing { 0% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 55% { transform: rotate(4deg); } 80% { transform: rotate(-2deg); } 100% { transform: rotate(0); } }
        #return:hover  { animation: signSwing 1.3s ease-out; }
        #return:active { box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), inset -2px -3px 0 rgba(80,50,20,0.18), 2px 4px 6px rgba(70,50,30,0.22); }
        #return:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 4px; }
        @media (prefers-reduced-motion: reduce) { #return { animation: none !important; } }

        /* 連線狀態：頁尾一行小字 */
        .sys-status {
            margin: 18px auto 0; padding-top: 12px;
            border-top: 1px solid var(--hair);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.74rem; color: var(--muted); line-height: 1.5; text-align: left;
        }
        .sys-status.ok  { color: var(--ink-2); }
        .sys-status.err { color: #a8432c; font-weight: 500; }
        .sys-dot { width: 6px; height: 6px; border-radius: 50%; background: #c9bfb1; flex-shrink: 0; }
        .sys-status.ok  .sys-dot { background: var(--sage); animation: breathe 3s ease-in-out infinite; }
        .sys-status.err .sys-dot { background: #a8432c; }
        @keyframes breathe { 50% { opacity: 0.35; } }
        .sys-text { flex: 0 1 auto; }
        .btn-recheck {
            flex-shrink: 0; padding: 0; border: none; background: none;
            color: var(--sage); font-size: 0.74rem; font-weight: 700; font-family: inherit;
            cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
        }

    <script>
        // ══ 光線隨時間變化（新增）══
        //  早上太陽在左邊（東）低低的、偏金黃；中午在正上方、白亮；
        //  下午移到右邊；傍晚右側低角度橘紅；入夜後房間變暗、改成月光＋桌燈。
        //  測試用：網址後面加 ?hour=18.5 可以直接看某個時間的樣子
        (function () {
            //  時間   太陽X  太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影
            //  時間   太陽X 太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影  窗光  窗X(vw) 窗Y(vh) 傾斜  旋轉
            const K = [
                [0,     72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],   // 深夜：月光
                [4.6,   72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],
                [5.6,    0, 66,  255,160,130,  .80,   48, 12, 214,160,200,  .45,  .35, .80, .55, 52,  6,  -42,  6],   // 破曉：粉紫
                [7,      2, 42,  255,206,130,  .95,   40, 18, 255,226,190,  .18,  0,   1.5, .75, 46,  4,  -34,  4],   // 早晨：金黃
                [10,    24, 12,  255,226,170,  .85,   22, 30, 255,248,236,  .04,  0,   1.6, .65, 34, 14,  -18,  2],
                [12.5,  50,  0,  255,246,226,  .70,    0, 38, 255,255,255,  0,    0,   1.4, .55, 22, 34,    0,  0],   // 正午：白亮、影子短
                [15,    78, 12,  255,220,150,  .85,  -22, 30, 255,244,226,  .06,  0,   1.6, .65,  8, 14,   18, -2],
                [17,    98, 40,  255,160, 80,  1,    -42, 18, 255,190,140,  .30,  0,   1.7, .80, -4,  4,   34, -4],   // 傍晚：橘
                [18.2, 100, 66,  255,110, 90,  .85,  -50, 12, 170,110,150,  .52,  .40, 1.1, .55, -8,  6,   42, -6],   // 黃昏：紅紫
                [19.4,  72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],   // 入夜
                [24,    72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],
            ];
            const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
            function apply() {
                const now = new Date();
                const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
                let i = 0; while (i < K.length - 2 && h >= K[i + 1][0]) i++;
                const a = K[i], b = K[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
                const v = a.map((x, j) => x + (b[j] - x) * t);
                const r = document.documentElement.style;
                r.setProperty('--sunx', v[1] + '%');
                r.setProperty('--suny', v[2] + '%');
                r.setProperty('--sunc', `${v[3] | 0},${v[4] | 0},${v[5] | 0}`);
                r.setProperty('--suna', v[6].toFixed(3));
                r.setProperty('--sx', v[7].toFixed(1) + 'px');
                r.setProperty('--sy', v[8].toFixed(1) + 'px');
                r.setProperty('--ovc', `${v[9] | 0},${v[10] | 0},${v[11] | 0}`);
                r.setProperty('--ova', v[12].toFixed(3));
                r.setProperty('--lamp', v[13].toFixed(3));
                r.setProperty('--leafk', v[14].toFixed(3));
                r.setProperty('--win', v[15].toFixed(3));
                r.setProperty('--wx', v[16].toFixed(1) + 'vw');
                r.setProperty('--wy', v[17].toFixed(1) + 'vh');
                r.setProperty('--wsk', v[18].toFixed(1) + 'deg');
                r.setProperty('--wrot', v[19].toFixed(1) + 'deg');
                document.documentElement.classList.toggle('night', v[12] > 0.45);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.content = v[12] > 0.6 ? '#4b5270' : (v[12] > 0.3 ? '#c9a9a8' : '#efe6d8');
            }
            apply();
            setInterval(apply, 60 * 1000);   // 每分鐘更新一次
        })();

        // ══════════════════════════════════════════
        //  寫實光影（Canvas）
        //  牆面在陰影中是偏冷的灰；陽光穿過窗戶，在牆上投出一塊暖色光斑，
        //  窗框形成十字陰影，窗外的樹葉在光斑裡留下深淺不一的影子並隨風擺動。
        //  早上太陽低、光斑又長又斜、偏右；中午太陽高、光斑小而低；
        //  下午移到左邊；傍晚轉橘紅；夜晚只剩微弱的冷色月光。
        // ══════════════════════════════════════════
        (function () {
            const cv = document.getElementById('scene');
            const ctx = cv.getContext('2d');
            const SCALE = 0.5;                       // 半解析度繪製：陰影本來就柔，也比較省電
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
            let W = 0, H = 0;

            // 亂數（固定種子，每次畫出來的樹一樣）
            let seed = 11;
            const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            const R = (a, b) => a + rnd() * (b - a);

            // ── 時間表 ──
            //  時:  陰影牆色RGB      光的加亮RGB     光斑 x   y    寬   高   斜    葉影深淺 風力
            const T = [
                [0,    36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],   // 夜：月光
                [4.6,  36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],
                [5.6, 146,136,146,  105, 58, 46,   .50, .00, .56, .50,  .28,  .70, .7],  // 破曉
                [7,   188,180,170,  100, 72, 34,   .44, .00, .52, .60,  .22,  .85, .8],  // 早晨
                [10,  204,197,187,   72, 60, 40,   .33, .10, .44, .62,  .10,  .90, 1 ],
                [12.5,212,206,196,   52, 48, 38,   .22, .44, .50, .50,  .00,  .80, 1 ],  // 正午：光斑低而小
                [15,  204,196,185,   74, 60, 36,   .18, .10, .44, .62, -.10,  .90, 1 ],
                [17,  178,163,148,  108, 64, 22,   .04, .00, .52, .62, -.22,  .90, .9],  // 傍晚
                [18.2,126,106,112,   96, 40, 24,  -.06, .02, .56, .50, -.28,  .75, .7],  // 黃昏
                [19.4, 36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],  // 入夜
                [24,   36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],
            ];
            function sample() {
                const now = new Date();
                const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
                let i = 0; while (i < T.length - 2 && h >= T[i + 1][0]) i++;
                const a = T[i], b = T[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
                return a.map((x, j) => x + (b[j] - x) * t);
            }

            // ── 畫一根帶葉子的樹枝（黑色剪影）到離屏畫布，再用「縮小再放大」做出柔邊 ──
            function leaf(c, L, Wd) {
                c.beginPath();
                c.moveTo(0, 0);
                c.bezierCurveTo(L * 0.28, -Wd * 1.05, L * 0.72, -Wd * 0.85, L, R(-1, 1));
                c.bezierCurveTo(L * 0.70, Wd * 0.95, L * 0.30, Wd * 0.9, 0, 0);
                c.fill();
                c.lineWidth = 1.1; c.beginPath(); c.moveTo(-L * 0.12, 0); c.lineTo(0, 0); c.stroke();
            }
            function branchSprite(size, blurK, sd) {
                seed = sd;
                const s = document.createElement('canvas'); s.width = s.height = size;
                const c = s.getContext('2d');
                c.fillStyle = '#000'; c.strokeStyle = '#000'; c.lineCap = 'round';
                function grow(x, y, ang, len, thick, depth) {
                    const steps = Math.max(6, len / 14 | 0);
                    let cx = x, cy = y, a = ang;
                    for (let i = 0; i < steps; i++) {
                        a += R(-0.10, 0.10);
                        const nx = cx + Math.cos(a) * len / steps, ny = cy + Math.sin(a) * len / steps;
                        c.lineWidth = Math.max(0.8, thick * (1 - i / steps));
                        c.beginPath(); c.moveTo(cx, cy); c.lineTo(nx, ny); c.stroke();
                        cx = nx; cy = ny;
                        // 葉子：左右交錯、大小不一、角度隨機
                        if (i > 0 && rnd() < 0.85) {
                            const side = i % 2 ? 1 : -1;
                            c.save(); c.translate(cx, cy);
                            c.rotate(a + side * R(0.6, 1.2));
                            const L = R(22, 42) * (depth ? 0.85 : 1), Wd = L * R(0.26, 0.4);
                            c.scale(1, R(0.55, 1));            // 有些葉子斜著，影子變扁
                            leaf(c, L, Wd); c.restore();
                        }
                        // 小枝
                        if (depth < 2 && i > 1 && rnd() < 0.28) {
                            grow(cx, cy, a + (rnd() < 0.5 ? -1 : 1) * R(0.5, 1.0), len * R(0.3, 0.5), thick * 0.55, depth + 1);
                        }
                    }
                    // 枝端一簇葉
                    for (let k = 0; k < 4; k++) {
                        c.save(); c.translate(cx, cy); c.rotate(a + R(-0.9, 0.9));
                        const L = R(20, 36); leaf(c, L, L * R(0.28, 0.38)); c.restore();
                    }
                }
                grow(size * 0.98, size * 0.04, R(2.3, 2.6), size * 0.95, 6, 0);
                // 柔邊（模擬半影）：縮小再放大
                const k = Math.max(1, blurK);
                const t1 = document.createElement('canvas');
                t1.width = Math.max(1, size / k | 0); t1.height = t1.width;
                const c1 = t1.getContext('2d'); c1.imageSmoothingQuality = 'high';
                c1.drawImage(s, 0, 0, t1.width, t1.height);
                const out = document.createElement('canvas'); out.width = out.height = size;
                const co = out.getContext('2d'); co.imageSmoothingQuality = 'high';
                co.drawImage(t1, 0, 0, size, size);
                return out;
            }

            // 三種距離的樹枝：遠的模糊、近的清楚
            let sprites = [];
            function buildSprites() {
                const base = Math.round(Math.max(W, H) * 0.9);
                sprites = [
                    { img: branchSprite(base,       7, 21), fx: .55, fy: -.18, rot: .25, s: 1.10, a: .55, amp: .020, f: .55, ph: 0   },
                    { img: branchSprite(base,       6, 37), fx: .10, fy:  .05, rot: -.1, s: 0.95, a: .55, amp: .018, f: .48, ph: 1.7 },
                    { img: branchSprite(base * .8,  3.5, 53), fx: .40, fy: -.05, rot: .05, s: 1.00, a: .78, amp: .030, f: .80, ph: 3.1 },
                    { img: branchSprite(base * .8,  3, 71), fx: -.05, fy: .25, rot: -.35, s: 0.90, a: .75, amp: .028, f: .72, ph: 4.4 },
                    { img: branchSprite(base * .6,  1.8, 97), fx: .62, fy: .10, rot: .45, s: 0.90, a: .88, amp: .045, f: 1.1, ph: 2.2 },
                ];
            }

            // 光斑位置：手機直式畫面比較窄，光斑放大一些才看得到
            function geo() {
                const portrait = H > W * 1.2;
                const kw = portrait ? 1.9 : 1, kh = portrait ? 1.05 : 1;
                const w = P[9] * W * kw, h = P[10] * H * kh;
                const x = portrait ? (P[7] - 0.22) * W * 1.35 : P[7] * W;
                const y = P[8] * H * (portrait ? 0.8 : 1);
                return [x, y, w, h, P[11] * W * kw];
            }

            // 光斑（含窗框十字），每分鐘依時間重畫一次
            const patch = document.createElement('canvas');
            let P = null;
            function buildPatch() {
                P = sample();
                patch.width = W; patch.height = H;
                const c = patch.getContext('2d');
                c.clearRect(0, 0, W, H);
                const [x, y, w, h, sk] = geo();
                // 先畫在小畫布再放大 → 光斑邊緣自然柔和
                const k = 6, sm = document.createElement('canvas');
                sm.width = Math.ceil(W / k); sm.height = Math.ceil(H / k);
                const s = sm.getContext('2d');
                s.scale(1 / k, 1 / k);
                s.fillStyle = `rgb(${P[4] | 0},${P[5] | 0},${P[6] | 0})`;
                s.beginPath();
                s.moveTo(x, y); s.lineTo(x + w, y); s.lineTo(x + w + sk, y + h); s.lineTo(x + sk, y + h); s.closePath();
                s.fill();
                // 窗框：一直一橫的陰影
                s.globalCompositeOperation = 'destination-out';
                const mw = Math.max(6, w * 0.035);
                s.beginPath();
                s.moveTo(x + w * .5 - mw / 2, y); s.lineTo(x + w * .5 + mw / 2, y);
                s.lineTo(x + w * .5 + mw / 2 + sk, y + h); s.lineTo(x + w * .5 - mw / 2 + sk, y + h); s.closePath(); s.fill();
                const yy = y + h * .46, sx = sk * .46;
                s.fillRect(x + sx - 4, yy - mw / 2, w + 8, mw);
                c.imageSmoothingQuality = 'high';
                c.drawImage(sm, 0, 0, W, H);
            }

            const light = document.createElement('canvas');
            function draw(t) {
                if (!P) return;
                const lc = light.getContext('2d');
                lc.globalCompositeOperation = 'source-over';
                lc.clearRect(0, 0, W, H);
                lc.drawImage(patch, 0, 0);
                // 樹葉擋光：從光斑中「挖掉」葉影
                lc.globalCompositeOperation = 'destination-out';
                const [x, y, w, h, sk] = geo();
                const wind = P[13];
                // 陣風：幾個慢速波疊起來，偶爾大一點
                const gust = Math.max(0, Math.sin(t * 0.21) + Math.sin(t * 0.083 + 1.3) - 0.6) * 0.6;
                sprites.forEach(sp => {
                    const sway = (Math.sin(t * sp.f + sp.ph) + 0.45 * Math.sin(t * sp.f * 2.3 + sp.ph * 1.7)) * sp.amp * wind
                               + gust * sp.amp * 1.6 * wind;
                    const size = sp.img.width * sp.s;
                    lc.save();
                    lc.globalAlpha = sp.a * P[12];
                    lc.translate(x + w * sp.fx + sk * 0.3, y + h * sp.fy);
                    lc.transform(1, 0, P[11] * 0.6, 1, 0, 0);     // 影子跟著光線一起斜
                    lc.rotate(sp.rot + sway);
                    lc.translate(Math.sin(t * sp.f * 0.7 + sp.ph) * 3 * wind, 0);
                    lc.drawImage(sp.img, -size * 0.5, -size * 0.1, size, size);
                    lc.restore();
                });
                // 牆面＝陰影色，再「加上」光
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = `rgb(${P[1] | 0},${P[2] | 0},${P[3] | 0})`;
                ctx.fillRect(0, 0, W, H);
                // 室內的反射光：靠下方稍暗（地板方向）
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, 'rgba(255,255,255,0.04)'); g.addColorStop(1, 'rgba(40,25,10,0.10)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                ctx.globalCompositeOperation = 'lighter';
                ctx.drawImage(light, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
            }

            function resize() {
                W = Math.max(1, Math.round(innerWidth * SCALE));
                H = Math.max(1, Math.round(innerHeight * SCALE));
                cv.width = W; cv.height = H; light.width = W; light.height = H;
                buildSprites(); buildPatch(); draw(performance.now() / 1000);
            }
            resize();
            let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
            setInterval(() => { buildPatch(); if (reduce) draw(0); }, 60 * 1000);

            if (!reduce) {
                let last = 0;
                (function loop(ts) {
                    requestAnimationFrame(loop);
                    if (document.hidden || ts - last < 33) return;   // 約每秒 30 張
                    last = ts;
                    draw(ts / 1000);
                })(0);
            }
        })();

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyACtMKVngQdstQIvWwhxhG5AdvCZElmCdKvW8kQLWguHxLCWESDlVPjm13Ae_lEgDd/exec';

        // ── 訂餐專用後台帳號（新增）：index 以 2040 登入後台時設定 ──
        //    只保留「訂餐系統」與「返回」，其他球、歸還確認、連線狀態都不顯示
        const MEAL_ONLY_ADMIN = localStorage.getItem('adminMealOnly') === '1';
        if (MEAL_ONLY_ADMIN) {
            ['members', 'devices', 'supplies'].forEach(id => document.getElementById(id).remove());
            document.getElementById('dots').style.display = 'none';
            document.getElementById('sys-status').style.display = 'none';
            document.getElementById('welcome').textContent = '社區醫學科 你好';
        }

        function updateTime() {
            const now = new Date();
            const wk = '日一二三四五六'[now.getDay()];
            const hm = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('time').innerText =
                `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日　星期${wk}　${hm}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 四顆球的跳頁網址寫在各自的 data-url（點球 → 散開特效 → 跳頁）
        document.getElementById('return').addEventListener('click', function() {
            if (confirm('確認要返回主頁嗎？')) {
                localStorage.removeItem('adminMealOnly');   // 清除訂餐專用模式（新增）
                window.location.href = 'index.html';
            }
        });

        // ══════════════════════════════
        //  功能選單：牆上的吊牌（點一下取下牌子，進入頁面）
        // ══════════════════════════════
        (function () {
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let leaving = false;
            function enter(el) {
                if (leaving) return;
                leaving = true;
                const url = el.dataset.url;
                try { sessionStorage.setItem('fadeIn', '1'); } catch (e) {}
                if (reduce) { window.location.href = url; return; }
                el.classList.add('opening');
                const veil = document.createElement('div');
                veil.className = 'page-veil';
                Object.assign(veil.style, { position: 'fixed', inset: '0', zIndex: '1001', background: '#efe6d8', opacity: '0', pointerEvents: 'none' });
                document.body.appendChild(veil);
                veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 280, delay: 360, fill: 'forwards' });
                setTimeout(() => { window.location.href = url; }, 680);
            }
            document.querySelectorAll('.slot').forEach(s => s.addEventListener('click', () => enter(s)));
            // 手機沒有滑鼠移入：手指碰到時也讓牌子晃一下
            document.querySelectorAll('.slot').forEach(s => s.addEventListener('touchstart', () => {
                const w = s.querySelector('.swing');
                w.style.animation = 'none'; void w.offsetWidth; w.style.animation = 'swing 1.2s ease-out';
            }, { passive: true }));
            const ret = document.getElementById('return');
            ret.addEventListener('touchstart', () => {
                ret.style.animation = 'none'; void ret.offsetWidth; ret.style.animation = 'signSwing 1.2s ease-out';
            }, { passive: true });
            if (document.querySelectorAll('.slot').length === 1) document.querySelector('.hook-hint').textContent = '點選吊牌即可進入訂餐系統';

            // 從下一頁按「上一頁」回來時，恢復可點
            window.addEventListener('pageshow', ev => {
                if (!ev.persisted) return;
                leaving = false;
                document.querySelectorAll('.opening').forEach(el => el.classList.remove('opening'));
                document.querySelectorAll('.page-veil').forEach(el => el.remove());
            });
            window.__markDevicesDot = () => {};   // 木牌上已直接貼待確認貼紙
        })();

        // ══════════════════════════════
        //  歸還設備確認（原本的功能不變）
        //  main 頁按「歸還」後，這裡每 5 秒檢查一次，跳出提示框
        //  確認 → Google Sheet「確認」欄寫入「已確認」
        //  略過 → 這次不再跳出，下次進入此頁會再提醒
        // ══════════════════════════════
        const skipped = new Set();
        let checkQueue = [];
        let showingKey = null;

        function groupKey(r) { return r.name + '|' + r.returnTime; }

        async function pollChecks() {
            try {
                const res  = await fetch(SCRIPT_URL + '?action=getPendingChecks', { cache: 'no-store' });
                const json = await res.json();
                if (json.status !== 'ok' || !Array.isArray(json.data)) {
                    let ver = '舊版（沒有 ping 功能）';
                    try {
                        const p = await (await fetch(SCRIPT_URL + '?action=ping', { cache: 'no-store' })).json();
                        if (p.version) ver = p.version;
                    } catch {}
                    setSys('err', `⚠ 這個網址目前的程式版本是「${ver}」，不是 return-check-v11。請在 Apps Script 把這個網址的部署更新為「新版本」。`);
                    setBadge(0);
                    return;
                }
                totalPending = json.data.length;
                setBadge(new Set(json.data.map(groupKey)).size);

                const groups = new Map();
                json.data.forEach(r => {
                    const key = groupKey(r);
                    if (skipped.has(key)) return;
                    if (!groups.has(key)) groups.set(key, { key, name: r.name, returnTime: r.returnTime, items: [], notes: new Set(), rows: [] });
                    const g = groups.get(key);
                    g.items.push(r.reserveDate ? `${r.reserveDate} 預借的 ${r.devices}` : `${r.borrowDate} 借的 ${r.devices}`);
                    g.rows.push({ row: r.row, name: r.name, devices: r.devices });
                    if (r.note) g.notes.add(r.note);
                });
                checkQueue = [...groups.values()];
                const skippedNow = json.data.filter(r => skipped.has(groupKey(r))).length;
                setSys('ok', json.data.length
                    ? `已連線｜待確認 ${json.data.length} 筆` + (skippedNow ? `（其中 ${skippedNow} 筆已略過）` : '')
                    : '已連線｜目前沒有待確認的歸還');
                if (!showingKey) showNextCheck();
            } catch {
                setSys('err', '⚠ 無法連線到 Apps Script，請確認網路或網址是否正確');
            }
        }

        let totalPending = 0;
        function setSys(state, text) {
            document.getElementById('sys-status').className = 'sys-status ' + state;
            document.getElementById('sys-text').textContent = text;
        }
        function setBadge(n) {
            const b = document.getElementById('pend-badge');
            b.textContent = n;
            b.style.display = n ? 'inline-block' : 'none';
            if (window.__markDevicesDot) window.__markDevicesDot(n > 0);   // 設備球不在畫面上時，點點也提醒
        }
        document.getElementById('btn-recheck').addEventListener('click', () => {
            skipped.clear();
            setSys('', '重新檢查中…');
            pollChecks();
        });

        function showNextCheck() {
            const g = checkQueue.shift();
            if (!g) return;
            showingKey = g.key;
            const left = checkQueue.length;
            document.getElementById('check-progress').textContent = left ? `還有 ${left} 筆待確認` : '';
            document.getElementById('check-time').textContent = g.returnTime ? '歸還時間：' + g.returnTime : '';
            const text = document.getElementById('check-text');
            text.innerHTML = '';
            const b = document.createElement('b');
            b.textContent = g.name;
            text.appendChild(b);
            text.appendChild(document.createTextNode(' 已歸還以下設備'));
            const dev = document.getElementById('check-dev');
            dev.innerHTML = '';
            g.items.forEach(t => { const d = document.createElement('div'); d.textContent = t; dev.appendChild(d); });
            const note = document.getElementById('check-note');
            if (g.notes.size) { note.textContent = '備註：' + [...g.notes].join('；'); note.style.display = ''; }
            else note.style.display = 'none';
            document.getElementById('check-msg').textContent = '';
            setCheckBusy(false);

            document.getElementById('btn-check-ok').onclick   = () => confirmCheck(g);
            document.getElementById('btn-check-skip').onclick = () => { skipped.add(g.key); closeCheck(); pollChecks(); };
            document.getElementById('check-overlay').classList.add('show');
        }

        function setCheckBusy(busy) {
            document.getElementById('btn-check-ok').disabled   = busy;
            document.getElementById('btn-check-skip').disabled = busy;
            document.getElementById('btn-check-ok').textContent = busy ? '處理中…' : '確認';
        }

        function closeCheck() {
            document.getElementById('check-overlay').classList.remove('show');
            showingKey = null;
            setTimeout(showNextCheck, 300);
        }

        async function confirmCheck(g) {
            setCheckBusy(true);
            try {
                const res  = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'confirmReturnCheck', rows: g.rows })
                });
                const json = await res.json();
                if (json.status === 'ok') {
                    skipped.add(g.key);
                    closeCheck();
                } else {
                    document.getElementById('check-msg').textContent = '⚠ ' + (json.message || '確認失敗');
                    setCheckBusy(false);
                }
            } catch {
                document.getElementById('check-msg').textContent = '⚠ 連線失敗，請稍後再試';
                setCheckBusy(false);
            }
        }

        if (!MEAL_ONLY_ADMIN) {   // 訂餐專用後台不檢查歸還設備（修改）
            pollChecks();
            setInterval(pollChecks, 5000);
        }
    </script>
</body>
</html>
