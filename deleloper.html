<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #time {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 15px;
            font-weight: 500;
        }
        #welcome {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .button-group button {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .button-group button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        .button-group button:active {
            transform: translateY(-1px);
        }
        #members {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #devices {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        #supplies {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        #meals {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        #return {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            margin-top: 10px;
        }
        /* ── 歸還設備確認提示框（新增） ── */
        .check-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.55); z-index: 900;
            align-items: center; justify-content: center; padding: 20px;
        }
        .check-overlay.show { display: flex; }
        .check-box {
            background: #fff; color: #333; border-radius: 18px;
            padding: 26px 22px 20px; width: 100%; max-width: 380px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 14px;
            text-align: center; animation: slideUp 0.3s ease-out;
        }
        .check-icon { font-size: 2.2rem; }
        .check-text { font-size: 1.05rem; line-height: 1.8; color: #444; }
        .check-text b { color: #5a3ea8; }
        .check-dev {
            background: #f5f0ff; border-radius: 10px; padding: 10px 14px;
            color: #5a3ea8; font-weight: 700; font-size: 1.05rem; line-height: 1.6;
        }
        .check-note {
            background: #fff4e6; border: 1px solid #ffd8a8; border-radius: 10px;
            padding: 8px 12px; font-size: 0.92rem; color: #d9480f; text-align: left;
        }
        .check-ask { font-size: 1rem; font-weight: bold; color: #e8590c; }
        .check-msg { font-size: 0.88rem; color: #e03131; min-height: 1em; }
        .check-btns { display: flex; gap: 10px; }
        .check-btns button {
            flex: 1; padding: 13px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer;
        }
        .btn-check-ok   { background: #06d6a0; }
        .btn-check-ok:hover { background: #04b888; }
        .btn-check-skip { background: #a0a0b0; }
        .btn-check-skip:hover { background: #888898; }
        .check-btns button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── 連線狀態列、待確認徽章（新增） ── */
        #devices { position: relative; }
        .pend-badge {
            display: none; position: absolute; top: -8px; right: -8px;
            min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px;
            background: #e03131; color: #fff; font-size: 0.8rem; line-height: 26px;
            box-shadow: 0 2px 8px rgba(224,49,49,0.45); animation: pop 0.3s ease-out;
        }
        @keyframes pop { from { transform: scale(0.4); } to { transform: scale(1); } }
        .sys-status {
            margin-top: 20px; padding: 10px 12px; border-radius: 10px;
            background: #f4f5fb; border: 1px solid #e3e5f0;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.85rem; color: #555; text-align: left; line-height: 1.5;
        }
        .sys-status.err { background: #fff5f5; border-color: #ffc9c9; color: #c92a2a; font-weight: bold; }
        .sys-dot { width: 9px; height: 9px; border-radius: 50%; background: #adb5bd; flex-shrink: 0; }
        .sys-status.ok  .sys-dot { background: #2f9e44; box-shadow: 0 0 6px rgba(47,158,68,0.5); }
        .sys-status.err .sys-dot { background: #e03131; }
        .sys-text { flex: 1; }
        .btn-recheck {
            flex-shrink: 0; padding: 5px 10px; border-radius: 8px; border: 1px solid #c5cae9;
            background: #fff; color: #5a3ea8; font-size: 0.78rem; font-weight: bold; cursor: pointer;
        }
        .btn-recheck:hover { background: #eef0ff; }
        /* 提示框補充資訊 */
        .check-progress { font-size: 0.8rem; color: #868e96; margin-top: -8px; }
        .check-time { font-size: 0.85rem; color: #868e96; margin-top: -8px; }
        .check-dev div { padding: 4px 0; border-bottom: 1px dashed #d8ccf5; }
        .check-dev div:last-child { border-bottom: none; }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            #welcome {
                font-size: 1.6em;
            }
            .button-group button {
                padding: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="time"></div>
        <div id="welcome">科務大大 你好</div>
        <div class="button-group">
            <button id="members">會員資料</button>
            <button id="devices">設備系統<span class="pend-badge" id="pend-badge"></span></button>
            <button id="supplies">文具系統</button>
            <button id="meals">訂餐系統</button>
            <button id="return">返回</button>
        </div>
        <div class="sys-status" id="sys-status">
            <span class="sys-dot"></span>
            <span class="sys-text" id="sys-text">連線檢查中…</span>
            <button class="btn-recheck" id="btn-recheck" title="重新檢查，包含先前略過的">🔄 重新檢查</button>
        </div>
    </div>

    <!-- 歸還設備確認提示框（新增） -->
    <div class="check-overlay" id="check-overlay">
        <div class="check-box">
            <div class="check-icon">📦</div>
            <div class="check-progress" id="check-progress"></div>
            <div class="check-text" id="check-text"></div>
            <div class="check-time" id="check-time"></div>
            <div class="check-dev" id="check-dev"></div>
            <div class="check-note" id="check-note" style="display:none"></div>
            <div class="check-ask">請確認設備是否完整、有無異常？</div>
            <div class="check-msg" id="check-msg"></div>
            <div class="check-btns">
                <button class="btn-check-ok" id="btn-check-ok">✅ 確認</button>
                <button class="btn-check-skip" id="btn-check-skip">略過</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyACtMKVngQdstQIvWwhxhG5AdvCZElmCdKvW8kQLWguHxLCWESDlVPjm13Ae_lEgDd/exec';

        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleString('zh-TW');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 按鈕點擊事件
        document.getElementById('members').addEventListener('click', function() {
            window.location.href = 'de-name.html';
        });

        document.getElementById('devices').addEventListener('click', function() {
            window.location.href = 'de-device.html';
        });

        document.getElementById('supplies').addEventListener('click', function() {
            window.location.href = 'de-Stationery.html';
        });

        document.getElementById('meals').addEventListener('click', function() {
            window.location.href = 'de-meal.html';
        });

        document.getElementById('return').addEventListener('click', function() {
            if (confirm('確認要返回主頁嗎？')) {
                window.location.href = 'index.html';
            }
        });

        // ══════════════════════════════
        //  歸還設備確認（新增）
        //  main 頁按「歸還」後，這裡每 5 秒檢查一次，跳出提示框
        //  確認 → Google Sheet「確認」欄寫入「已確認」
        //  略過 → 這次不再跳出，下次進入此頁會再提醒
        // ══════════════════════════════
        const skipped = new Set();   // 本次已略過的群組
        let checkQueue = [];         // [{ key, name, dateText, devices:[], rows:[], note }]
        let showingKey = null;

        function groupKey(r) { return r.name + '|' + r.returnTime; }

        async function pollChecks() {
            try {
                const res  = await fetch(SCRIPT_URL + '?action=getPendingChecks', { cache: 'no-store' });
                const json = await res.json();
                if (json.status !== 'ok' || !Array.isArray(json.data)) {
                    // 讀不到待確認資料 → 再用 ping 查出實際版本，顯示在狀態列
                    let ver = '舊版（沒有 ping 功能）';
                    try {
                        const p = await (await fetch(SCRIPT_URL + '?action=ping', { cache: 'no-store' })).json();
                        if (p.version) ver = p.version;
                    } catch {}
                    setSys('err', `⚠ 這個網址目前的程式版本是「${ver}」，不是 return-check-v11。請在 Apps Script 把這個網址的部署更新為「新版本」。`);
                    setBadge(0);
                    return;
                }
                totalPending = json.data.length;
                setBadge(new Set(json.data.map(groupKey)).size);

                // 同一人同一次歸還的多筆合併成一個提示框
                const groups = new Map();
                json.data.forEach(r => {
                    const key = groupKey(r);
                    if (skipped.has(key)) return;
                    if (!groups.has(key)) groups.set(key, { key, name: r.name, returnTime: r.returnTime, items: [], notes: new Set(), rows: [] });
                    const g = groups.get(key);
                    g.items.push(r.reserveDate ? `${r.reserveDate} 預借的 ${r.devices}` : `${r.borrowDate} 借的 ${r.devices}`);
                    g.rows.push({ row: r.row, name: r.name, devices: r.devices });
                    if (r.note) g.notes.add(r.note);
                });
                checkQueue = [...groups.values()];
                const skippedNow = json.data.filter(r => skipped.has(groupKey(r))).length;
                setSys('ok', json.data.length
                    ? `已連線｜待確認 ${json.data.length} 筆` + (skippedNow ? `（其中 ${skippedNow} 筆已略過）` : '')
                    : '已連線｜目前沒有待確認的歸還');
                if (!showingKey) showNextCheck();
            } catch {
                setSys('err', '⚠ 無法連線到 Apps Script，請確認網路或網址是否正確');
            }
        }

        let totalPending = 0;
        function setSys(state, text) {
            document.getElementById('sys-status').className = 'sys-status ' + state;
            document.getElementById('sys-text').textContent = text;
        }
        function setBadge(n) {
            const b = document.getElementById('pend-badge');
            b.textContent = n + ' 待確認';
            b.style.display = n ? 'inline-block' : 'none';
        }
        // 重新檢查：清除本次略過的紀錄，再查一次
        document.getElementById('btn-recheck').addEventListener('click', () => {
            skipped.clear();
            setSys('', '重新檢查中…');
            pollChecks();
        });

        function showNextCheck() {
            const g = checkQueue.shift();
            if (!g) return;
            showingKey = g.key;
            const left = checkQueue.length;
            document.getElementById('check-progress').textContent = left ? `還有 ${left} 筆待確認` : '';
            document.getElementById('check-time').textContent = g.returnTime ? '歸還時間：' + g.returnTime : '';
            const text = document.getElementById('check-text');
            text.innerHTML = '';
            const b = document.createElement('b');
            b.textContent = g.name;
            text.appendChild(b);
            text.appendChild(document.createTextNode(' 已歸還以下設備'));
            const dev = document.getElementById('check-dev');
            dev.innerHTML = '';
            g.items.forEach(t => { const d = document.createElement('div'); d.textContent = t; dev.appendChild(d); });
            const note = document.getElementById('check-note');
            if (g.notes.size) { note.textContent = '備註：' + [...g.notes].join('；'); note.style.display = ''; }
            else note.style.display = 'none';
            document.getElementById('check-msg').textContent = '';
            setCheckBusy(false);

            document.getElementById('btn-check-ok').onclick   = () => confirmCheck(g);
            document.getElementById('btn-check-skip').onclick = () => { skipped.add(g.key); closeCheck(); pollChecks(); };
            document.getElementById('check-overlay').classList.add('show');
        }

        function setCheckBusy(busy) {
            document.getElementById('btn-check-ok').disabled   = busy;
            document.getElementById('btn-check-skip').disabled = busy;
            document.getElementById('btn-check-ok').textContent = busy ? '處理中…' : '✅ 確認';
        }

        function closeCheck() {
            document.getElementById('check-overlay').classList.remove('show');
            showingKey = null;
            setTimeout(showNextCheck, 300);
        }

        async function confirmCheck(g) {
            setCheckBusy(true);
            try {
                const res  = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'confirmReturnCheck', rows: g.rows })
                });
                const json = await res.json();
                if (json.status === 'ok') {
                    skipped.add(g.key);   // 避免在下次同步前又跳出
                    closeCheck();
                } else {
                    document.getElementById('check-msg').textContent = '⚠ ' + (json.message || '確認失敗');
                    setCheckBusy(false);
                }
            } catch {
                document.getElementById('check-msg').textContent = '⚠ 連線失敗，請稍後再試';
                setCheckBusy(false);
            }
        }

        pollChecks();
        setInterval(pollChecks, 5000);
    </script>
</body>
</html>
