<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#efe6d8">
    <title>義大社工科</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ══════════ 主畫面：窗邊葉影＋風鈴＋書桌（與後台 deleloper 同一套光影）══════════ */
        :root {
            --ink: #2f2a24; --ink-2: #5b5348; --muted: #8f8579; --hair: #e3d9ca; --sage: #6f8a68;
            --sx: 14px; --sy: 24px; --ovc: 255,255,255; --ova: 0; --lamp: 0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { min-height: 100%; background: #e6ddd0; overflow-x: hidden; }
        body {
            font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: var(--ink);
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 寫實光影（牆面、窗光、葉影）── */
        #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }
        .grain {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            mix-blend-mode: multiply;
        }
        .ambient-top {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: rgb(var(--ovc)); opacity: calc(var(--ova) * 0.38);
            mix-blend-mode: multiply;
        }
        .lamp {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
            background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,186,110,0.45), rgba(255,186,110,0) 70%);
            mix-blend-mode: soft-light; opacity: var(--lamp);
        }
        html.night { --muted: #6f665b; }
        html.night .tabletop, html.night .under { filter: brightness(0.62) saturate(0.85); }
        html.night .frame-mover { filter: brightness(0.82); }

        /* ══════════ 風鈴：兩條細繩 ══════════ */
        .chimes { position: relative; z-index: 1; width: 100%; max-width: 620px; margin: 0 auto; padding-top: max(14px, env(safe-area-inset-top)); }
        .rope-row { position: relative; }
        .rope-row.r1 { height: 214px; }
        .rope-row.r2 { height: 252px; margin-top: 4px; }
        .rope {   /* 繩子橫跨整個畫面，中間微微下垂 */
            position: absolute; top: 0; left: calc(50% - 50vw); width: 100vw; height: 30px;
            overflow: visible; pointer-events: none;
            filter: drop-shadow(calc(var(--sx) * 0.25) calc(var(--sy) * 0.25 + 1px) 1.5px rgba(60,40,22,0.25));
        }
        .rope path { fill: none; vector-effect: non-scaling-stroke; }
        .rope .r-base { stroke: #6b5440; stroke-width: 1.8px; }
        .rope .r-twist { stroke: rgba(255,236,205,0.45); stroke-width: 0.8px; stroke-dasharray: 2.5 3.5; }

        .chime {
            position: absolute; top: 12px; left: var(--x); width: 96px; margin-left: -48px;
            border: none; background: none; padding: 0; cursor: pointer; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .chime:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 4px; border-radius: 8px; }
        /* 會晃的整串：以繩子上的結為支點 */
        .c-sw {
            display: flex; flex-direction: column; align-items: center;
            transform-origin: 50% 0;
            animation: cIdle 4.8s ease-in-out infinite alternate; animation-delay: var(--d, 0s);
            filter: drop-shadow(calc(var(--sx) * 0.35) calc(var(--sy) * 0.3 + 2px) 5px rgba(60,40,22,0.28));
        }
        .c-knot { width: 7px; height: 7px; margin-top: -3px; border-radius: 50%; background: #6b5440; }
        .c-str { width: 1.4px; height: 16px; background: #6b5440; }
        /* 玻璃風鈴 */
        .c-bell {
            position: relative; z-index: 2; width: 58px; height: 50px;
            border-radius: 50% 50% 14% 14% / 80% 80% 20% 20%;
            background:
                radial-gradient(ellipse at 32% 26%, rgba(255,255,255,0.95) 0 5%, rgba(255,255,255,0.4) 12%, rgba(255,255,255,0) 30%),
                linear-gradient(180deg, transparent 0 60%, rgba(var(--g),0.72) 60% 67%, transparent 67% 72%, rgba(var(--g),0.5) 72% 75%, transparent 75%),
                linear-gradient(180deg, rgba(255,255,255,0.62) 0%, rgba(232,242,246,0.32) 40%, rgba(var(--g),0.20) 78%, rgba(255,255,255,0.45) 100%);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.7),
                inset -7px -5px 10px rgba(var(--g),0.28),
                inset 5px 3px 8px rgba(255,255,255,0.45);
            -webkit-backdrop-filter: blur(1.5px); backdrop-filter: blur(1.5px);
        }
        .c-bell::before {   /* 頂端的小環 */
            content: ''; position: absolute; top: -5px; left: 50%; width: 12px; height: 7px; margin-left: -6px;
            border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #e9eef0, #b9c3c8);
            box-shadow: inset 0 0 0 1px rgba(90,100,110,0.25);
        }
        .c-bell::after {    /* 鈴口 */
            content: ''; position: absolute; left: 3px; right: 3px; bottom: -2px; height: 6px; border-radius: 50%;
            background: radial-gradient(ellipse at 50% 30%, rgba(70,82,92,0.22), rgba(255,255,255,0.7) 75%);
            box-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }
        /* 舌片＋短冊（紙條）：比鈴晃得更明顯 */
        .c-tail {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            margin-top: -24px; transform-origin: 50% 0;
            animation: tIdle 3.6s ease-in-out infinite alternate; animation-delay: calc(var(--d, 0s) - 0.8s);
        }
        .c-bead { width: 7px; height: 14px; border-radius: 3px; background: linear-gradient(90deg, #c8d2d6, #f4f7f8 45%, #aab6bb); box-shadow: 0 1px 1px rgba(0,0,0,0.15); }
        .c-str2 { width: 1.2px; height: 26px; background: #6b5440; }
        .c-strip {
            position: relative; width: 46px; padding: 16px 0 12px;
            writing-mode: vertical-rl; text-orientation: upright;
            font-family: 'Noto Sans TC', sans-serif; font-weight: 900; font-size: 1.42rem; line-height: 46px; letter-spacing: 0.14em;
            color: #1c1915; text-align: center;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9 0.35' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .32  0 0 0 0 .22  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
                linear-gradient(180deg, var(--p1), var(--p2));
            border-top: 6px solid var(--band);
            border-radius: 1px;
            box-shadow: inset -2px 0 0 rgba(60,40,20,0.08), inset 1px 0 0 rgba(255,255,255,0.6);
        }
        .c-strip::before {   /* 綁繩的小孔 */
            content: ''; position: absolute; top: -4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
            border-radius: 50%; background: #5a4634;
        }
        .chime.main .c-strip { width: 54px; line-height: 54px; font-size: 1.7rem; }
        .chime.main .c-bell { width: 64px; height: 55px; }

        @keyframes cIdle  { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
        @keyframes tIdle  { from { transform: rotate(2.4deg); }  to { transform: rotate(-2.4deg); } }
        /* 被碰到：像一陣風吹過 */
        @keyframes cWind  { 0% { transform: rotate(0); } 14% { transform: rotate(9deg); } 32% { transform: rotate(-6deg); } 50% { transform: rotate(4deg); } 68% { transform: rotate(-2.4deg); } 84% { transform: rotate(1deg); } 100% { transform: rotate(0); } }
        @keyframes tWind  { 0% { transform: rotate(0); } 12% { transform: rotate(-7deg); } 28% { transform: rotate(16deg); } 46% { transform: rotate(-11deg); } 62% { transform: rotate(7deg); } 78% { transform: rotate(-3.5deg); } 100% { transform: rotate(0); } }
        @keyframes cBreeze{ 0% { transform: rotate(0); } 25% { transform: rotate(3.5deg); } 55% { transform: rotate(-2deg); } 80% { transform: rotate(1deg); } 100% { transform: rotate(0); } }
        @keyframes tBreeze{ 0% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 45% { transform: rotate(7deg); } 70% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }
        .chime.blow   .c-sw   { animation: cWind 2.2s cubic-bezier(.25,.6,.3,1); }
        .chime.blow   .c-tail { animation: tWind 2.5s cubic-bezier(.25,.6,.3,1) .06s backwards; }
        .chime.breeze .c-sw   { animation: cBreeze 1.9s ease-out; }
        .chime.breeze .c-tail { animation: tBreeze 2.1s ease-out .08s backwards; }

        /* 訂餐專用帳號：只留上方「訂餐」 */
        body.meal-only .rope-row.r2 { display: none; }

        /* ══════════ 書桌 ══════════ */
        .desk { position: relative; z-index: 1; margin-top: auto; width: 100%; overflow: hidden; padding-top: 16px; }
        .items {
            position: relative; z-index: 2;
            display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2.5vw, 30px);
            padding: 0 8px; max-width: 640px; margin-left: auto; margin-right: auto; margin-bottom: -40px;
        }
        .tabletop {
            position: relative; height: 96px;
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='96'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.22' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 .28  0 0 0 0 .17  0 0 0 0 .07  0 0 0 .30 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
                linear-gradient(180deg, #b48b5c 0%, #c79e6d 45%, #cfa676 100%);
            background-size: 400px 100%, auto;
            box-shadow: 0 -8px 18px rgba(50,32,15,0.18);   /* 桌子靠牆處的影子 */
        }
        .tabletop::before {   /* 桌面反光（跟著太陽方向） */
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(calc(90deg + var(--sx) * 2deg / 1px), rgba(255,240,215,0.18), rgba(255,240,215,0) 60%);
        }
        .tabletop::after {    /* 桌緣厚度 */
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 16px;
            background: linear-gradient(180deg, #9a7148 0%, #7d5a37 100%);
            box-shadow: inset 0 1.5px 0 rgba(255,232,200,0.45);
        }
        .under { height: max(28px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, #4a3826, #2f241a); }
        .desk-note {
            position: absolute; z-index: 3; right: 12%; bottom: 24px;
            font-family: 'Noto Serif TC', serif; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.16em;
            color: rgba(70,45,22,0.72); text-shadow: 0 1px 0 rgba(255,235,205,0.35);
            pointer-events: none;
        }

        /* iPad */
        .ipad {
            position: relative; flex: 0 0 auto;
            width: clamp(168px, 45vw, 248px); aspect-ratio: 3 / 4;
            padding: 11px; border-radius: 20px;
            background: linear-gradient(145deg, #45484e, #1b1c1f 60%, #2a2c30);
            box-shadow:
                inset 0 0 0 1.5px #62666c, inset 0 0 0 3px #17181b,
                calc(var(--sx) * 0.5) 8px 16px rgba(30,20,10,0.35);
            margin-bottom: 4px;
        }
        .ipad::before {   /* 桌上的陰影 */
            content: ''; position: absolute; z-index: -1; left: 6%; right: 2%; bottom: -10px; height: 18px;
            border-radius: 50%; background: rgba(35,22,10,0.4); filter: blur(6px);
            transform: translateX(calc(var(--sx) * 0.6));
        }
        .ipad .cam { position: absolute; top: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #2c3a46; }
        .screen {
            position: relative; height: 100%; border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 18px 8px 14px; color: #fff;
            background:
                radial-gradient(ellipse 80% 60% at 70% 20%, rgba(255,226,180,0.55), rgba(255,226,180,0) 70%),
                radial-gradient(ellipse 120% 60% at 20% 100%, rgba(70,98,78,0.85), rgba(70,98,78,0) 70%),
                linear-gradient(165deg, #8ea79a 0%, #b4b59a 40%, #d2ad85 75%, #b98468 100%);
            text-shadow: 0 1px 6px rgba(30,30,30,0.28);
        }
        .screen::after {   /* 玻璃反光 */
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(118deg, rgba(255,255,255,0.16) 0 34%, rgba(255,255,255,0) 34.5%);
        }
        #ipad-date { font-size: clamp(0.95rem, 4.3vw, 1.1rem); font-weight: 700; letter-spacing: 0.06em; opacity: 0.95; }
        #time {
            font-size: clamp(2.9rem, 14.2vw, 4.2rem); font-weight: 500; line-height: 1.05; letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums; margin-top: 2px;
        }
        #name { margin-top: auto; width: 100%; font-size: clamp(1.15rem, 5.4vw, 1.4rem); font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
        #name.loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        #acct { display: none; font-size: 0.84rem; font-weight: 500; opacity: 0.9; margin-top: 2px; letter-spacing: 0.08em; }
        #back {
            margin-top: 14px; height: 44px; padding: 0 26px; border-radius: 999px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.24);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            color: #fff; font-family: inherit; font-size: 1.12rem; font-weight: 700; letter-spacing: 0.2em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.25);
        }
        #back:active { transform: scale(0.96); background: rgba(255,255,255,0.34); }

        /* 相片框 */
        .frame-slot {
            position: relative; flex: 1 1 0; min-width: 0; max-width: 320px;   /* 用掉 iPad 右邊剩下的寬度，但不超出畫面 */
            margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .frame-mover { position: relative; }
        .frame-mover::after {   /* 桌上的陰影 */
            content: ''; position: absolute; z-index: -1; left: 4%; right: -2%; bottom: -8px; height: 14px;
            border-radius: 50%; background: rgba(35,22,10,0.38); filter: blur(5px);
            transform: translateX(calc(var(--sx) * 0.5));
        }
        .frame {
            position: relative; padding: var(--bw);
            transform: perspective(500px) rotateX(5deg); transform-origin: 50% 100%;
            box-shadow: calc(var(--sx) * 0.3) 4px 8px rgba(30,20,10,0.3);
        }
        .frame .mat { padding: var(--mat); background: #f8f5ee; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.25); }
        .frame img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; background: #f8f5ee; }   /* 照片完整顯示，不裁切 */
        .frame.oak   { --bw: 7px; --mat: 4px;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='160'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .15  0 0 0 0 .06  0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"), linear-gradient(145deg, #c49464, #8d6239);
            box-shadow: inset 0 0 0 1px rgba(255,230,195,0.35), calc(var(--sx) * 0.3) 4px 8px rgba(30,20,10,0.3); }
        .frame.white { --bw: 6px; --mat: 5px; background: linear-gradient(145deg, #fdfcf8, #ddd7cb);
            box-shadow: inset 0 0 0 1px rgba(150,140,120,0.35), calc(var(--sx) * 0.3) 4px 8px rgba(30,20,10,0.3); }
        .frame.black { --bw: 4px; --mat: 0px; background: linear-gradient(145deg, #4a4a4a, #111);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), calc(var(--sx) * 0.3) 4px 8px rgba(30,20,10,0.35); }
        .frame.black .mat { box-shadow: none; }
        /* 換相框的手 */
        .hand {
            position: absolute; z-index: 5; top: 50%; left: calc(100% - 30px);
            width: 160px; height: 66px; margin-top: -33px;
            transform: translateX(120vw); pointer-events: none;
            filter: drop-shadow(calc(var(--sx) * 0.3) 5px 6px rgba(30,20,10,0.3));
        }
        .hand svg { display: block; width: 100%; height: 100%; }

        /* ══════════ 提示框（紙卡＋木板按鍵，與其他頁一致）══════════ */
        .qr-overlay, .confirm-overlay, .msg-overlay, .return-overlay, .remind-overlay {
            display: none; position: fixed; inset: 0; padding: 20px;
            align-items: center; justify-content: center;
        }
        .qr-overlay { background: rgba(20,16,12,0.9); z-index: 500; flex-direction: column; gap: 18px; }
        .confirm-overlay { background: rgba(40,30,20,0.45); z-index: 600; }
        .return-overlay  { background: rgba(40,30,20,0.45); z-index: 650; }
        .remind-overlay  { background: rgba(40,30,20,0.5);  z-index: 680; }
        .msg-overlay     { background: rgba(40,30,20,0.45); z-index: 700; }
        .confirm-overlay, .return-overlay, .remind-overlay, .msg-overlay { -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
        .qr-overlay.show, .confirm-overlay.show, .msg-overlay.show, .return-overlay.show, .remind-overlay.show { display: flex; }
        .qr-title { color: #fff8ec; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.1em; font-family: 'Noto Serif TC', serif; }
        #qr-video { width: 300px; height: 300px; max-width: 80vw; max-height: 80vw; object-fit: cover; border-radius: 6px; border: 3px solid #cfab62; }
        .qr-hint { color: #e9cf8e; font-size: 0.95rem; }
        .qr-close-btn {
            padding: 10px 28px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.12); color: #fff; font-size: 1rem; font-family: inherit; cursor: pointer;
        }

        .confirm-dialog, .msg-box, .return-box, .remind-box {
            position: relative; width: 100%; max-width: 380px; color: var(--ink);
            background:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
                linear-gradient(175deg, #fffdf6, #f4ede0);
            border-radius: 4px; box-shadow: 0 0 0 1px rgba(120,100,70,0.12), 8px 14px 34px rgba(30,20,10,0.32);
            padding: 24px 20px 18px;
            display: flex; flex-direction: column; gap: 14px; text-align: center;
        }
        .msg-box { align-items: center; max-width: 340px; }
        .confirm-title, .remind-title { font-family: 'Noto Serif TC', serif; font-size: 1.18rem; font-weight: 700; letter-spacing: 0.06em; color: var(--ink); }
        .remind-title { color: #8a3a26; }
        .msg-icon, .return-icon, .remind-icon { font-size: 2rem; line-height: 1; }
        .msg-text, .return-text { font-size: 1.05rem; font-weight: 500; color: var(--ink); line-height: 1.7; white-space: pre-line; }
        .return-text b, .remind-list b { color: #8a4a30; }
        .device-list, .return-list {
            border-top: 2px solid rgba(90,120,160,0.4); border-bottom: 1px solid rgba(110,150,190,0.35);
            padding: 10px 4px; text-align: left; font-size: 1.05rem; font-weight: 700; color: #2c4a6e; line-height: 1.7;
        }
        .return-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
        .return-item { color: var(--ink); }
        .return-item .r-date { color: var(--muted); font-size: 0.9rem; font-weight: 500; margin-right: 8px; }
        .return-item .r-dev { color: #2c4a6e; }
        .purpose-wrap { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .purpose-label, .return-note-label { font-size: 0.9rem; font-weight: 700; color: #7d8aa0; letter-spacing: 0.1em; text-align: left; }
        .purpose-label .req { color: #a8432c; }
        .purpose-select {
            width: 100%; padding: 8px 26px 8px 2px; border: none; border-bottom: 1.5px solid rgba(60,70,90,0.45); border-radius: 0;

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
        // ══ 光線隨時間變化（新增）══
  //  早上太陽在左邊（東）低低的、偏金黃；中午在正上方、白亮；
  //  下午移到右邊；傍晚右側低角度橘紅；入夜後房間變暗、改成月光＋桌燈。
  //  測試用：網址後面加 ?hour=18.5 可以直接看某個時間的樣子
  (function () {
      //  時間   太陽X  太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影
      //  時間   太陽X 太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影  窗光  窗X(vw) 窗Y(vh) 傾斜  旋轉
      const K = [
          [0,     72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],   // 深夜：月光
          [4.6,   72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18,  -4],
          [5.6,    0, 66,  255,160,130,  .80,   48, 12, 214,160,200,  .45,  .35, .80, .55, 52,  6,  -42,  6],   // 破曉：粉紫
          [7,      2, 42,  255,206,130,  .95,   40, 18, 255,226,190,  .18,  0,   1.5, .75, 46,  4,  -34,  4],   // 早晨：金黃
          [10,    24, 12,  255,226,170,  .85,   22, 30, 255,248,236,  .04,  0,   1.6, .65, 34, 14,  -18,  2],
          [12.5,  50,  0,  255,246,226,  .70,    0, 38, 255,255,255,  0,    0,   1.4, .55, 22, 34,    0,  0],   // 正午：白亮、影子短
          [15,    78, 12,  255,220,150,  .85,  -22, 30, 255,244,226,  .06,  0,   1.6, .65,  8, 14,   18, -2],
          [17,    98, 40,  255,160, 80,  1,    -42, 18, 255,190,140,  .30,  0,   1.7, .80, -4,  4,   34, -4],   // 傍晚：橘
          [18.2, 100, 66,  255,110, 90,  .85,  -50, 12, 170,110,150,  .52,  .40, 1.1, .55, -8,  6,   42, -6],   // 黃昏：紅紫
          [19.4,  72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],   // 入夜
          [24,    72,  8,  170,190,255,  .28,  -10, 22,  52, 64,105,  .80,  .85, .55, .22,  2,  -6,  18, -4],
      ];
      const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
      function apply() {
          const now = new Date();
          const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
          let i = 0; while (i < K.length - 2 && h >= K[i + 1][0]) i++;
          const a = K[i], b = K[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
          const v = a.map((x, j) => x + (b[j] - x) * t);
          const r = document.documentElement.style;
          r.setProperty('--sunx', v[1] + '%');
          r.setProperty('--suny', v[2] + '%');
          r.setProperty('--sunc', `${v[3] | 0},${v[4] | 0},${v[5] | 0}`);
          r.setProperty('--suna', v[6].toFixed(3));
          r.setProperty('--sx', v[7].toFixed(1) + 'px');
          r.setProperty('--sy', v[8].toFixed(1) + 'px');
          r.setProperty('--ovc', `${v[9] | 0},${v[10] | 0},${v[11] | 0}`);
          r.setProperty('--ova', v[12].toFixed(3));
          r.setProperty('--lamp', v[13].toFixed(3));
          r.setProperty('--leafk', v[14].toFixed(3));
          r.setProperty('--win', v[15].toFixed(3));
          r.setProperty('--wx', v[16].toFixed(1) + 'vw');
          r.setProperty('--wy', v[17].toFixed(1) + 'vh');
          r.setProperty('--wsk', v[18].toFixed(1) + 'deg');
          r.setProperty('--wrot', v[19].toFixed(1) + 'deg');
          document.documentElement.classList.toggle('night', v[12] > 0.45);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = v[12] > 0.6 ? '#4b5270' : (v[12] > 0.3 ? '#c9a9a8' : '#efe6d8');
      }
      apply();
      setInterval(apply, 60 * 1000);   // 每分鐘更新一次
  })();

        // ══════════════════════════════════════════
  //  寫實光影（Canvas）
  //  牆面在陰影中是偏冷的灰；陽光穿過窗戶，在牆上投出一塊暖色光斑，
  //  窗框形成十字陰影，窗外的樹葉在光斑裡留下深淺不一的影子並隨風擺動。
  //  早上太陽低、光斑又長又斜、偏右；中午太陽高、光斑小而低；
  //  下午移到左邊；傍晚轉橘紅；夜晚只剩微弱的冷色月光。
  // ══════════════════════════════════════════
  (function () {
      const cv = document.getElementById('scene');
      const ctx = cv.getContext('2d');
      const SCALE = 0.5;                       // 半解析度繪製：陰影本來就柔，也比較省電
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const forced = parseFloat(new URLSearchParams(location.search).get('hour'));
      let W = 0, H = 0;

      // 亂數（固定種子，每次畫出來的樹一樣）
      let seed = 11;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const R = (a, b) => a + rnd() * (b - a);

      // ── 時間表 ──
      //  時:  陰影牆色RGB      光的加亮RGB     光斑 x   y    寬   高   斜    葉影深淺 風力
      const T = [
          [0,    36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],   // 夜：月光
          [4.6,  36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],
          [5.6, 146,136,146,  105, 58, 46,   .50, .00, .56, .50,  .28,  .70, .7],  // 破曉
          [7,   188,180,170,  100, 72, 34,   .44, .00, .52, .60,  .22,  .85, .8],  // 早晨
          [10,  204,197,187,   72, 60, 40,   .33, .10, .44, .62,  .10,  .90, 1 ],
          [12.5,212,206,196,   52, 48, 38,   .22, .44, .50, .50,  .00,  .80, 1 ],  // 正午：光斑低而小
          [15,  204,196,185,   74, 60, 36,   .18, .10, .44, .62, -.10,  .90, 1 ],
          [17,  178,163,148,  108, 64, 22,   .04, .00, .52, .62, -.22,  .90, .9],  // 傍晚
          [18.2,126,106,112,   96, 40, 24,  -.06, .02, .56, .50, -.28,  .75, .7],  // 黃昏
          [19.4, 36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],  // 入夜
          [24,   36, 42, 60,   14, 18, 30,   .56, .06, .38, .52, -.06,  .45, .5],
      ];
      function sample() {
          const now = new Date();
          const h = isNaN(forced) ? now.getHours() + now.getMinutes() / 60 : ((forced % 24) + 24) % 24;
          let i = 0; while (i < T.length - 2 && h >= T[i + 1][0]) i++;
          const a = T[i], b = T[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
          return a.map((x, j) => x + (b[j] - x) * t);
      }

      // ── 畫一根帶葉子的樹枝（黑色剪影）到離屏畫布，再用「縮小再放大」做出柔邊 ──
      function leaf(c, L, Wd) {
          c.beginPath();
          c.moveTo(0, 0);
          c.bezierCurveTo(L * 0.28, -Wd * 1.05, L * 0.72, -Wd * 0.85, L, R(-1, 1));
          c.bezierCurveTo(L * 0.70, Wd * 0.95, L * 0.30, Wd * 0.9, 0, 0);
          c.fill();
          c.lineWidth = 1.1; c.beginPath(); c.moveTo(-L * 0.12, 0); c.lineTo(0, 0); c.stroke();
      }
      function branchSprite(size, blurK, sd) {
          seed = sd;
          const s = document.createElement('canvas'); s.width = s.height = size;
          const c = s.getContext('2d');
          c.fillStyle = '#000'; c.strokeStyle = '#000'; c.lineCap = 'round';
          function grow(x, y, ang, len, thick, depth) {
              const steps = Math.max(6, len / 14 | 0);
              let cx = x, cy = y, a = ang;
              for (let i = 0; i < steps; i++) {
                  a += R(-0.10, 0.10);
                  const nx = cx + Math.cos(a) * len / steps, ny = cy + Math.sin(a) * len / steps;
                  c.lineWidth = Math.max(0.8, thick * (1 - i / steps));
                  c.beginPath(); c.moveTo(cx, cy); c.lineTo(nx, ny); c.stroke();
                  cx = nx; cy = ny;
                  // 葉子：左右交錯、大小不一、角度隨機
                  if (i > 0 && rnd() < 0.85) {
                      const side = i % 2 ? 1 : -1;
                      c.save(); c.translate(cx, cy);
                      c.rotate(a + side * R(0.6, 1.2));
                      const L = R(22, 42) * (depth ? 0.85 : 1), Wd = L * R(0.26, 0.4);
                      c.scale(1, R(0.55, 1));            // 有些葉子斜著，影子變扁
                      leaf(c, L, Wd); c.restore();
                  }
                  // 小枝
                  if (depth < 2 && i > 1 && rnd() < 0.28) {
                      grow(cx, cy, a + (rnd() < 0.5 ? -1 : 1) * R(0.5, 1.0), len * R(0.3, 0.5), thick * 0.55, depth + 1);
                  }
              }
              // 枝端一簇葉
              for (let k = 0; k < 4; k++) {
                  c.save(); c.translate(cx, cy); c.rotate(a + R(-0.9, 0.9));
                  const L = R(20, 36); leaf(c, L, L * R(0.28, 0.38)); c.restore();
              }
          }
          grow(size * 0.98, size * 0.04, R(2.3, 2.6), size * 0.95, 6, 0);
          // 柔邊（模擬半影）：縮小再放大
          const k = Math.max(1, blurK);
          const t1 = document.createElement('canvas');
          t1.width = Math.max(1, size / k | 0); t1.height = t1.width;
          const c1 = t1.getContext('2d'); c1.imageSmoothingQuality = 'high';
          c1.drawImage(s, 0, 0, t1.width, t1.height);
          const out = document.createElement('canvas'); out.width = out.height = size;
          const co = out.getContext('2d'); co.imageSmoothingQuality = 'high';
          co.drawImage(t1, 0, 0, size, size);
          return out;
      }

      // 三種距離的樹枝：遠的模糊、近的清楚
      let sprites = [];
      function buildSprites() {
          const base = Math.round(Math.max(W, H) * 0.9);
          sprites = [
              { img: branchSprite(base,       7, 21), fx: .55, fy: -.18, rot: .25, s: 1.10, a: .55, amp: .020, f: .55, ph: 0   },
              { img: branchSprite(base,       6, 37), fx: .10, fy:  .05, rot: -.1, s: 0.95, a: .55, amp: .018, f: .48, ph: 1.7 },
              { img: branchSprite(base * .8,  3.5, 53), fx: .40, fy: -.05, rot: .05, s: 1.00, a: .78, amp: .030, f: .80, ph: 3.1 },
              { img: branchSprite(base * .8,  3, 71), fx: -.05, fy: .25, rot: -.35, s: 0.90, a: .75, amp: .028, f: .72, ph: 4.4 },
              { img: branchSprite(base * .6,  1.8, 97), fx: .62, fy: .10, rot: .45, s: 0.90, a: .88, amp: .045, f: 1.1, ph: 2.2 },
          ];
      }

      // 光斑位置：手機直式畫面比較窄，光斑放大一些才看得到
      function geo() {
          const portrait = H > W * 1.2;
          const kw = portrait ? 1.9 : 1, kh = portrait ? 1.05 : 1;
          const w = P[9] * W * kw, h = P[10] * H * kh;
          const x = portrait ? (P[7] - 0.22) * W * 1.35 : P[7] * W;
          const y = P[8] * H * (portrait ? 0.8 : 1);
          return [x, y, w, h, P[11] * W * kw];
      }

      // 光斑（含窗框十字），每分鐘依時間重畫一次
      const patch = document.createElement('canvas');
      let P = null;
      function buildPatch() {
          P = sample();
          patch.width = W; patch.height = H;
          const c = patch.getContext('2d');
          c.clearRect(0, 0, W, H);
          const [x, y, w, h, sk] = geo();
          // 先畫在小畫布再放大 → 光斑邊緣自然柔和
          const k = 6, sm = document.createElement('canvas');
          sm.width = Math.ceil(W / k); sm.height = Math.ceil(H / k);
          const s = sm.getContext('2d');
          s.scale(1 / k, 1 / k);
          s.fillStyle = `rgb(${P[4] | 0},${P[5] | 0},${P[6] | 0})`;
          s.beginPath();
          s.moveTo(x, y); s.lineTo(x + w, y); s.lineTo(x + w + sk, y + h); s.lineTo(x + sk, y + h); s.closePath();
          s.fill();
          // 窗框：一直一橫的陰影
          s.globalCompositeOperation = 'destination-out';
          const mw = Math.max(6, w * 0.035);
          s.beginPath();
          s.moveTo(x + w * .5 - mw / 2, y); s.lineTo(x + w * .5 + mw / 2, y);
          s.lineTo(x + w * .5 + mw / 2 + sk, y + h); s.lineTo(x + w * .5 - mw / 2 + sk, y + h); s.closePath(); s.fill();
          const yy = y + h * .46, sx = sk * .46;
          s.fillRect(x + sx - 4, yy - mw / 2, w + 8, mw);
          c.imageSmoothingQuality = 'high';
          c.drawImage(sm, 0, 0, W, H);
      }

      const light = document.createElement('canvas');
      function draw(t) {
          if (!P) return;
          const lc = light.getContext('2d');
          lc.globalCompositeOperation = 'source-over';
          lc.clearRect(0, 0, W, H);
          lc.drawImage(patch, 0, 0);
          // 樹葉擋光：從光斑中「挖掉」葉影
          lc.globalCompositeOperation = 'destination-out';
          const [x, y, w, h, sk] = geo();
          const wind = P[13];
          // 陣風：幾個慢速波疊起來，偶爾大一點
          const gust = Math.max(0, Math.sin(t * 0.21) + Math.sin(t * 0.083 + 1.3) - 0.6) * 0.6;
          sprites.forEach(sp => {
              const sway = (Math.sin(t * sp.f + sp.ph) + 0.45 * Math.sin(t * sp.f * 2.3 + sp.ph * 1.7)) * sp.amp * wind
                         + gust * sp.amp * 1.6 * wind;
              const size = sp.img.width * sp.s;
              lc.save();
              lc.globalAlpha = sp.a * P[12];
              lc.translate(x + w * sp.fx + sk * 0.3, y + h * sp.fy);
              lc.transform(1, 0, P[11] * 0.6, 1, 0, 0);     // 影子跟著光線一起斜
              lc.rotate(sp.rot + sway);
              lc.translate(Math.sin(t * sp.f * 0.7 + sp.ph) * 3 * wind, 0);
              lc.drawImage(sp.img, -size * 0.5, -size * 0.1, size, size);
              lc.restore();
          });
          // 牆面＝陰影色，再「加上」光
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = `rgb(${P[1] | 0},${P[2] | 0},${P[3] | 0})`;
          ctx.fillRect(0, 0, W, H);
          // 室內的反射光：靠下方稍暗（地板方向）
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, 'rgba(255,255,255,0.04)'); g.addColorStop(1, 'rgba(40,25,10,0.10)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = 'lighter';
          ctx.drawImage(light, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
      }

      function resize() {
          W = Math.max(1, Math.round(innerWidth * SCALE));
          H = Math.max(1, Math.round(Math.max(innerHeight, document.documentElement.clientHeight) * 1.15 * SCALE));
          cv.width = W; cv.height = H; light.width = W; light.height = H;
          buildSprites(); buildPatch(); draw(performance.now() / 1000);
      }
      resize();
      // 只有寬度改變（例如手機轉向）才重畫；捲動時網址列伸縮只改高度，不理會（修改）
      let lastW = innerWidth, rt;
      addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(resize, 200); });
      setInterval(() => { buildPatch(); if (reduce) draw(0); }, 60 * 1000);

      if (!reduce) {
          let last = 0;
          (function loop(ts) {
              requestAnimationFrame(loop);
              if (document.hidden || ts - last < 33) return;   // 約每秒 30 張
              last = ts;
              draw(ts / 1000);
          })(0);
      }
  })();

                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action:   'device',
                    userName: currentUserName,
                    devices:  scannedDevices.join('、'),
                    purpose,                       // （新增）
                    timestamp
                })
            });
            const json = await res.json();
            document.getElementById('confirm-overlay').classList.remove('show');
            scannedDevices = [];
            resetPurpose();   // （新增）
            if (json.success) showToast('✅ 登記成功！');
            else showToast('⚠ 登記失敗');
        } catch {
            showToast('⚠ 連線失敗，請稍後再試');
        } finally {
            submitting = false;
            submitBtn.disabled = false;
            submitBtn.textContent = '✅ 送出';
        }
    }

    // ══════════════════════════════
    //  設備未歸還檢查（新增，與 device 頁相同）
    // ══════════════════════════════
    // 回傳 [{ date, name, device }]；查詢失敗時回傳 [] 不擋送出，但會提示
    async function findUnreturned(devices) {
        try {
            const res  = await fetch(`${SCRIPT_URL}?action=getActiveBorrows`, { cache: 'no-store' });
            const json = await res.json();
            if (json.status !== 'ok' || !Array.isArray(json.data)) {
                setTimeout(() => showToast('⚠ 未歸還檢查失敗：請確認 Apps Script 已部署新版本'), 2800);
                return [];
            }
            const picked = devices.map(d => String(d).trim());
            const list = [];
            json.data.forEach(rec => {
                (rec.devices || []).forEach(dev => {
                    dev = String(dev).trim();
                    if (picked.includes(dev)) list.push({ date: rec.date, name: rec.name, device: dev });
                });
            });
            return list;
        } catch {
            setTimeout(() => showToast('⚠ 未歸還檢查連線失敗'), 2800);
            return [];
        }
    }

    // 顯示提醒框，回傳 true = 繼續送出 / false = 取消
    function showRemind(conflicts) {
        return new Promise(resolve => {
            const ul = document.getElementById('remind-list');
            ul.innerHTML = '';
            conflicts.forEach(c => {
                const li = document.createElement('li');
                if (c.name === currentUserName) {
                    // 自己借的：改用「您」的說法
                    li.innerHTML = '您於 <b></b> 借用的 <b></b> 尚未歸還，記得歸還';
                    const b = li.querySelectorAll('b');
                    b[0].textContent = c.date;
                    b[1].textContent = c.device;
                } else {
                    li.innerHTML = '請提醒 <b></b> 於 <b></b> 借用的 <b></b> 記得歸還';
                    const b = li.querySelectorAll('b');
                    b[0].textContent = c.name;
                    b[1].textContent = c.date;
                    b[2].textContent = c.device;
                }
                ul.appendChild(li);
            });
            const overlay = document.getElementById('remind-overlay');
            overlay.classList.add('show');
            const done = (val) => {
                overlay.classList.remove('show');
                document.getElementById('remind-ok').onclick = null;
                document.getElementById('remind-cancel').onclick = null;
                resolve(val);
            };
            document.getElementById('remind-ok').onclick     = () => done(true);
            document.getElementById('remind-cancel').onclick = () => done(false);
        });
    }

    // ── Toast ──
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
            t.style.opacity = '0';
            t.style.transform = 'translateX(-50%) translateY(-20px)';
        }, 2500);
    }

    // iPad 上的名字太長時自動縮小字級，維持一行（新增）
    function fitName() {
        const el = document.getElementById('name');
        el.style.fontSize = '';
        let size = parseFloat(getComputedStyle(el).fontSize);
        while (el.scrollWidth > el.clientWidth + 1 && size > 12) { size -= 0.5; el.style.fontSize = size + 'px'; }
    }
    new MutationObserver(fitName).observe(document.getElementById('name'), { childList: true, characterData: true, subtree: true });
    fitName();
    addEventListener('resize', fitName);

    // ══════════════════════════════
    //  風鈴（新增）：掛在繩子上、碰到會像被風吹過一樣晃動
    // ══════════════════════════════
    function blow(el) {
        el.classList.remove('blow', 'breeze'); void el.offsetWidth; el.classList.add('blow');
        // 同一條繩上的其他風鈴也跟著輕輕晃
        el.parentElement.querySelectorAll('.chime').forEach((o, i) => {
            if (o === el) return;
            setTimeout(() => { o.classList.remove('breeze'); void o.offsetWidth; if (!o.classList.contains('blow')) o.classList.add('breeze'); }, 120 + i * 90);
        });
    }
    document.querySelectorAll('.chime').forEach(c => {
        c.addEventListener('animationend', e => { if (e.target.classList.contains('c-tail')) c.classList.remove('blow', 'breeze'); });
        c.addEventListener('mouseenter', () => blow(c));
        c.addEventListener('touchstart', () => blow(c), { passive: true });
    });
    // 讓每個風鈴的結剛好落在下垂的繩子上
    function placeChimes() {
        document.querySelectorAll('.rope-row').forEach(row => {
            const r = row.querySelector('.rope').getBoundingClientRect();
            row.querySelectorAll('.chime').forEach(c => {
                const b = c.getBoundingClientRect();
                const t = Math.min(1, Math.max(0, (b.left + b.width / 2 - r.left) / r.width));
                c.style.top = (4 + 88 * t * (1 - t) - 1) + 'px';
            });
        });
    }
    placeChimes();
    let _pw = innerWidth;
    addEventListener('resize', () => { if (Math.abs(innerWidth - _pw) < 2) return; _pw = innerWidth; placeChimes(); });

    // ══════════════════════════════
    //  相片框（新增）：點一下，一隻手把相框拿走，換上另一個相框，照片隨機
    // ══════════════════════════════
    (function () {
        // 每張照片：[壓縮版（較快）, 原始檔名（備用）]；壓縮版沒上傳時自動改用原始檔
        const PHOTOS = [
            ['photo1.jpg', 'EA21686D-E859-4DE3-A28F-0E0F62FE076C.jpg'],
            ['photo2.jpg', '6C4A9967-CD74-4885-A2A3-9E864190E0B5.jpg'],
            ['photo3.jpg', '9ECAE22C-EF9E-460A-B2BC-F49EEA83783C.jpg'],
        ];
        const resolved = PHOTOS.map(p => p[0]);   // 實際能載入的網址
        PHOTOS.forEach((p, i) => {   // 先載好，換的時候不會閃
            const im = new Image();
            im.onerror = () => { im.onerror = null; resolved[i] = p[1]; im.src = p[1]; };
            im.src = p[0];
        });
        const STYLES = ['oak', 'white', 'black'];
        const slot  = document.getElementById('frame-slot');
        const mover = document.getElementById('frame-mover');
        const frame = document.getElementById('frame');
        const img   = document.getElementById('frame-img');
        const hand  = document.getElementById('hand');
        const pickOther = (arr, cur) => { const o = arr.filter(x => x !== cur); return o[Math.floor(Math.random() * o.length)]; };
        const IDX = [0, 1, 2];
        let curPhoto = Math.floor(Math.random() * PHOTOS.length);
        let curStyle = 'oak';
        function showPhoto(i) {
            img.onerror = () => { img.onerror = null; resolved[i] = PHOTOS[i][1]; img.src = PHOTOS[i][1]; };
            img.src = resolved[i];
        }
        showPhoto(curPhoto);

        const wait = ms => new Promise(r => setTimeout(r, ms));
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let busy = false;
        async function swap() {
            if (busy) return;
            busy = true;
            const nextPhoto = pickOther(IDX, curPhoto);
            const nextStyle = pickOther(STYLES, curStyle);
            if (reduce) { apply(nextPhoto, nextStyle); busy = false; return; }
            const off = Math.max(200, innerWidth - slot.getBoundingClientRect().left + 40);
            const IN = 'cubic-bezier(.2,.7,.3,1)', OUT = 'cubic-bezier(.5,0,.75,0)';
            const go = (el, from, to, dur, easing) => el.animate([{ transform: from }, { transform: to }], { duration: dur, easing, fill: 'forwards' }).finished;
            // 1. 手伸進來，抓住相框
            await go(hand, `translateX(${off}px)`, 'translateX(0)', 520, IN);
            await wait(140);
            // 2. 連同相框一起拿走
            await Promise.all([
                go(hand,  'translateX(0)', `translateX(${off}px)`, 460, OUT),
                go(mover, 'translateX(0) rotate(0)', `translateX(${off}px) rotate(5deg)`, 460, OUT)
            ]);
            // 3. 換一個相框、換一張照片
            apply(nextPhoto, nextStyle);
            await wait(180);
            // 4. 放上新的相框
            await Promise.all([
                go(hand,  `translateX(${off}px)`, 'translateX(0)', 560, IN),
                go(mover, `translateX(${off}px) rotate(-4deg)`, 'translateX(0) rotate(0)', 560, IN)
            ]);
            mover.animate([{ transform: 'translateY(-3px)' }, { transform: 'translateY(0)' }], { duration: 160, easing: 'ease-in' });
            await wait(150);
            // 5. 手縮回去
            await go(hand, 'translateX(0)', `translateX(${off}px)`, 440, OUT);
            busy = false;
        }
        function apply(p, s) {
            curPhoto = p; curStyle = s;
            showPhoto(p);
            frame.className = 'frame ' + s;
        }
        slot.addEventListener('click', swap);
        slot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); swap(); } });
    })();

</script>
