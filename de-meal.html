<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="theme-color" content="#efe6d8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>義大社工科｜訂餐後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* ══════════ 訂餐後台：窗邊葉影＋點單繩＋點菜本（與後台、會員、設備、文具頁同一套）══════════ */
    :root {
      --ink: #2f2a24; --ink-2: #5b5348; --muted: #8f8579; --hair: #e3d9ca;
      --sage: #6f8a68; --terra: #b0603f;
      --engrave: #4a2d14;
      --sx: 14px; --sy: 24px; --ovc: 255,255,255; --ova: 0; --lamp: 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: #e6ddd0; }
    body {
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: var(--ink);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 14px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 寫實光影（牆面、窗光、葉影）── */
    #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }   /* 用最大視窗高度，手機網址列伸縮時不跳動（修改） */
    .grain {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: multiply;
    }
    .ambient-top {   /* 卡片：只稍微變暗，保持好讀 */
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: rgb(var(--ovc)); opacity: calc(var(--ova) * 0.38);
        mix-blend-mode: multiply;
    }
    /* 夜晚：背板稍微不透明一點，小字加深，維持好讀 */
    html.night .container { background-color: rgba(250,246,238,0.32); }
    html.night { --muted: #6f665b; }

    /* 寫實光影畫布＋牆面顆粒 */
    #scene { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: 0; pointer-events: none; }   /* 用最大視窗高度，手機網址列伸縮時不跳動（修改） */
    .grain {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: multiply;
    }
    /* 夜間桌燈：卡片附近一圈暖光，晚上也看得清楚 */
    .lamp {
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,186,110,0.45), rgba(255,186,110,0) 70%);
        mix-blend-mode: soft-light; opacity: var(--lamp);
    }
    html.night .panel { background-color: rgba(250,246,238,0.32); }
    html.night { --muted: #6f665b; }

    /* ── 半透明紙卡 ── */
    .panel {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      border-radius: 6px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .26  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        linear-gradient(170deg, rgba(253,251,247,0.40) 0%, rgba(251,248,242,0.34) 45%, rgba(244,238,228,0.30) 100%);
      -webkit-backdrop-filter: blur(2.5px) saturate(1.1);
      backdrop-filter: blur(2.5px) saturate(1.1);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 0 0 1px rgba(120,100,70,0.08),
        2px 3px 4px rgba(70,50,30,0.10),
        calc(var(--sx) * 0.9) calc(var(--sy) * 1) 30px rgba(70,50,30,0.22),
        calc(var(--sx) * 2.2) calc(var(--sy) * 2.4) 70px rgba(70,50,30,0.20);
      animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* 頁首 */
    header { padding: 22px 22px 14px; text-align: center; position: relative; }
    .site-title {
      font-family: 'Noto Serif TC', serif; font-size: 1.55rem; font-weight: 700;
      letter-spacing: 0.14em; padding-left: 0.14em; color: var(--ink);
    }
    .site-sub {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 0.72rem; letter-spacing: 0.3em; color: var(--muted); margin-top: 6px;
    }
    .site-sub::before, .site-sub::after { content: ''; width: 30px; height: 1px; background: var(--hair); }
    #clock {
      font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums; margin-bottom: 10px;
    }
    /* 返回：小原木牌 */
    .btn-return {
      position: absolute; top: 16px; left: 16px;
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 14px 0 12px;
      border: none; border-radius: 4px; cursor: pointer;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='60'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.015 0.45' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
        linear-gradient(175deg, #e2c49c 0%, #cfa978 60%, #b98f5d 100%);
      background-size: 200px 34px, auto;
      box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), inset -2px -2px 0 rgba(80,50,20,0.18), 3px 5px 7px rgba(70,50,30,0.25);
      color: var(--engrave); font-family: 'Noto Serif TC', serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.18em;
      text-shadow: 0 1px 0 rgba(255,240,215,0.55), 0 -1px 0 rgba(70,40,15,0.2);
    }
    .btn-return:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,245,225,0.6), 1px 2px 3px rgba(70,50,30,0.25); }

    /* 狀態列：一行小字 */
    #status-bar {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
      font-size: 0.74rem; color: var(--muted);
      padding: 0 18px 4px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #c9bfb1; flex-shrink: 0; }
    .dot.ok   { background: var(--sage); }
    .dot.err  { background: #a8432c; }
    .dot.busy { background: #c39b4c; animation: breathe 1.2s infinite; }
    @keyframes breathe { 50% { opacity: .35; } }
    #status-text { color: var(--ink-2); }
    #last-sync { color: var(--muted); }
    #count-badge {
      padding: 1px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.55); border: 1px solid #d3c7b6;
      color: var(--ink-2); font-weight: 700;
    }
    #pending-badge {
      padding: 2px 10px; border-radius: 999px; border: none; cursor: pointer;
      background: #b04a32; color: #fff8ef; font-family: inherit; font-size: 0.74rem; font-weight: 700;
      box-shadow: 1px 2px 4px rgba(60,30,15,0.3); transform: rotate(-3deg);
    }
    #pending-diag { display: none; margin: 6px 18px 0; padding: 8px 12px; border-left: 3px solid #a8432c;
      background: rgba(247,236,228,0.85); color: #7a3a26; font-size: 0.8rem; border-radius: 2px; }

    /* ══════════ 訂餐後台：曬衣繩點單＋菜單夾板＋點菜本＋收據＋黑板 ══════════ */
    .page { display: none; flex-direction: column; gap: 16px; padding: 4px 16px 6px; }
    .page.active { display: flex; animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sec-title { font-family: 'Noto Serif TC', serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.16em; }
    .sec-note  { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
    .divider { border-top: 1px solid var(--hair); margin: 4px 0 0; }

    /* 小木板按鍵 */
    .wbtn, .btn {
      flex: 0 0 auto; height: 40px; padding: 0 18px; border: none; border-radius: 4px; cursor: pointer;
      font-family: 'Noto Serif TC', serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.14em;
      color: #fff8ec; text-shadow: 0 -1px 0 rgba(40,25,10,0.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset -2px -3px 0 rgba(40,25,10,0.18), 3px 5px 8px rgba(70,50,30,0.22);
      background-size: 240px 100%, auto;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .wbtn:active, .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 1px 2px 4px rgba(70,50,30,0.22); }
    .wbtn:disabled, .btn:disabled { opacity: .55; cursor: not-allowed; }
    .sage, .btn-submit { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='2'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #88a77a, #617f55); }
    .terra { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #c78464, #a35d3f); }
    .ochre { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='6'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #cfab62, #a8833a); }
    .slate { background: linear-gradient(175deg, #4d6e8f, #34506d); }
    .oak, .btn-skip, .btn-back { color: #4a2d14; text-shadow: 0 1px 0 rgba(255,240,215,0.55);
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.5' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .19  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"), linear-gradient(175deg, #e2c49c, #c9a171); }
    .btn-row { display: none; justify-content: center; gap: 12px; padding: 6px 16px 20px; }

    /* ══ 頁面一：菜單夾板（午餐／飲料） ══ */
    #input-date-badge {   /* 日期章 */
      align-self: center; display: inline-block; padding: 4px 14px;
      border: 2px solid rgba(47,93,154,0.75); border-radius: 4px; color: #2f5d9a;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.08em;
      transform: rotate(-2deg); background: rgba(255,255,255,0.5);
    }
    .clipboard {
      position: relative; border-radius: 8px; padding: 26px 12px 12px;
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.02 0.35' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
        linear-gradient(175deg, #c9a273, #a87f52);
      box-shadow: inset 0 1px 0 rgba(255,240,215,0.45), inset 0 0 0 1px rgba(90,60,30,0.3), 6px 10px 18px rgba(70,50,30,0.25);
    }
    .clipboard .clip {   /* 金屬夾子 */
      position: absolute; top: -8px; left: 50%; width: 110px; height: 28px; margin-left: -55px; z-index: 2;
      border-radius: 6px 6px 4px 4px;
      background: linear-gradient(180deg, #e9ecef, #b5bcc3 55%, #8e969e);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 3px 4px rgba(40,30,20,0.35);
    }
    .clipboard .clip::after { content: ''; position: absolute; left: 50%; top: 6px; width: 30px; height: 8px; margin-left: -15px; border-radius: 4px; background: #7d858d; box-shadow: inset 0 1px 2px rgba(0,0,0,0.4); }
    .clipboard .sheet {
      background:
        repeating-linear-gradient(180deg, transparent 0 31px, rgba(90,130,180,0.25) 31px 32px) 0 52px / 100% calc(100% - 52px) no-repeat,
        linear-gradient(175deg, #fffdf6, #f6efdf);
      border-radius: 2px; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 1px 3px rgba(60,40,20,0.2);
    }
    .sheet-title { font-family: 'Noto Serif TC', serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.2em; display: flex; align-items: center; gap: 8px; }
    .sheet-title .dot-l { width: 10px; height: 10px; border-radius: 50%; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > label, .lbl { font-size: 0.74rem; letter-spacing: 0.14em; color: #7d8aa0; font-weight: 700; }
    .field input[type="text"] {
      width: 100%; padding: 6px 2px; border: none; border-bottom: 1.5px solid rgba(60,70,90,0.45); background: transparent; outline: none;
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', sans-serif; font-size: 1.2rem; font-weight: 700; color: #1e2733;
    }
    .field input[type="text"]:focus { border-bottom-color: var(--sage); }
    .menu-upload-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .menu-count { font-size: 0.72rem; color: var(--muted); }
    .menu-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 12px 10px; }
    .menu-thumbs:empty { display: none; }
    .menu-thumb {   /* 拍立得照片＋紙膠帶 */
      position: relative; background: #fff; padding: 5px 5px 16px; border-radius: 2px;
      box-shadow: 2px 3px 6px rgba(60,40,20,0.25); transform: rotate(var(--r, -2deg));
    }
    .menu-thumb:nth-child(2n) { --r: 2deg; } .menu-thumb:nth-child(3n) { --r: -1deg; }
    .menu-thumb::before { content: ''; position: absolute; top: -7px; left: 50%; width: 40px; height: 14px; margin-left: -20px; background: rgba(244,211,94,0.7); transform: rotate(-4deg); }
    .menu-thumb img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; cursor: zoom-in; background: #eee; }
    .menu-thumb .rm { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(40,30,20,0.7); color: #fff; font-size: 0.72rem; cursor: pointer; padding: 0; }
    .menu-thumb .new-badge { position: absolute; left: 6px; bottom: 1px; font-size: 0.6rem; font-weight: 700; color: #a8432c; font-family: 'LXGW WenKai TC', sans-serif; }
    .btn-upload {
      display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; cursor: pointer;
      border: 1.5px dashed rgba(60,70,90,0.4); border-radius: 4px; background: rgba(255,255,255,0.5);
      font-size: 0.86rem; font-weight: 700; color: #4d5a6e;
    }
    .btn-upload:active { transform: translateY(1px); }
    .input-tip { font-size: 0.74rem; color: var(--muted); text-align: center; }

    /* ══ 頁面二：曬衣繩上的點單（已建立的日期） ══ */
    .line-wrap { position: relative; padding-top: 6px; }
    .dates-body { display: flex; flex-direction: column; gap: 18px; }
    .ticket-row { position: relative; padding-top: 14px; }
    .ticket-row::before {   /* 麻繩 */
      content: ''; position: absolute; left: -16px; right: -16px; top: 9px; height: 3px; border-radius: 2px;
      background: repeating-linear-gradient(110deg, #b8925f 0 4px, #8f6b40 4px 7px);
      box-shadow: 0 2px 3px rgba(60,40,20,0.2);
    }
    .ticket {
      position: relative; width: 100%; text-align: left; border: none; cursor: pointer; font-family: inherit; color: #24303f;
      padding: 18px 14px 12px; border-radius: 2px;
      background: linear-gradient(175deg, #fffef9, #f7f1e3);
      box-shadow: 0 0 0 1px rgba(120,100,70,0.10), 2px 3px 4px rgba(70,50,30,0.08), 6px 10px 16px rgba(70,50,30,0.14);
      transform: rotate(var(--tilt, 0deg)); transform-origin: 50% 0;
      animation: tIn .45s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: var(--in, 0s);
    }
    @keyframes tIn { from { opacity: 0; transform: translateY(-8px) rotate(var(--tilt, 0deg)); } to { opacity: 1; } }
    .no-intro .ticket { animation: none; }
    .ticket::after {   /* 紙張下緣鋸齒 */
      content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 7px;
      background: linear-gradient(-45deg, transparent 4px, #f7f1e3 0) 0 0 / 8px 7px repeat-x, linear-gradient(45deg, transparent 4px, #f7f1e3 0) 0 0 / 8px 7px repeat-x;
    }
    .ticket .pin {   /* 木頭曬衣夾 */
      position: absolute; top: -22px; left: 26px; width: 14px; height: 34px; border-radius: 3px; z-index: 2;
      background: linear-gradient(90deg, #c49a68, #e3c08f 45%, #b48756); box-shadow: 1px 2px 3px rgba(60,40,20,0.3);
    }
    .ticket .pin::after { content: ''; position: absolute; left: -2px; right: -2px; top: 14px; height: 4px; border-radius: 2px; background: #9aa1a8; }
    .ticket .t-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-right: 4px; }
    .ticket .t-date { font-family: 'Noto Serif TC', serif; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em; }
    .ticket .t-wk { font-size: 0.76rem; color: #6c7686; font-weight: 700; }
    .ticket .t-row { display: grid; grid-template-columns: 34px 1fr; align-items: baseline; column-gap: 6px; margin-top: 6px; }
    .ticket .t-row > i { font-style: normal; font-size: 0.66rem; letter-spacing: 0.12em; color: #8a93a3; }
    .ticket .t-shop { font-family: 'LXGW WenKai TC', sans-serif; font-size: 1.02rem; font-weight: 700; overflow-wrap: anywhere; }
    .ticket .t-shop.lunch { color: #8a4a30; } .ticket .t-shop.drink { color: #2c5a7a; }
    .ticket .t-none { color: #b0b6bf; }
    .ticket .t-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .ticket .t-btn {
      height: 30px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
      border: 1px solid #d3c7b6; background: rgba(255,255,255,0.7); color: var(--ink-2);
    }
    .ticket .t-btn.close { border-color: rgba(111,138,104,0.6); color: #4f6b48; }
    .ticket .t-btn.reopen { border-color: rgba(168,67,44,0.5); color: #a8432c; }
    .ticket .t-btn.del { border-color: rgba(168,67,44,0.35); color: #a8432c; }
    .ticket .closed-stamp {   /* 已結單：紅色印章 */
      position: absolute; top: 12px; right: 12px; padding: 2px 8px;
      border: 2.5px solid #c0392b; border-radius: 4px; color: #c0392b;
      font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.16em;
      transform: rotate(10deg); opacity: .82; mix-blend-mode: multiply;
    }
    .ticket.is-closed { background: linear-gradient(175deg, #f8f4ec, #eee6d6); }

  <script>

        sessionStorage.removeItem('fadeIn');
        document.documentElement.classList.add('fade-in');
        addEventListener('animationend', function done(e) {
          if (e.animationName !== 'pageFloatIn') return;
          document.documentElement.classList.remove('fade-in');
          removeEventListener('animationend', done);
        });

<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ambient-top" aria-hidden="true"></div>
<div class="lamp" aria-hidden="true"></div>

<div class="panel">
  <header>

  <!-- 頁面一：菜單夾板（輸入店家） -->

      <span class="clip" aria-hidden="true"></span>
      <div class="sheet">
        <div class="sheet-title"><span class="dot-l" style="background:#c78464"></span>午餐</div>
        <div class="field"><label>店家名稱</label>
          <input type="text" id="lunch-shop" placeholder="請寫上午餐店家" autocomplete="off"/></div>
        <div class="field menu-upload">
          <div class="menu-upload-top"><span class="lbl">菜單照片（選填，可多張）</span><span class="menu-count" id="lunch-menu-count"></span></div>

        </div>
      </div>
    </div>

    <div class="clipboard">
      <span class="clip" aria-hidden="true"></span>
      <div class="sheet">
        <div class="sheet-title"><span class="dot-l" style="background:#7892ad"></span>飲料</div>

  <!-- 頁面二：點單繩＋點菜本 -->
  <div class="page" id="page-dates">

<script>
        // ══ 光線隨時間變化（新增）══

  (function () {
      //  時間   太陽X  太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影
      //  時間   太陽X 太陽Y  光色R,G,B      強度  影子X 影子Y  天色R,G,B     天色濃度 桌燈 葉影  窗光  窗X(vw) 窗Y(vh) 傾斜  旋轉
      const K = [

  async function confirmDate() {
    const val = document.getElementById('date-picker').value;

    currentDate = val;

  async function loadMenuForDate(date) {
    menuState = { lunch: [], drink: [], ready: false };
    renderMenuThumbs('lunch'); renderMenuThumbs('drink');
    ['lunch','drink'].forEach(t => document.getElementById(t+'-menu-count').textContent = '讀取照片中…');

  function renderMenuThumbs(type) {
    const box  = document.getElementById(type+'-menu-thumbs');

      d.className = 'menu-thumb';
      const img = document.createElement('img');
      img.alt = (type==='lunch'?'午餐':'飲料') + '菜單第 ' + (i+1) + ' 張';

      rm.addEventListener('click', () => { list.splice(i, 1); renderMenuThumbs(type); });

    for (const f of files.slice(0, room)) {

      try {
        menuState[type].push({ preview: await compressImage(f), mime: 'image/jpeg' });

  // 縮小照片再上傳：最長邊 2000px、JPG，菜單上的小字仍看得清楚
  function compressImage(file, maxSide = 2000, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width  = Math.round(img.naturalWidth  * scale);
        c.height = Math.round(img.naturalHeight * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

    if (!lunch && !drink) { alert('請至少填入午餐或飲料的店家名稱'); return; }

    if (!drink && menuState.drink.length) { alert('已上傳飲料菜單照片，請填寫飲料店家名稱'); return; }
    const btn = document.querySelector('#btn-row-input .btn-submit');
    if (btn.disabled) return;
    const newOf = t => menuState[t].filter(x => !x.ref).map(x => ({ data: x.preview, mime: x.mime }));
    const payload = { action:'saveMealMenu', date:currentDate, lunch, drink,
                      lunchMenuNew: newOf('lunch'), drinkMenuNew: newOf('drink') };
    if (menuState.ready) {   // 有讀到原本的照片，才告訴 GAS 要保留哪些（被 ✕ 的會移除）
      payload.lunchMenuKeep = menuState.lunch.filter(x => x.ref).map(x => x.ref);
      payload.drinkMenuKeep = menuState.drink.filter(x => x.ref).map(x => x.ref);
    }
    const hasNew = payload.lunchMenuNew.length + payload.drinkMenuNew.length > 0;
    btn.disabled=true; btn.textContent = hasNew ? '上傳照片中…' : '送出中…';
    try {
      const res = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify(payload)});
      const json = await res.json();
      if (json.status==='ok') {
        if (hasNew && !Array.isArray(json.lunchMenu))
          alert('⚠ 店家已儲存，但照片沒有存到。\nGAS 還是舊版本，請到「管理部署作業」建立新版本後再上傳一次。');
        if (Array.isArray(json.lunchMenu))
          menuCache[currentDate] = { date: currentDate, lunch, drink, lunchMenu: json.lunchMenu, drinkMenu: json.drinkMenu };
        menuState = { lunch: [], drink: [], ready: false };
        mealData[currentDate]={lunch,drink};
        localStorage.setItem('de_meal_data',JSON.stringify(mealData));
        showPage('page-dates');
        document.getElementById('btn-row-input').style.display='none';
        renderDateButtons();
        showToast(json.isUpdate?'✅ 已更新到 Google Sheets':'✅ 已新增到 Google Sheets');
        loadDateSelect();
      } else { alert('⚠ 送出失敗：'+(json.message||'未知錯誤')); }
    } catch { alert('⚠ 連線失敗，請確認網路後重試'); }
    finally { btn.disabled=false; btn.textContent='送出 →'; }
  }

  /* ── 結單 / 取消結單 ── */
  async function toggleCloseDate(dateKey, isClosed) {
    const d=new Date(dateKey+'T00:00:00');
    const label=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const action = isClosed ? 'openMealDate' : 'closeMealDate';
    const confirmMsg = isClosed
      ? `確定要取消「${label}」的結單嗎？`
      : `確定要結單「${label}」嗎？\n結單後使用者將無法再點餐。`;
    if (!confirm(confirmMsg)) return;
    try {
      const res  = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action, date:dateKey})});
      const json = await res.json();
      if (json.status==='ok') {
        if (isClosed) closedDates.delete(dateKey);
        else closedDates.add(dateKey);
        showToast(isClosed ? '🔓 已取消結單 '+label : '🔒 已結單 '+label);
        renderDateButtons();
      } else { alert('⚠ 操作失敗：'+(json.message||'未知錯誤')); }
    } catch { alert('⚠ 連線失敗，請稍後再試'); }
  }

  async function deleteDate(dateKey) {
    const d=new Date(dateKey+'T00:00:00');
    const label=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!confirm(`確定要刪除「${label}」的餐點資料嗎？`)) return;
    try {
      const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'deleteMealMenu',date:dateKey})});
      const json=await res.json();
      if (json.status!=='ok') { alert('⚠ Google Sheets 刪除失敗：'+(json.message||'未知錯誤')); return; }
    } catch { alert('⚠ 連線失敗，無法同步刪除 Google Sheets'); return; }
    delete mealData[dateKey];
    localStorage.setItem('de_meal_data',JSON.stringify(mealData));
    renderDateButtons();
    showToast('🗑 已刪除 '+label);
    loadDateSelect();
    // 若目前查詢選單選的就是被刪的日期，清空結果

    if (sel.value===dateKey) { sel.value=''; document.getElementById('order-view-result').innerHTML=''; }
  }

  /* ── 餐點整理 ── */
  async function showArrangement() {
    const btn  = document.getElementById('btn-summary');
    const rows = btn._rows || [];
    const date = btn._date || '';
    const result = document.getElementById('arrange-result');
    if (!rows.length) return;

    // 排序函式：數字→大寫英文→小寫英文→注音→其他
    function sortKey(str) {
      const s = String(str || '').trim();
      if (!s) return '\uffff';
      const c = s.charCodeAt(0);
      if (c >= 48 && c <= 57)   return '0' + s;  // 數字
      if (c >= 65 && c <= 90)   return '1' + s;  // 大寫英文
      if (c >= 97 && c <= 122)  return '2' + s;  // 小寫英文
      if (c >= 0x3105 && c <= 0x312E) return '3' + s; // 注音
      return '4' + s; // 其他（中文等）
    }

    // ── 午餐整理 ──
    const lunchRows = rows.filter(r => r.lunchItem).map(r => ({ item: r.lunchItem, name: r.name }));
    lunchRows.sort((a, b) => sortKey(a.item).localeCompare(sortKey(b.item), 'zh-TW'));

    // ── 飲料整理 ──
    const drinkRows = rows.filter(r => r.drinkItem).map(r => ({ item: r.drinkItem, sugar: r.sugar, ice: r.ice, name: r.name }));
    drinkRows.sort((a, b) => sortKey(a.item).localeCompare(sortKey(b.item), 'zh-TW'));

    // 黑板上顯示用：多帶價錢（新增）；寫入 Google Sheet 的資料維持原樣
    const lunchView = rows.filter(r => r.lunchItem).map(r => ({ item: r.lunchItem, name: r.name, price: r.lunchPrice }));
    lunchView.sort((a, b) => sortKey(a.item).localeCompare(sortKey(b.item), 'zh-TW'));
    const drinkView = rows.filter(r => r.drinkItem).map(r => ({ item: r.drinkItem, sugar: r.sugar, ice: r.ice, name: r.name, price: r.drinkPrice }));
    drinkView.sort((a, b) => sortKey(a.item).localeCompare(sortKey(b.item), 'zh-TW'));
    // 名字前面加上價錢，中間空一格（新增）
    const whoWithPrice = r => {
      const p = String(r.price ?? '').trim();
      return (p ? `<span class="pr">$${esc(p)}</span> ` : '') + esc(r.name);
    };

    // 餐點整理寫在黑板上（修改）
    result.innerHTML = `
      <div class="chalkboard">
        <div class="cb-title lunch">午餐整理</div>
        ${lunchView.length ? lunchView.map(r=>`<div class="cb-line"><span>${esc(r.item)}</span><span class="who">${whoWithPrice(r)}</span></div>`).join('') : '<div class="cb-empty">無午餐資料</div>'}
        <div id="lunch-arrange-msg" class="save-msg"></div>
      </div>
      <div class="chalkboard">
        <div class="cb-title drink">飲料整理</div>
        ${drinkView.length ? drinkView.map(r=>`<div class="cb-line"><span>${esc(r.item)}<span class="opt">${esc([r.sugar, r.ice].filter(Boolean).join('／'))}</span></span><span class="who">${whoWithPrice(r)}</span></div>`).join('') : '<div class="cb-empty">無飲料資料</div>'}
        <div id="drink-arrange-msg" class="save-msg"></div>
      </div>`;

    // 同步寫入 GAS
    try {
      const [lunchRes, drinkRes] = await Promise.all([
        fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ action:'saveLunchSummary', date, rows: lunchRows }) }),
        fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ action:'saveDrinkSummary', date, rows: drinkRows }) })
      ]);
      const lunchJson = await lunchRes.json();
      const drinkJson = await drinkRes.json();

      const lMsg = document.getElementById('lunch-arrange-msg');
      const dMsg = document.getElementById('drink-arrange-msg');
      lMsg.style.color = lunchJson.status==='ok' ? '#cfe6c2' : '#ffb3a3';
      lMsg.textContent = lunchJson.status==='ok' ? '已同步儲存至「午餐整理」' : '⚠ 儲存失敗：'+(lunchJson.message||'');
      dMsg.style.color = drinkJson.status==='ok' ? '#cfe6c2' : '#ffb3a3';
      dMsg.textContent = drinkJson.status==='ok' ? '已同步儲存至「飲料整理」' : '⚠ 儲存失敗：'+(drinkJson.message||'');
    } catch {
      const lMsg = document.getElementById('lunch-arrange-msg');
      if (lMsg) { lMsg.style.color='#e05555'; lMsg.textContent='⚠ 連線失敗'; }
    }
  }

  let _editData = null; // 目前編輯的資料

  function openEditModal(row, rowIndex, date) {
    _editData = { row, rowIndex, date };
    document.getElementById('edit-info').textContent = `${date}　${row.name}`;
    document.getElementById('edit-lunch-item').value  = row.lunchItem  || '';
    document.getElementById('edit-lunch-price').value = row.lunchPrice || '';
    document.getElementById('edit-drink-item').value  = row.drinkItem  || '';
    document.getElementById('edit-sugar').value       = row.sugar      || '';
    document.getElementById('edit-ice').value         = row.ice        || '';
    document.getElementById('edit-drink-price').value = row.drinkPrice || '';
    document.getElementById('edit-notes').value       = row.notes      || '';
    document.getElementById('edit-msg').textContent   = '';
    document.getElementById('edit-overlay').classList.add('show');
  }

  function closeEditModal() {
    document.getElementById('edit-overlay').classList.remove('show');
    _editData = null;
  }

  async function saveEditOrder() {
    if (!_editData) return;
    const { row, rowIndex, date } = _editData;
    const lunchItem  = document.getElementById('edit-lunch-item').value.trim();
    const lunchPrice = document.getElementById('edit-lunch-price').value.trim();
    const drinkItem  = document.getElementById('edit-drink-item').value.trim();
    const sugar      = document.getElementById('edit-sugar').value;
    const ice        = document.getElementById('edit-ice').value;
    const drinkPrice = document.getElementById('edit-drink-price').value.trim();
    const notes      = document.getElementById('edit-notes').value.trim();
    const msg        = document.getElementById('edit-msg');

    msg.style.color = '#a07858';
    msg.textContent = '儲存中…';

    try {
      const res  = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'updateMealOrder',
          date, name: row.name, rowIndex,
          lunchItem, lunchPrice, drinkItem, sugar, ice, drinkPrice, notes
        })
      });
      const json = await res.json();
      if (json.status === 'ok') {
        msg.style.color = '#04a87e';
        msg.textContent = '✅ 已更新';
        setTimeout(async () => {
          closeEditModal();
          await loadOrdersByDate(date);
          await refreshSummarySheets(date);
        }, 800);
      } else {
        msg.style.color = '#e05555';
        msg.textContent = '⚠ 失敗：' + (json.message || '未知錯誤');
      }
    } catch {
      msg.style.color = '#e05555';
      msg.textContent = '⚠ 連線失敗';
    }
  }

  async function deleteEditOrder() {
    if (!_editData) return;
    const { row, rowIndex, date } = _editData;
    if (!confirm(`確定要刪除「${row.name}」的這筆資料嗎？`)) return;

    const msg = document.getElementById('edit-msg');
    msg.style.color = '#a07858';
    msg.textContent = '刪除中…';

    try {
      // 1. 刪除午餐前台資料
      const res  = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'deleteMealOrder', date, name: row.name, rowIndex })
      });
      const json = await res.json();
      if (json.status !== 'ok') {
        msg.style.color = '#e05555';
        msg.textContent = '⚠ 刪除失敗：' + (json.message || '未知錯誤');
        return;
      }

      msg.style.color = '#04a87e';
      msg.textContent = '✅ 已刪除';

      setTimeout(async () => {
        closeEditModal();
        // 重新載入訂單
        await loadOrdersByDate(date);
        // 同步更新午餐整理、飲料整理、午餐總價
        const btn = document.getElementById('btn-summary');
        if (btn._rows) await refreshSummarySheets(date);
      }, 800);

    } catch {
      msg.style.color = '#e05555';
      msg.textContent = '⚠ 連線失敗';
    }
  }

  /* ── 刪除後重新計算並同步寫入三個工作表 ── */
  async function refreshSummarySheets(date) {
    try {
      const res  = await fetch(`${GAS_URL}?action=getMealOrders&date=${encodeURIComponent(date)}`,{cache:'no-store'});
      const json = await res.json();
      if (json.status !== 'ok') return;
      const rows = json.data;

      // 重新計算
      const names = [...new Set(rows.map(r => r.name).filter(Boolean))];
      const personData = names.map(name => {
        const pr = rows.filter(r => r.name === name);
        return {
          name,
          lunchTotal: pr.reduce((s,r) => s + (parseInt(r.lunchPrice)||0), 0),
          drinkTotal: pr.reduce((s,r) => s + (parseInt(r.drinkPrice)||0), 0)
        };
      });
      const dateLunchTotal = rows.reduce((s,r) => s + (parseInt(r.lunchPrice)||0), 0);
      const dateDrinkTotal = rows.reduce((s,r) => s + (parseInt(r.drinkPrice)||0), 0);
      const dateTotal = dateLunchTotal + dateDrinkTotal;

      function sortKey(str) {
        const s = String(str||'').trim(); if(!s) return '\uffff';
        const c = s.charCodeAt(0);
        if(c>=48&&c<=57) return '0'+s; if(c>=65&&c<=90) return '1'+s;
        if(c>=97&&c<=122) return '2'+s; if(c>=0x3105&&c<=0x312E) return '3'+s;
        return '4'+s;
      }
      const lunchRows = rows.filter(r=>r.lunchItem).map(r=>({item:r.lunchItem,name:r.name}));
      lunchRows.sort((a,b)=>sortKey(a.item).localeCompare(sortKey(b.item),'zh-TW'));
      const drinkRows = rows.filter(r=>r.drinkItem).map(r=>({item:r.drinkItem,sugar:r.sugar,ice:r.ice,name:r.name}));
      drinkRows.sort((a,b)=>sortKey(a.item).localeCompare(sortKey(b.item),'zh-TW'));

      // 同步寫入
      await Promise.all([
        fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({action:'saveMealSummary',date,personRows:personData,dateLunchTotal,dateDrinkTotal,dateTotal})}),
        fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({action:'saveLunchSummary',date,rows:lunchRows})}),
        fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({action:'saveDrinkSummary',date,rows:drinkRows})})
      ]);
    } catch {}
  }

  // 點擊 overlay 背景關閉
  document.getElementById('edit-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  /* ── 菜單照片：網址與放大檢視（新增）── */
  function isMenuRef(x) { return !/^(https?:|data:)/.test(x); }   // 雲端硬碟檔案 ID
  function menuImgSrc(x, w) {
    return isMenuRef(x) ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(x)}&sz=w${w || 600}` : x;
  }
  function menuImgFallback(img, x, w) {   // 縮圖網址失敗時換另一個網址
    if (img.dataset.fb || !isMenuRef(x)) return;
    img.dataset.fb = '1';
    img.src = `https://lh3.googleusercontent.com/d/${encodeURIComponent(x)}=w${w || 1600}`;
  }
  let mvList = [], mvIdx = 0;
  function ensureMenuViewer() {
    let v = document.getElementById('menu-viewer');
    if (v) return v;
    v = document.createElement('div');
    v.id = 'menu-viewer'; v.className = 'menu-viewer';
    v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', '菜單照片');
    v.innerHTML = `<img id="mv-img" alt="菜單照片"/>
      <div class="mv-bar">
        <button class="mv-btn" id="mv-prev" aria-label="上一張">‹</button>
        <span id="mv-count"></span>
        <button class="mv-btn" id="mv-next" aria-label="下一張">›</button>
        <a class="mv-btn" id="mv-open" target="_blank" rel="noopener">原圖</a>
        <button class="mv-btn" id="mv-close">✕ 關閉</button>
      </div>`;
    document.body.appendChild(v);
    v.addEventListener('click', e => { if (e.target === v) closeMenuViewer(); });
    v.querySelector('#mv-prev').onclick = () => { mvIdx = (mvIdx - 1 + mvList.length) % mvList.length; showMenuViewer(); };
    v.querySelector('#mv-next').onclick = () => { mvIdx = (mvIdx + 1) % mvList.length; showMenuViewer(); };
    v.querySelector('#mv-close').onclick = closeMenuViewer;
    document.addEventListener('keydown', e => {
      if (!v.classList.contains('show')) return;
      if (e.key === 'Escape') closeMenuViewer();
      if (e.key === 'ArrowLeft'  && mvList.length > 1) v.querySelector('#mv-prev').click();
      if (e.key === 'ArrowRight' && mvList.length > 1) v.querySelector('#mv-next').click();
    });
    return v;
  }
  function openMenuViewer(list, idx) {
    if (!list || !list.length) return;
    mvList = list; mvIdx = idx || 0;
    ensureMenuViewer().classList.add('show');
    showMenuViewer();
  }
  function showMenuViewer() {
    const x = mvList[mvIdx];
    const img = document.getElementById('mv-img');
    img.dataset.fb = '';
    img.onerror = () => menuImgFallback(img, x, 2000);
    img.src = menuImgSrc(x, 2000);
    const many = mvList.length > 1;
    document.getElementById('mv-prev').style.display = many ? '' : 'none';
    document.getElementById('mv-next').style.display = many ? '' : 'none';
    document.getElementById('mv-count').textContent = many ? `${mvIdx + 1} / ${mvList.length}` : '';
    const open = document.getElementById('mv-open');
    if (x.startsWith('data:')) open.style.display = 'none';
    else { open.style.display = ''; open.href = isMenuRef(x) ? `https://drive.google.com/file/d/${x}/view` : x; }
  }
  function closeMenuViewer() {
    const v = document.getElementById('menu-viewer');
    if (v) v.classList.remove('show');
  }

  function esc(s){return(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
