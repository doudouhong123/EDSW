<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="theme-color" content="#11151a"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>義大社工科｜訂餐後台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#fff8f0;--white:#ffffff;--warm1:#ff8c42;--warm2:#e8641a;--warm3:#c44d0a;
      --green:#06d6a0;--green2:#04a87e;--sky:#4fc3f7;--sky2:#0288d1;
      --ink:#2d1b0e;--ink2:#5a3825;--muted:#a07858;
      --border:#f0d8c0;--shadow:rgba(200,80,10,0.10);--danger:#e05555;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans TC',sans-serif;font-size:20px;background:var(--bg);
      background-image:radial-gradient(circle at 10% 20%,rgba(255,140,66,0.12) 0%,transparent 50%),
        radial-gradient(circle at 90% 80%,rgba(6,214,160,0.08) 0%,transparent 45%);
      min-height:100vh;display:flex;flex-direction:column;align-items:center;
      padding:24px 14px 56px;color:var(--ink);}
    .deco{position:fixed;pointer-events:none;opacity:0.08;z-index:0;animation:floatY 8s ease-in-out infinite;}
    .deco:nth-child(1){top:5%;left:3%;font-size:2rem;animation-delay:0s;}
    .deco:nth-child(2){top:18%;right:4%;font-size:1.3rem;animation-delay:2s;}
    .deco:nth-child(3){top:60%;left:2%;font-size:1.1rem;animation-delay:4s;}
    .deco:nth-child(4){top:78%;right:3%;font-size:1.6rem;animation-delay:1.5s;}
    @keyframes floatY{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-14px) rotate(6deg);}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
    @keyframes popIn{from{opacity:0;transform:scale(0.88) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes rowIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

    header{width:100%;max-width:500px;background:var(--white);border:1.5px solid var(--border);
      border-radius:20px;padding:14px 20px;margin-bottom:16px;
      box-shadow:0 4px 20px var(--shadow);z-index:1;animation:slideDown 0.5s ease both;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .site-title{display:flex;align-items:center;gap:9px;font-family:'Zen Maru Gothic',sans-serif;font-size:1rem;font-weight:700;color:var(--warm2);}
    .title-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--warm1),var(--warm3));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 2px 8px rgba(200,80,10,0.3);flex-shrink:0;}
    .btn-return{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:30px;font-size:0.82rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:1.5px solid var(--border);background:#fff8f4;color:var(--muted);transition:all 0.2s;}
    .btn-return:hover{background:#ffe8d8;border-color:var(--warm1);color:var(--warm3);transform:translateX(-2px);}
    #clock{font-size:0.8rem;color:var(--muted);font-family:'Zen Maru Gothic',sans-serif;}

    .page{display:none;width:100%;max-width:500px;flex-direction:column;gap:16px;z-index:1;}
    .page.active{display:flex;animation:fadeIn 0.35s ease;}

    .card{background:var(--white);border:1.5px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px var(--shadow);}
    .card-header{padding:13px 18px;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--border);font-family:'Zen Maru Gothic',sans-serif;font-size:0.95rem;font-weight:700;}
    .card-header.lunch{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:var(--warm2);}
    .card-header.drink{background:linear-gradient(135deg,#e0f7fa,#b2ebf2);color:var(--sky2);}
    .card-body{padding:18px;display:flex;flex-direction:column;gap:12px;}

    .field{display:flex;flex-direction:column;gap:6px;}
    .field label{font-size:0.82rem;font-weight:600;color:var(--ink2);}
    .field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:0.95rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:#fff8f4;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
    .field input:focus{border-color:var(--warm1);box-shadow:0 0 0 3px rgba(255,140,66,0.15);background:var(--white);}

    .btn-row{width:100%;max-width:500px;display:flex;gap:12px;z-index:1;}
    .btn{flex:1;padding:14px;border-radius:14px;border:none;font-size:1rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:active{transform:scale(0.97);}
    .btn-submit{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;box-shadow:0 4px 14px rgba(200,80,10,0.28);}
    .btn-submit:hover{box-shadow:0 6px 20px rgba(200,80,10,0.38);transform:translateY(-2px);}
    .btn-skip{background:#fff3e8;color:var(--muted);border:1.5px solid var(--border);}
    .btn-skip:hover{background:#ffe0c8;color:var(--warm3);border-color:var(--warm1);}
    .btn-back{background:#fff3e8;color:var(--muted);border:1.5px solid var(--border);}
    .btn-back:hover{background:#ffe0c8;color:var(--warm3);border-color:var(--warm1);}

    .overlay{position:fixed;inset:0;background:rgba(45,27,14,0.5);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;}
    .dialog{background:var(--white);border:1.5px solid var(--border);border-radius:24px;padding:28px 24px 24px;width:90%;max-width:360px;box-shadow:0 20px 60px rgba(45,27,14,0.2);animation:popIn 0.35s cubic-bezier(0.34,1.5,0.64,1) both;display:flex;flex-direction:column;gap:16px;}
    .dialog-icon{font-size:2rem;text-align:center;}
    .dialog h2{font-family:'Zen Maru Gothic',sans-serif;font-size:1.1rem;font-weight:700;color:var(--ink);text-align:center;}
    .dialog p{font-size:0.82rem;color:var(--muted);text-align:center;margin-top:-8px;}
    .dialog-field{display:flex;flex-direction:column;gap:6px;}
    .dialog-field label{font-size:0.8rem;font-weight:600;color:var(--ink2);}
    .dialog-field input[type="date"]{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:1rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:#fff8f4;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
    .dialog-field input[type="date"]:focus{border-color:var(--warm1);box-shadow:0 0 0 3px rgba(255,140,66,0.15);}
    .dialog-btn-row{display:flex;gap:10px;}
    .dialog-btn-row .btn{padding:13px;}

    .dates-card{background:var(--white);border:1.5px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px var(--shadow);}
    .dates-header{background:linear-gradient(135deg,#f3e5f5,#e1bee7);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--border);}
    .dates-header-title{font-family:'Zen Maru Gothic',sans-serif;font-size:0.9rem;font-weight:700;color:#7b1fa2;display:flex;align-items:center;gap:6px;}
    .dates-body{padding:16px;display:flex;flex-direction:column;gap:10px;}
    .date-btn{width:100%;padding:16px 18px;border-radius:14px;border:1.5px solid #e0d0f0;background:linear-gradient(135deg,#f9f0ff,#f3e5f5);font-family:'Zen Maru Gothic',sans-serif;font-size:1rem;font-weight:700;color:#7b1fa2;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:space-between;animation:rowIn 0.3s ease both;box-shadow:0 2px 8px rgba(123,31,162,0.10);}
    .date-btn:hover{background:linear-gradient(135deg,#e8d5ff,#dbb8f5);transform:translateY(-2px);box-shadow:0 4px 14px rgba(123,31,162,0.18);}
    .date-btn:active{transform:scale(0.97);}
    .date-btn-left{display:flex;align-items:center;gap:10px;}
    .date-btn-icon{font-size:1.3rem;}
    .date-btn-tags{display:flex;gap:6px;}
    .tag{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:20px;}
    .tag-lunch{background:#fff3e0;color:var(--warm2);border:1px solid #ffd8b0;}
    .tag-drink{background:#e0f7fa;color:var(--sky2);border:1px solid #b2e8f5;}
    .btn-delete-date{padding:5px 12px;border-radius:8px;font-size:0.75rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:1.5px solid #f5c5c5;background:#fff0f0;color:#e05555;transition:all 0.2s;flex-shrink:0;}
    .btn-delete-date:hover{background:#e05555;color:#fff;border-color:#e05555;}
    .btn-close-date{padding:5px 12px;border-radius:8px;font-size:0.75rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:1.5px solid #b8d8c8;background:#e8f5ec;color:#04a87e;transition:all 0.2s;flex-shrink:0;}
    .btn-close-date:hover{background:#04a87e;color:#fff;border-color:#04a87e;}
    .btn-close-date.closed{background:#fde8e4;color:#e05555;border-color:#f5c5bb;}
    .btn-close-date.closed:hover{background:#e05555;color:#fff;border-color:#e05555;}
    .dates-empty-icon{font-size:2.2rem;display:block;margin-bottom:10px;}
    .dates-empty p{font-size:0.88rem;}
    .btn-add-date{width:100%;padding:13px;border-radius:14px;border:2px dashed var(--border);background:transparent;color:var(--muted);font-size:0.9rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-add-date:hover{border-color:var(--warm1);color:var(--warm2);background:#fff8f3;}

    /* ── 餐點整理 ── */
    .arrange-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-top:14px;box-shadow:0 2px 12px var(--shadow);}
    .arrange-card-header{padding:10px 16px;font-family:'Zen Maru Gothic',sans-serif;font-size:0.85rem;font-weight:700;border-bottom:1.5px solid var(--border);}
    .arrange-card-header.lunch-h{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:var(--warm2);}
    .arrange-card-header.drink-h{background:linear-gradient(135deg,#e0f7fa,#b2ebf2);color:var(--sky2);}
    .arrange-table{width:100%;border-collapse:collapse;font-size:0.78rem;}
    .arrange-table th{padding:7px 8px;text-align:left;border-bottom:1.5px solid var(--border);white-space:nowrap;font-weight:700;}
    .arrange-table th.lunch-th{background:linear-gradient(135deg,#fff8f0,#fff3e0);color:var(--warm2);}
    .arrange-table th.drink-th{background:linear-gradient(135deg,#f0fbff,#e0f7fa);color:var(--sky2);}
    .arrange-table td{padding:7px 8px;border-bottom:1px solid #f5f0ea;color:var(--ink);vertical-align:middle;}
    .arrange-table tr:last-child td{border-bottom:none;}
    .arrange-table tr:hover td{background:#fffaf5;}
    .arrange-save-msg{font-size:0.78rem;padding:6px 12px;}

    /* ── 編輯彈窗 ── */
    .edit-overlay{position:fixed;inset:0;background:rgba(45,27,14,0.55);backdrop-filter:blur(6px);z-index:400;display:none;align-items:center;justify-content:center;}
    .edit-overlay.show{display:flex;}
    .edit-dialog{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:22px 20px 18px;width:92%;max-width:400px;box-shadow:0 20px 60px rgba(45,27,14,0.2);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto;}
    .edit-dialog-title{font-family:'Zen Maru Gothic',sans-serif;font-size:1rem;font-weight:700;color:var(--warm2);}
    .edit-field{display:flex;flex-direction:column;gap:4px;}
    .edit-field label{font-size:0.78rem;font-weight:600;color:var(--ink2);}
    .edit-field input,.edit-field select,.edit-field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:0.92rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:#fff8f4;outline:none;transition:border-color 0.2s;}
    .edit-field input:focus,.edit-field select:focus,.edit-field textarea:focus{border-color:var(--warm1);background:var(--white);}
    .edit-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .edit-select-wrap{position:relative;}
    .edit-select-wrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:0.85rem;}
    .edit-select-wrap select{appearance:none;-webkit-appearance:none;}
    .edit-btn-row{display:flex;gap:10px;margin-top:4px;}
    .edit-btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:0.92rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all 0.2s;}
    .edit-btn-save{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;box-shadow:0 3px 10px rgba(200,80,10,0.25);}
    .edit-btn-save:hover{transform:translateY(-1px);}
    .edit-btn-cancel{background:#f5f0ea;color:var(--muted);border:1.5px solid var(--border);}
    .edit-btn-cancel:hover{background:#ffe8d8;color:var(--warm3);}
    .edit-btn-delete{background:#fff0f0;color:#e05555;border:1.5px solid #f5c5c5;flex:0.8;}
    .edit-btn-delete:hover{background:#e05555;color:#fff;border-color:#e05555;}
    .edit-msg{font-size:0.78rem;text-align:center;min-height:18px;}
    .row-clickable{cursor:pointer;}
    .row-clickable:hover td{background:#fff3e8!important;}
    .order-view-card{background:var(--white);border:1.5px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px var(--shadow);}
    .order-view-header{background:linear-gradient(135deg,#e8f4f8,#d8ecf4);padding:13px 18px;font-family:'Zen Maru Gothic',sans-serif;font-size:0.9rem;font-weight:700;color:#0288d1;border-bottom:1.5px solid #c0d8e4;}
    .order-view-body{padding:16px 18px;}
    .select-label{font-size:0.8rem;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px;}
    .select-wrap{position:relative;}
    .select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:0.9rem;}
    .date-select-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:0.95rem;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:#fff8f4;outline:none;appearance:none;-webkit-appearance:none;transition:border-color 0.2s,box-shadow 0.2s;}
    .date-select-input:focus{border-color:var(--warm1);box-shadow:0 0 0 3px rgba(255,140,66,0.15);}
    .order-table-wrap{overflow-x:auto;margin-top:12px;}
    .order-table{width:100%;border-collapse:collapse;font-size:0.78rem;}
    .order-table th{background:linear-gradient(135deg,#f0f8ff,#e4f0f8);color:#0288d1;font-weight:700;font-family:'Zen Maru Gothic',sans-serif;padding:8px;text-align:left;border-bottom:1.5px solid #c0d8e4;white-space:nowrap;}
    .order-table td{padding:8px;border-bottom:1px solid #f0f4f8;color:var(--ink);vertical-align:middle;}
    .order-table tr:last-child td{border-bottom:none;}
    .order-table tr:hover td{background:#f5faff;}
    .order-empty{text-align:center;padding:28px;color:var(--muted);font-size:0.88rem;}
    /* 訂單清單：餐點、甜度冰塊、價錢同一行（新增） */
    .order-table td.one-line{white-space:nowrap;}
    .order-table td.notes-cell{min-width:160px;white-space:normal;word-break:break-word;line-height:1.5;}   /* 備註欄加寬（新增） */
    .ol-item{font-weight:600;}
    .ol-opt{color:var(--sky2);font-size:0.72rem;margin-left:6px;}
    .ol-price{color:var(--warm2);font-weight:700;font-family:'Zen Maru Gothic',sans-serif;margin-left:6px;}
    .ol-none{color:#c9b8a8;}
    .order-count-badge{display:inline-block;background:#e8f4f8;color:#0288d1;font-size:0.72rem;font-weight:700;border-radius:20px;padding:2px 10px;margin-left:6px;border:1px solid #c0d8e4;}
    /* ── 總計表格 ── */
    .summary-wrap{margin-top:14px;}
    .summary-title{font-family:'Zen Maru Gothic',sans-serif;font-size:0.85rem;font-weight:700;color:#7b1fa2;margin-bottom:8px;}
    .summary-table{width:100%;border-collapse:collapse;font-size:0.78rem;}
    .summary-table th{background:linear-gradient(135deg,#f3e5f5,#e1bee7);color:#7b1fa2;font-weight:700;font-family:'Zen Maru Gothic',sans-serif;padding:8px;text-align:left;border-bottom:1.5px solid #d7b8e8;white-space:nowrap;}
    .summary-table td{padding:8px;border-bottom:1px solid #f3e5f5;color:var(--ink);vertical-align:middle;}
    .summary-table tr:last-child td{border-bottom:none;}
    .summary-table tr:hover td{background:#faf5ff;}
    .summary-total-row td{background:linear-gradient(135deg,#f3e5f5,#ede0f8);font-weight:700;color:#7b1fa2;border-top:2px solid #c8a0e0;}
    .price-cell{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;color:var(--warm2);}
    .price-total{color:#7b1fa2;}

    /* ── 菜單照片上傳（新增）── */
    .menu-upload{display:flex;flex-direction:column;gap:8px;}
    .menu-upload-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .menu-count{font-size:0.72rem;color:var(--muted);font-weight:600;}
    .menu-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
    .menu-thumbs:empty{display:none;}
    .menu-thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);background:#fff8f4;}
    .menu-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
    .menu-thumb .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(45,27,14,0.7);color:#fff;font-size:0.8rem;line-height:26px;padding:0;cursor:pointer;}
    .menu-thumb .rm:hover{background:var(--danger);}
    .menu-thumb .new-badge{position:absolute;left:4px;bottom:4px;font-size:0.62rem;font-weight:700;background:var(--warm1);color:#fff;border-radius:6px;padding:1px 6px;}
    .field label.btn-upload{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:12px;border:2px dashed var(--border);background:#fffaf6;color:var(--warm2);font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .field label.btn-upload.drink-up{color:var(--sky2);border-color:#b2e8f5;background:#f5fcff;}
    .field label.btn-upload:hover{border-color:var(--warm1);background:#fff3e8;}
    .field label.btn-upload.drink-up:hover{border-color:var(--sky);background:#e0f7fa;}
    .menu-loading{font-size:0.75rem;color:var(--muted);}

    /* ── 菜單照片放大檢視（新增）── */
    .menu-viewer{position:fixed;inset:0;background:rgba(20,12,6,0.9);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;}
    .menu-viewer.show{display:flex;}
    .menu-viewer img{max-width:100%;max-height:calc(100dvh - 110px);object-fit:contain;border-radius:8px;background:#fff;}
    .mv-bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;color:#fff;font-size:0.85rem;}
    .mv-btn{min-width:44px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.12);color:#fff;font-size:0.85rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;text-decoration:none;text-align:center;}
    .mv-btn:hover{background:rgba(255,255,255,0.25);}
  </style>
  <!-- ══════════ 工業科技風（與後台 deleloper 同步，修改）══════════ -->
  <style>
    :root{--st0:#0d1014;--st1:#161b21;--st2:#212831;--ln:#3a4552;--tx:#e7edf3;--mu:#98a6b4;
      --hz:#ffc400;--cy:#00d2ff;--or:#ff6a13;--gr:#3cff6a;--rd:#ff4d4d;}
    html{min-height:100%;background-color:var(--st0);
      background-image:radial-gradient(circle at 15% 10%,rgba(0,210,255,.16),transparent 42%),
        radial-gradient(circle at 85% 90%,rgba(255,106,19,.16),transparent 45%),
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        repeating-linear-gradient(45deg,#12161b 0 6px,#0f1317 6px 12px);
      background-size:auto,auto,28px 28px,28px 28px,auto;background-attachment:fixed;color-scheme:dark;}
    body{background:transparent!important;background-image:none!important;color:var(--tx)!important;

  <!-- ── 從後台立體球進入時，頁面以「浮現」方式出現（新增）── -->
  <style>
    html.fade-in { background: #0d1014; }
    html.fade-in body { animation: pageFloatIn 0.8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pageFloatIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); filter: blur(8px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @media (prefers-reduced-motion: reduce) { html.fade-in body { animation: none; } }
  </style>
  <script>
    try {
      if (sessionStorage.getItem('fadeIn')) {
        sessionStorage.removeItem('fadeIn');
        document.documentElement.classList.add('fade-in');
        addEventListener('animationend', function done(e) {
          if (e.animationName !== 'pageFloatIn') return;
          document.documentElement.classList.remove('fade-in');
          removeEventListener('animationend', done);
        });
      }
    } catch (e) {}

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyACtMKVngQdstQIvWwhxhG5AdvCZElmCdKvW8kQLWguHxLCWESDlVPjm13Ae_lEgDd/exec';
  let mealData = JSON.parse(localStorage.getItem('de_meal_data') || '{}');
  let currentDate = '';

  // ── 菜單照片（新增）──
  const MENU_MAX = 6;                                  // 每種菜單最多 6 張
  let menuCache = {};                                  // 日期 → GAS 上的菜單資料
  let menuState = { lunch: [], drink: [], ready: false };
  // lunch / drink 每一張：舊照片 {ref}；新照片 {preview, mime}
  // ready = 已成功讀到這個日期原本的照片（沒讀到時不送「保留清單」，避免誤刪舊照片）

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleDateString('zh-TW') + '　' + now.toLocaleTimeString('zh-TW',{hour12:false});
  }
  setInterval(updateClock,1000); updateClock();

  window.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date-picker').value = today;
    document.getElementById('date-overlay').style.display = 'flex';
    loadDateSelect();
  });

  async function confirmDate() {
    const val = document.getElementById('date-picker').value;
    if (!val) { alert('請選擇日期'); return; }
    currentDate = val;
    const d = new Date(val+'T00:00:00');
    const label = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    document.getElementById('input-date-badge').textContent = '📅 '+label;
    if (mealData[currentDate]) {
      document.getElementById('lunch-shop').value = mealData[currentDate].lunch||'';
      document.getElementById('drink-shop').value = mealData[currentDate].drink||'';
    } else {
      document.getElementById('lunch-shop').value='';
      document.getElementById('drink-shop').value='';
    }
    document.getElementById('date-overlay').style.display='none';
    showPage('page-input');
    document.getElementById('btn-row-input').style.display='flex';
    document.getElementById('btn-row-dates').style.display='none';
    await loadMenuForDate(currentDate);   // （新增）帶出這個日期已上傳的菜單照片
  }

  /* ── 菜單照片（新增）── */
  async function loadMenuForDate(date) {
    menuState = { lunch: [], drink: [], ready: false };
    renderMenuThumbs('lunch'); renderMenuThumbs('drink');
    ['lunch','drink'].forEach(t => document.getElementById(t+'-menu-count').textContent = '讀取照片中…');
    const ok = menuCache[date] ? true : await loadDateSelect();
    if (date !== currentDate) return;   // 讀取途中又換了日期
    const m = menuCache[date];
    if (m) {
      menuState.lunch = (m.lunchMenu || []).map(ref => ({ ref }));
      menuState.drink = (m.drinkMenu || []).map(ref => ({ ref }));
      // 這台裝置沒有本機紀錄時，用 Google Sheet 的店家名稱
      const lunchEl = document.getElementById('lunch-shop'), drinkEl = document.getElementById('drink-shop');
      if (!lunchEl.value && !drinkEl.value) { lunchEl.value = m.lunch || ''; drinkEl.value = m.drink || ''; }
    }
    menuState.ready = ok;
    renderMenuThumbs('lunch'); renderMenuThumbs('drink');
  }

  function renderMenuThumbs(type) {
    const box  = document.getElementById(type+'-menu-thumbs');
    const list = menuState[type];
    box.innerHTML = '';
    list.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'menu-thumb';
      const img = document.createElement('img');
      img.alt = (type==='lunch'?'午餐':'飲料') + '菜單第 ' + (i+1) + ' 張';
      if (it.ref) img.onerror = () => menuImgFallback(img, it.ref, 600);
      img.src = it.preview || menuImgSrc(it.ref, 600);
      img.addEventListener('click', () => openMenuViewer(list.map(x => x.preview || x.ref), i));
      const rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'rm'; rm.textContent = '✕';
      rm.setAttribute('aria-label', '移除這張照片');
      rm.addEventListener('click', () => { list.splice(i, 1); renderMenuThumbs(type); });
      d.append(img, rm);
      if (!it.ref) { const b = document.createElement('span'); b.className = 'new-badge'; b.textContent = '新'; d.appendChild(b); }
      box.appendChild(d);
    });
    document.getElementById(type+'-menu-count').textContent = list.length ? `${list.length} / ${MENU_MAX} 張` : '';
  }

  async function onMenuFiles(type, input) {
    const files = [...input.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
    input.value = '';
    const room = MENU_MAX - menuState[type].length;
    if (room <= 0) { alert(`每種菜單最多 ${MENU_MAX} 張，請先移除舊照片`); return; }
    if (files.length > room) alert(`每種菜單最多 ${MENU_MAX} 張，只會加入前 ${room} 張`);
    const count = document.getElementById(type+'-menu-count');
    for (const f of files.slice(0, room)) {
      count.textContent = '處理照片中…';
      try {
        menuState[type].push({ preview: await compressImage(f), mime: 'image/jpeg' });
      } catch {
        alert('「' + f.name + '」無法讀取，請改用 JPG 或 PNG 照片');
      }
      renderMenuThumbs(type);
    }
  }

  // 縮小照片再上傳：最長邊 2000px、JPG，菜單上的小字仍看得清楚
  function compressImage(file, maxSide = 2000, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width  = Math.round(img.naturalWidth  * scale);
        c.height = Math.round(img.naturalHeight * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }


  function skipToDatePage() {
    document.getElementById('date-overlay').style.display='none';
    showPage('page-dates');
    document.getElementById('btn-row-input').style.display='none';
    document.getElementById('btn-row-dates').style.display='none';
    renderDateButtons();
  }

  function showDateDialog() { document.getElementById('date-overlay').style.display='flex'; }

  async function submitShops() {
    const lunch = document.getElementById('lunch-shop').value.trim();
    const drink = document.getElementById('drink-shop').value.trim();
    if (!lunch && !drink) { alert('請至少填入午餐或飲料的店家名稱'); return; }
    if (!lunch && menuState.lunch.length) { alert('已上傳午餐菜單照片，請填寫午餐店家名稱'); return; }
    if (!drink && menuState.drink.length) { alert('已上傳飲料菜單照片，請填寫飲料店家名稱'); return; }
    const btn = document.querySelector('#btn-row-input .btn-submit');
    if (btn.disabled) return;
    const newOf = t => menuState[t].filter(x => !x.ref).map(x => ({ data: x.preview, mime: x.mime }));
    const payload = { action:'saveMealMenu', date:currentDate, lunch, drink,
                      lunchMenuNew: newOf('lunch'), drinkMenuNew: newOf('drink') };
    if (menuState.ready) {   // 有讀到原本的照片，才告訴 GAS 要保留哪些（被 ✕ 的會移除）
      payload.lunchMenuKeep = menuState.lunch.filter(x => x.ref).map(x => x.ref);
      payload.drinkMenuKeep = menuState.drink.filter(x => x.ref).map(x => x.ref);
    }
    const hasNew = payload.lunchMenuNew.length + payload.drinkMenuNew.length > 0;
    btn.disabled=true; btn.textContent = hasNew ? '上傳照片中…' : '送出中…';
    try {
      const res = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify(payload)});
      const json = await res.json();
      if (json.status==='ok') {
        if (hasNew && !Array.isArray(json.lunchMenu))
          alert('⚠ 店家已儲存，但照片沒有存到。\nGAS 還是舊版本，請到「管理部署作業」建立新版本後再上傳一次。');
        if (Array.isArray(json.lunchMenu))
          menuCache[currentDate] = { date: currentDate, lunch, drink, lunchMenu: json.lunchMenu, drinkMenu: json.drinkMenu };
        menuState = { lunch: [], drink: [], ready: false };
        mealData[currentDate]={lunch,drink};
        localStorage.setItem('de_meal_data',JSON.stringify(mealData));
        showPage('page-dates');
        document.getElementById('btn-row-input').style.display='none';
        renderDateButtons();
        showToast(json.isUpdate?'✅ 已更新到 Google Sheets':'✅ 已新增到 Google Sheets');
        loadDateSelect();
      } else { alert('⚠ 送出失敗：'+(json.message||'未知錯誤')); }
    } catch { alert('⚠ 連線失敗，請確認網路後重試'); }
    finally { btn.disabled=false; btn.textContent='送出 →'; }
  }

  function showToast(msg) {
    let t=document.getElementById('toast');
    if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#06d6a0;color:#fff;padding:12px 24px;border-radius:14px;font-size:0.92rem;font-weight:600;z-index:1000;opacity:0;transition:all 0.3s;box-shadow:0 4px 16px rgba(0,0,0,0.15);max-width:320px;width:90%;text-align:center;';document.body.appendChild(t);}
    t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(-20px)';},2500);
  }

  let closedDates = new Set(); // 已結單日期集合

  async function loadClosedDates() {
    try {
      const res  = await fetch(`${GAS_URL}?action=getMealClosedDates`,{cache:'no-store'});
      const json = await res.json();
      if (json.status==='ok') closedDates = new Set(json.data);
    } catch {}
  }

  /* ── 從 Google Sheet 讀取已建立的日期（修正：原本只讀這台裝置的本機紀錄）── */
  async function syncMealData() {
    try {
      const res  = await fetch(`${GAS_URL}?action=getMealMenu`,{cache:'no-store'});
      const json = await res.json();
      if (json.status !== 'ok' || !Array.isArray(json.data)) return false;
      const fresh = {};
      json.data.forEach(item => {
        if (!item.date) return;
        fresh[item.date] = { lunch: item.lunch || '', drink: item.drink || '' };
        menuCache[item.date] = item;
      });
      mealData = fresh;   // 以 Google Sheet 為準，其他裝置新增/刪除的也會同步
      localStorage.setItem('de_meal_data', JSON.stringify(mealData));
      return true;
    } catch { return false; }   // 連不上時沿用本機紀錄
  }

  async function renderDateButtons() {
    const body=document.getElementById('dates-body'),count=document.getElementById('dates-count');
    if (!body.querySelector('.date-btn')) {
      body.innerHTML=`<div class="dates-empty"><span class="dates-empty-icon">⏳</span><p>載入中…</p></div>`;
    }
    const [synced] = await Promise.all([syncMealData(), loadClosedDates()]);
    if (!synced) showToast('⚠ 無法連線 Google Sheets，目前顯示的是這台裝置的紀錄');
    const keys=Object.keys(mealData).sort().reverse();
    body.innerHTML='';
    if (!keys.length) {
      body.innerHTML=`<div class="dates-empty"><span class="dates-empty-icon">📭</span><p>尚未建立任何日期的餐點</p></div>`;
      count.textContent=''; return;
    }
    count.textContent=`共 ${keys.length} 個日期`;
    keys.forEach((dateKey,i)=>{
      const data=mealData[dateKey];
      const d=new Date(dateKey+'T00:00:00');
      const label=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const weekdays=['日','一','二','三','四','五','六'];
      const weekday=weekdays[d.getDay()];
      const isClosed = closedDates.has(dateKey);
      const tags=[
        data.lunch?`<span class="tag tag-lunch">🍱 ${esc(data.lunch)}</span>`:'',
        data.drink?`<span class="tag tag-drink">🧋 ${esc(data.drink)}</span>`:''
      ].filter(Boolean).join('');
      const btn=document.createElement('button');
      btn.className='date-btn'+(isClosed?' is-closed':'');btn.style.animationDelay=(i*0.06)+'s';
      btn.innerHTML=`
        <div class="date-btn-left">
          <span class="date-btn-icon">${isClosed?'🔒':'📅'}</span>
          <div>
            <div class="date-main">${label}<span class="date-wk">週${weekday}</span>${isClosed?'<span class="closed-badge">🔒 已結單</span>':''}</div>
            <div class="date-btn-tags" style="margin-top:5px;">${tags}</div>
          </div>
        </div>
        <div class="date-actions">
          <span style="font-size:1.1rem;opacity:0.4;">›</span>
          <button class="btn-close-date${isClosed?' closed':''}"
            onclick="event.stopPropagation();toggleCloseDate('${dateKey}',${isClosed})">
            ${isClosed?'取消結單':'結單'}
          </button>
          <button class="btn-delete-date" onclick="event.stopPropagation();deleteDate('${dateKey}')">刪除</button>
        </div>`;
      btn.addEventListener('click',()=>openDateDetail(dateKey));
      body.appendChild(btn);
    });
  }

  /* ── 結單 / 取消結單 ── */
  async function toggleCloseDate(dateKey, isClosed) {
    const d=new Date(dateKey+'T00:00:00');
    const label=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const action = isClosed ? 'openMealDate' : 'closeMealDate';
    const confirmMsg = isClosed
      ? `確定要取消「${label}」的結單嗎？`
      : `確定要結單「${label}」嗎？\n結單後使用者將無法再點餐。`;
    if (!confirm(confirmMsg)) return;
    try {
      const res  = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action, date:dateKey})});
      const json = await res.json();
      if (json.status==='ok') {
        if (isClosed) closedDates.delete(dateKey);
        else closedDates.add(dateKey);
        showToast(isClosed ? '🔓 已取消結單 '+label : '🔒 已結單 '+label);
        renderDateButtons();
      } else { alert('⚠ 操作失敗：'+(json.message||'未知錯誤')); }
    } catch { alert('⚠ 連線失敗，請稍後再試'); }
  }

  async function deleteDate(dateKey) {
    const d=new Date(dateKey+'T00:00:00');
    const label=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!confirm(`確定要刪除「${label}」的餐點資料嗎？`)) return;
    try {
      const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'deleteMealMenu',date:dateKey})});
      const json=await res.json();
      if (json.status!=='ok') { alert('⚠ Google Sheets 刪除失敗：'+(json.message||'未知錯誤')); return; }
    } catch { alert('⚠ 連線失敗，無法同步刪除 Google Sheets'); return; }
    delete mealData[dateKey];
    localStorage.setItem('de_meal_data',JSON.stringify(mealData));
    renderDateButtons();
    showToast('🗑 已刪除 '+label);
    loadDateSelect();

  /* ── 下拉選單：從 GAS 載入日期 ── */
  async function loadDateSelect() {
    try {
      const res  = await fetch(`${GAS_URL}?action=getMealMenu`,{cache:'no-store'});
      const json = await res.json();
      const sel  = document.getElementById('order-date-select');
      const prev = sel.value;
      sel.innerHTML='<option value="">－ 請選擇日期 －</option>';
      if (json.status==='ok') {   // （新增）順便記下每個日期的菜單照片
        menuCache = {};
        json.data.forEach(item => { menuCache[item.date] = item; });
      }
      if (json.status==='ok' && json.data.length>0) {
        const sorted=[...json.data].sort((a,b)=>b.date.localeCompare(a.date));
        sorted.forEach(item=>{
          const opt=document.createElement('option');
          opt.value=item.date; opt.textContent=item.date;
          sel.appendChild(opt);
        });
        // 若之前有選取值且還存在，保持選取
        if (prev && [...sel.options].some(o=>o.value===prev)) sel.value=prev;
      }
      return json.status==='ok';
    } catch { return false; }
  }

  /* ── 依日期載入訂單 ── */

            </tr></thead>
            <tbody id="order-tbody"></tbody>
          </table>
        </div>`;

        const tr = document.createElement('tr');
        tr.className = 'row-clickable';

  /* ── 訂單清單：組成同一行的文字（新增） ── */
  function priceTag(p) {
    const v = String(p ?? '').trim();
    return v ? `<span class="ol-price">$${esc(v)}</span>` : '';
  }
  function lunchLine(r) {
    if (!String(r.lunchItem ?? '').trim()) return '<span class="ol-none">—</span>';
    return `<span class="ol-item">${esc(r.lunchItem)}</span>${priceTag(r.lunchPrice)}`;
  }
  function drinkLine(r) {
    if (!String(r.drinkItem ?? '').trim()) return '<span class="ol-none">—</span>';
    const opts = [r.sugar, r.ice].map(v => String(v ?? '').trim()).filter(Boolean).join('／');
    return `<span class="ol-item">${esc(r.drinkItem)}</span>`
         + (opts ? `<span class="ol-opt">${esc(opts)}</span>` : '')
         + priceTag(r.drinkPrice);
  }

  /* ── 餐點整理 ── */
  async function showArrangement() {
    const btn  = document.getElementById('btn-summary');
    const rows = btn._rows || [];
    const date = btn._date || '';
    const result = document.getElementById('arrange-result');
    if (!rows.length) return;

    // 排序函式：數字→大寫英文→小寫英文→注音→其他
    function sortKey(str) {
      const s = String(str || '').trim();
      if (!s) return '\uffff';
      const c = s.charCodeAt(0);
      if (c >= 48 && c <= 57)   return '0' + s;  // 數字
      if (c >= 65 && c <= 90)   return '1' + s;  // 大寫英文
      if (c >= 97 && c <= 122)  return '2' + s;  // 小寫英文
      if (c >= 0x3105 && c <= 0x312E) return '3' + s; // 注音
      return '4' + s; // 其他（中文等）
    }

    // ── 午餐整理 ──
    const lunchRows = rows.filter(r => r.lunchItem).map(r => ({ item: r.lunchItem, name: r.name }));
    lunchRows.sort((a, b) => sortKey(a.item).localeCompare(sortKey(b.item), 'zh-TW'));

    // ── 飲料整理 ──
    const drinkRows = rows.filter(r => r.drinkItem).map(r => ({ item: r.drinkItem, sugar: r.sugar, ice: r.ice, name: r.name }));
    drinkRows.sort((a, b) => sortKey(a.item).localeCompare(sortKey(b.item), 'zh-TW'));

    result.innerHTML = `
      <div class="arrange-card">
        <div class="arrange-card-header lunch-h">🍱 午餐整理</div>
        <div style="overflow-x:auto;">
          <table class="arrange-table">
            <thead><tr>
              <th class="lunch-th">餐點</th><th class="lunch-th">姓名</th>
            </tr></thead>
            <tbody>
              ${lunchRows.length ? lunchRows.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.name)}</td></tr>`).join('') : '<tr><td colspan="2" style="text-align:center;color:var(--muted);padding:16px;">無午餐資料</td></tr>'}
            </tbody>
          </table>
        </div>
        <div id="lunch-arrange-msg" class="arrange-save-msg"></div>
      </div>

      <div class="arrange-card">
        <div class="arrange-card-header drink-h">🧋 飲料整理</div>
        <div style="overflow-x:auto;">
          <table class="arrange-table">
            <thead><tr>
              <th class="drink-th">飲料</th><th class="drink-th">甜度</th><th class="drink-th">冰塊</th><th class="drink-th">姓名</th>
            </tr></thead>
            <tbody>
              ${drinkRows.length ? drinkRows.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.sugar)}</td><td>${esc(r.ice)}</td><td>${esc(r.name)}</td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px;">無飲料資料</td></tr>'}
            </tbody>
          </table>
        </div>
        <div id="drink-arrange-msg" class="arrange-save-msg"></div>
      </div>`;

    // 同步寫入 GAS
    try {
      const [lunchRes, drinkRes] = await Promise.all([
        fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ action:'saveLunchSummary', date, rows: lunchRows }) }),
        fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ action:'saveDrinkSummary', date, rows: drinkRows }) })
      ]);
      const lunchJson = await lunchRes.json();
      const drinkJson = await drinkRes.json();

      const lMsg = document.getElementById('lunch-arrange-msg');
      const dMsg = document.getElementById('drink-arrange-msg');
      lMsg.style.color = lunchJson.status==='ok' ? '#04a87e' : '#e05555';
      lMsg.textContent = lunchJson.status==='ok' ? '✅ 已同步儲存至「午餐整理」' : '⚠ 儲存失敗：'+(lunchJson.message||'');
      dMsg.style.color = drinkJson.status==='ok' ? '#04a87e' : '#e05555';
      dMsg.textContent = drinkJson.status==='ok' ? '✅ 已同步儲存至「飲料整理」' : '⚠ 儲存失敗：'+(drinkJson.message||'');
    } catch {
      const lMsg = document.getElementById('lunch-arrange-msg');
      if (lMsg) { lMsg.style.color='#e05555'; lMsg.textContent='⚠ 連線失敗'; }
    }
  }

    const lunchItem  = document.getElementById('edit-lunch-item').value.trim();
    const lunchPrice = document.getElementById('edit-lunch-price').value.trim();
    const drinkItem  = document.getElementById('edit-drink-item').value.trim();

  /* ── 刪除後重新計算並同步寫入三個工作表 ── */
  async function refreshSummarySheets(date) {
    try {
      const res  = await fetch(`${GAS_URL}?action=getMealOrders&date=${encodeURIComponent(date)}`,{cache:'no-store'});
      const json = await res.json();
      if (json.status !== 'ok') return;
      const rows = json.data;

      // 重新計算
      const names = [...new Set(rows.map(r => r.name).filter(Boolean))];
      const personData = names.map(name => {
        const pr = rows.filter(r => r.name === name);
        return {
          name,
          lunchTotal: pr.reduce((s,r) => s + (parseInt(r.lunchPrice)||0), 0),
          drinkTotal: pr.reduce((s,r) => s + (parseInt(r.drinkPrice)||0), 0)
        };
      });
      const dateLunchTotal = rows.reduce((s,r) => s + (parseInt(r.lunchPrice)||0), 0);
      const dateDrinkTotal = rows.reduce((s,r) => s + (parseInt(r.drinkPrice)||0), 0);
      const dateTotal = dateLunchTotal + dateDrinkTotal;

      function sortKey(str) {
        const s = String(str||'').trim(); if(!s) return '\uffff';
        const c = s.charCodeAt(0);
        if(c>=48&&c<=57) return '0'+s; if(c>=65&&c<=90) return '1'+s;
        if(c>=97&&c<=122) return '2'+s; if(c>=0x3105&&c<=0x312E) return '3'+s;
        return '4'+s;
      }
      const lunchRows = rows.filter(r=>r.lunchItem).map(r=>({item:r.lunchItem,name:r.name}));
      lunchRows.sort((a,b)=>sortKey(a.item).localeCompare(sortKey(b.item),'zh-TW'));
      const drinkRows = rows.filter(r=>r.drinkItem).map(r=>({item:r.drinkItem,sugar:r.sugar,ice:r.ice,name:r.name}));
      drinkRows.sort((a,b)=>sortKey(a.item).localeCompare(sortKey(b.item),'zh-TW'));

      // 同步寫入
      await Promise.all([
        fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({action:'saveMealSummary',date,personRows:personData,dateLunchTotal,dateDrinkTotal,dateTotal})}),
        fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({action:'saveLunchSummary',date,rows:lunchRows})}),
        fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({action:'saveDrinkSummary',date,rows:drinkRows})})
      ]);
    } catch {}
  }

  // 點擊 overlay 背景關閉
  document.getElementById('edit-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  /* ── 菜單照片：網址與放大檢視（新增）── */
  function isMenuRef(x) { return !/^(https?:|data:)/.test(x); }   // 雲端硬碟檔案 ID
  function menuImgSrc(x, w) {
    return isMenuRef(x) ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(x)}&sz=w${w || 600}` : x;
  }
  function menuImgFallback(img, x, w) {   // 縮圖網址失敗時換另一個網址
    if (img.dataset.fb || !isMenuRef(x)) return;
    img.dataset.fb = '1';
    img.src = `https://lh3.googleusercontent.com/d/${encodeURIComponent(x)}=w${w || 1600}`;
  }
  let mvList = [], mvIdx = 0;
  function ensureMenuViewer() {
    let v = document.getElementById('menu-viewer');
    if (v) return v;
    v = document.createElement('div');
    v.id = 'menu-viewer'; v.className = 'menu-viewer';
    v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', '菜單照片');
    v.innerHTML = `<img id="mv-img" alt="菜單照片"/>
      <div class="mv-bar">
        <button class="mv-btn" id="mv-prev" aria-label="上一張">‹</button>
        <span id="mv-count"></span>
        <button class="mv-btn" id="mv-next" aria-label="下一張">›</button>
        <a class="mv-btn" id="mv-open" target="_blank" rel="noopener">原圖</a>
        <button class="mv-btn" id="mv-close">✕ 關閉</button>
      </div>`;
    document.body.appendChild(v);
    v.addEventListener('click', e => { if (e.target === v) closeMenuViewer(); });
    v.querySelector('#mv-prev').onclick = () => { mvIdx = (mvIdx - 1 + mvList.length) % mvList.length; showMenuViewer(); };
    v.querySelector('#mv-next').onclick = () => { mvIdx = (mvIdx + 1) % mvList.length; showMenuViewer(); };
    v.querySelector('#mv-close').onclick = closeMenuViewer;
    document.addEventListener('keydown', e => {
      if (!v.classList.contains('show')) return;
      if (e.key === 'Escape') closeMenuViewer();
      if (e.key === 'ArrowLeft'  && mvList.length > 1) v.querySelector('#mv-prev').click();
      if (e.key === 'ArrowRight' && mvList.length > 1) v.querySelector('#mv-next').click();
    });
    return v;
  }
  function openMenuViewer(list, idx) {
    if (!list || !list.length) return;
    mvList = list; mvIdx = idx || 0;
    ensureMenuViewer().classList.add('show');
    showMenuViewer();
  }
  function showMenuViewer() {
    const x = mvList[mvIdx];
    const img = document.getElementById('mv-img');
    img.dataset.fb = '';
    img.onerror = () => menuImgFallback(img, x, 2000);
    img.src = menuImgSrc(x, 2000);
    const many = mvList.length > 1;
    document.getElementById('mv-prev').style.display = many ? '' : 'none';
    document.getElementById('mv-next').style.display = many ? '' : 'none';
    document.getElementById('mv-count').textContent = many ? `${mvIdx + 1} / ${mvList.length}` : '';
    const open = document.getElementById('mv-open');
    if (x.startsWith('data:')) open.style.display = 'none';
    else { open.style.display = ''; open.href = isMenuRef(x) ? `https://drive.google.com/file/d/${x}/view` : x; }
  }
  function closeMenuViewer() {
    const v = document.getElementById('menu-viewer');
    if (v) v.classList.remove('show');
  }

  function esc(s){return(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
